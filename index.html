    // Popup rincian satu guru: absensi, RPP, dan nilai
    function lihatDetailGuru(idGuru) {
      const baca = function(kunci) {
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };

      // Nama guru diambil dari hasil laporan bila datanya dari server
      const guru = SRV.laporan
        ? SRV.laporan.guru.find(function(u) { return String(u.id) === String(idGuru); })
        : baca('sip_users').find(function(u) { return u && String(u.id) === String(idGuru); });
      if (!guru) {
        showNotif('Data guru tidak ditemukan', 'error');
        return;
      }

      // Membuka guru yang berbeda mengembalikan pilihan tab ke Absensi.
      // Saat tombol tab ditekan, idGuru-nya sama sehingga pilihan tab dipertahankan.
      if (String(guruDetailAktif) !== String(idGuru)) tabDetailGuru = 'absensi';

      const idg = String(idGuru);
      const mapel = _srv('mapel', 'sip_mapel');
      const kelas = _srv('kelas', 'sip_kelas');
      const siswa = _srv('siswa', 'sip_siswa');

      // Nama acuan; bila datanya belum ada, id ditampilkan apa adanya
      const namaAcuan = function(daftar, id, kolom) {
        if (id === undefined || id === null || id === '') return '-';
        const k = daftar.find(function(x) { return x && String(x.id) === String(id); });
        return k ? (k[kolom] || String(id)) : String(id);
      };

      // Ambil sepuluh data terbaru dalam rentang tanggal yang sedang dipakai
      // Peta kunci localStorage ke titipan server yang sepadan
      const sumber = { sip_absensi: 'absensiGuru', sip_rpp: 'rpp', sip_nilai: 'nilai' };
      const ambil = function(kunci) {
        const d = filterByTanggal(_srv(sumber[kunci], kunci), laporanFilter.tglMulai, laporanFilter.tglAkhir)
          .filter(function(x) { return String(x.id_guru) === idg; });
        d.sort(function(a, b) { return new Date(b.tgl) - new Date(a.tgl); });
        return d.slice(0, 10);
      };

      const kosong = function(kolom) {
        return '<tr><td colspan="' + kolom + '"><p class="pesan-info">Tidak ada data untuk periode yang dipilih</p></td></tr>';
      };

      let isiTab = '';
      if (tabDetailGuru === 'rpp') {
        const d = ambil('sip_rpp');
        isiTab =
          '<table class="tabel tabel--ringkas"><thead><tr>' +
            '<th>Tanggal</th><th>Mapel</th><th>Kelas</th><th>Materi</th>' +
          '</tr></thead><tbody>' +
          (d.length ? d.map(function(r) {
            const materi = String(r.materi || '-');
            return '<tr>' +
                     '<td>' + formatTanggal(r.tgl) + '</td>' +
                     '<td>' + namaAcuan(mapel, r.id_mapel, 'nama') + '</td>' +
                     '<td>' + namaAcuan(kelas, r.id_kelas, 'nama') + '</td>' +
                     '<td>' + (materi.length > 50 ? materi.slice(0, 50) + '…' : materi) + '</td>' +
                   '</tr>';
          }).join('') : kosong(4)) +
          '</tbody></table>';
      } else if (tabDetailGuru === 'nilai') {
        const d = ambil('sip_nilai');
        isiTab =
          '<table class="tabel tabel--ringkas"><thead><tr>' +
            '<th>Siswa</th><th>Mapel</th><th>Jenis</th><th>Nilai</th>' +
          '</tr></thead><tbody>' +
          (d.length ? d.map(function(n) {
            return '<tr>' +
                     '<td>' + namaAcuan(siswa, n.id_siswa, 'nama_lengkap') + '</td>' +
                     '<td>' + namaAcuan(mapel, n.id_mapel, 'nama') + '</td>' +
                     '<td>' + (n.jenis || '-') + '</td>' +
                     '<td>' + (n.nilai === undefined || n.nilai === null || n.nilai === '' ? '-' : n.nilai) + '</td>' +
                   '</tr>';
          }).join('') : kosong(4)) +
          '</tbody></table>';
      } else {
        const d = ambil('sip_absensi');
        isiTab =
          '<table class="tabel tabel--ringkas"><thead><tr>' +
            '<th>Tanggal</th><th>Jam Masuk</th><th>Jam Keluar</th><th>Status</th>' +
          '</tr></thead><tbody>' +
          (d.length ? d.map(function(a) {
            return '<tr>' +
                     '<td>' + formatTanggal(a.tgl) + '</td>' +
                     '<td>' + (a.jam_masuk || '-') + '</td>' +
                     '<td>' + (a.jam_keluar || '-') + '</td>' +
                     '<td>' + (a.status || '-') + '</td>' +
                   '</tr>';
          }).join('') : kosong(4)) +
          '</tbody></table>';
      }

      const tab = [
        { nilai: 'absensi', teks: 'Absensi' },
        { nilai: 'rpp', teks: 'RPP' },
        { nilai: 'nilai', teks: 'Nilai' }
      ].map(function(t) {
        const aktif = (t.nilai === tabDetailGuru) ? ' active' : '';
        return '<button class="tab-btn' + aktif + '" ' +
               'onclick="tabDetailGuru=\'' + t.nilai + '\';lihatDetailGuru(' + idGuru + ')">' + t.teks + '</button>';
      }).join('');

      const jenisGuru = String(guru.subrole || '').toLowerCase() === 'walikelas' ? 'Guru Wali Kelas' : 'Guru Mapel';

      // Popup lama dibuang dulu agar tidak menumpuk. Penanda guru aktif diisi
      // setelahnya karena tutupDetailGuru() mengosongkan penanda itu.
      tutupDetailGuru();
      guruDetailAktif = idGuru;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.setAttribute('onclick', 'if(event.target===this)tutupDetailGuru()');
      overlay.innerHTML =
        '<div class="modal">' +
          '<div class="modal-head">' +
            '<span class="modal-judul">' + (guru.nama || '-') + '<br><span class="peng-tgl">' + jenisGuru + '</span></span>' +
            '<button class="modal-tutup" title="Tutup" onclick="tutupDetailGuru()">' +
              '<i class="fa-solid fa-xmark"></i></button>' +
          '</div>' +
          '<div class="tab-bar">' + tab + '</div>' +
          '<div class="tabel-scroll">' + isiTab + '</div>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    // Urutan tampil role pada tabel pengguna
    const URUTAN_ROLE = ['kepsek', 'ktu', 'bendahara', 'guru', 'walimurid'];

    // Susun isi tabel pengguna sesuai penyaring yang sedang aktif.
    // Dipisah dari kepsekAksesDataPengguna() supaya penyaringan langsung
    // hanya menggambar ulang tabelnya, sehingga fokus ketikan tidak hilang.
    function htmlTabelPengguna() {
      const users = _srv('users', 'sip_users').filter(function(u) {
        return u && u.id !== undefined;
      });

      const cari = String(filterPengguna.cari || '').trim().toLowerCase();
      const role = String(filterPengguna.role || '').toLowerCase();
      const status = String(filterPengguna.status || '').toLowerCase();

      const hasil = users.filter(function(u) {
        // Pencarian pada nama dan surel, tanpa membedakan huruf besar kecil
        if (cari) {
          const gabung = (String(u.nama || '') + ' ' + String(u.email || '')).toLowerCase();
          if (gabung.indexOf(cari) === -1) return false;
        }
        if (role && String(u.role || '').toLowerCase() !== role) return false;
        if (status === 'aktif' && u.aktif === false) return false;
        if (status === 'nonaktif' && u.aktif !== false) return false;
        return true;
      });

      // Urut berdasarkan role lebih dulu, lalu nama A-Z
      hasil.sort(function(a, b) {
        const ia = URUTAN_ROLE.indexOf(String(a.role || '').toLowerCase());
        const ib = URUTAN_ROLE.indexOf(String(b.role || '').toLowerCase());
        const pa = ia === -1 ? URUTAN_ROLE.length : ia;
        const pb = ib === -1 ? URUTAN_ROLE.length : ib;
        if (pa !== pb) return pa - pb;
        return String(a.nama || '').localeCompare(String(b.nama || ''));
      });

      if (hasil.length === 0) {
        return '<p class="pesan-info">Tidak ada pengguna yang cocok dengan pencarian</p>';
      }

      const baris = hasil.map(function(u, urut) {
        const r = String(u.role || '').toLowerCase();
        const aktif = (u.aktif !== false);
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (u.nama || '-') + '</td>' +
                 '<td class="sel-copy">' + (u.email || '-') + '</td>' +
                 '<td><span class="badge badge--' + r + '">' + labelRole(u.role, u.subrole) + '</span></td>' +
                 '<td><span class="badge badge--' + (aktif ? 'aktif' : 'merah') + '">' +
                   (aktif ? 'Aktif' : 'Nonaktif') + '</span></td>' +
                 '<td><div class="aksi-grup">' +
                   '<button class="btn-aksi btn-edit" id="reset-pin-' + u.id + '" onclick="resetPinUser(' + u.id + ')">' +
                     '<i class="fa-solid fa-key"></i>Reset PIN</button>' +
                   '<button class="btn-aksi btn-detail" title="Lihat detail" onclick="lihatDetailUser(' + u.id + ')">' +
                     '<i class="fa-solid fa-eye"></i></button>' +
                 '</div></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap">' +
               '<table class="tabel">' +
                 '<thead><tr>' +
                   '<th>No</th><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Aksi</th>' +
                 '</tr></thead>' +
                 '<tbody>' + baris + '</tbody>' +
               '</table>' +
             '</div>';
    }

    // Popup rincian satu pengguna. PIN tidak pernah ikut ditampilkan.
    function lihatDetailUser(userId) {
      const users = _srv('users', 'sip_users');

      const u = users.find(function(x) { return x && String(x.id) === String(userId); });
      if (!u) {
        showNotif('Pengguna tidak ditemukan', 'error');
        return;
      }

      const tampil = function(nilai) {
        if (nilai === undefined || nilai === null || String(nilai).trim() === '') return '-';
        return String(nilai);
      };
      const dua = function(n) { return String(n).padStart(2, '0'); };
      const tglJam = function(nilai) {
        if (!nilai) return '-';
        const t = new Date(nilai);
        if (isNaN(t.getTime())) return '-';
        return formatTanggal(t) + ' ' + dua(t.getHours()) + ':' + dua(t.getMinutes());
      };

      // Token berlaku 24 jam sejak login, jadi waktu login diperkirakan
      // dengan mengurangi masa berlaku itu dari token_expired
      let terakhirLogin = '-';
      if (u.token_expired) {
        const kadaluarsa = new Date(u.token_expired);
        if (!isNaN(kadaluarsa.getTime())) {
          terakhirLogin = tglJam(new Date(kadaluarsa.getTime() - 24 * 60 * 60 * 1000)) + ' (perkiraan)';
        }
      }

      const r = String(u.role || '').toLowerCase();
      const aktif = (u.aktif !== false);

      const item = function(label, nilai, penuh) {
        return '<div class="detail-item' + (penuh ? ' detail-item--full' : '') + '">' +
                 '<span class="detail-label">' + label + '</span>' +
                 '<span class="detail-nilai">' + nilai + '</span>' +
               '</div>';
      };

      // Popup lama dibuang dulu agar tidak menumpuk
      tutupDetailUser();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.setAttribute('onclick', 'if(event.target===this)tutupDetailUser()');
      overlay.innerHTML =
        '<div class="modal">' +
          '<div class="modal-head">' +
            '<span class="modal-judul">' + tampil(u.nama) + '</span>' +
            '<button class="modal-tutup" title="Tutup" onclick="tutupDetailUser()">' +
              '<i class="fa-solid fa-xmark"></i></button>' +
          '</div>' +
          '<div class="detail-section"><h4>Informasi Akun</h4><div class="detail-grid">' +
            item('Nama Lengkap', tampil(u.nama)) +
            item('Email', '<span class="sel-copy">' + tampil(u.email) + '</span>') +
            item('Role', '<span class="badge badge--' + r + '">' + labelRole(u.role, u.subrole) + '</span>') +
            item('Subrole', r === 'guru' ? tampil(u.subrole) : '-') +
            item('Status', '<span class="badge badge--' + (aktif ? 'aktif' : 'merah') + '">' +
                 (aktif ? 'Aktif' : 'Nonaktif') + '</span>') +
            item('Tanggal Terdaftar', u.tgl_daftar ? formatTanggal(u.tgl_daftar) : '-') +
            item('Terakhir Login', terakhirLogin, true) +
          '</div></div>' +
          '<button class="btn btn--full" onclick="resetPinUser(' + u.id + ')">' +
            '<i class="fa-solid fa-key"></i> Reset PIN</button>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    // Buat PIN baru enam digit untuk satu pengguna
    async function resetPinUser(userId) {
      const sesi = getSession();
      const users = _srv('users', 'sip_users');

      const i = users.findIndex(function(u) { return u && String(u.id) === String(userId); });
      if (i === -1) {
        showNotif('Pengguna tidak ditemukan', 'error');
        return;
      }

      const nama = users[i].nama || 'Pengguna';
      if (!confirm('Reset PIN untuk ' + nama + '? PIN baru akan dibuat otomatis.')) return;

      if (MODE_API) {
        // PIN baru dibuat server dan disebut pada pesan balasannya
        await _kirimAksi('reset-pin-' + userId, 'resetPin',
          { userId: userId }, 'aksesPengguna', 'Mereset');
        return;
      }

      // PIN acak enam digit, 100000 sampai 999999
      const pinBaru = String(Math.floor(100000 + Math.random() * 900000));
      users[i].pin = pinBaru;
      localStorage.setItem('sip_users', JSON.stringify(users));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({ aksi: 'reset_pin', userId: userId, oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      alert('PIN baru untuk ' + nama + ': ' + pinBaru + '. Mohon dicatat, PIN ini hanya ditampilkan sekali.');

      // Tabel digambar ulang bila modulnya sedang terbuka
      if (document.getElementById('tabel-pengguna')) {
        document.getElementById('tabel-pengguna').innerHTML = htmlTabelPengguna();
      }
      showNotif('PIN ' + nama + ' berhasil direset', 'success');
    }

    // Dipakai jalur server maupun jalur localStorage.
    function _htmlIsiDashBendahara() {
      const transaksi = _srv('transaksi', 'sip_transaksi');
      const tagihan = _srv('tagihan', 'sip_tagihan');
      const siswa = _srv('siswa', 'sip_siswa');
      const biaya = _srv('biaya', 'sip_biaya');

      const kini = new Date();
      const bulanIni = kini.getMonth();
      const tahunIni = kini.getFullYear();

      // Benarkah tanggal ini jatuh pada bulan dan tahun berjalan
      const bulanBerjalan = function(nilai) {
        if (!nilai) return false;
        const t = new Date(nilai);
        if (isNaN(t.getTime())) return false;
        return t.getMonth() === bulanIni && t.getFullYear() === tahunIni;
      };

      // --- Kartu 1 dan 2: pemasukan dan pengeluaran bulan berjalan ---
      const jumlahkan = function(tipe) {
        return transaksi
          .filter(function(t) {
            return t && String(t.tipe || '').toLowerCase() === tipe && bulanBerjalan(t.tgl);
          })
          .reduce(function(total, t) { return total + (Number(t.jumlah) || 0); }, 0);
      };
      const pemasukan = jumlahkan('pemasukan');
      const pengeluaran = jumlahkan('pengeluaran');

      // --- Kartu 3: banyaknya siswa yang punya tagihan menunggak ---
      // Menunggak berarti sudah lewat jatuh tempo dan belum lunas
      const penunggak = {};
      tagihan.forEach(function(t) {
        if (!t || String(t.status_bayar || '').toLowerCase() === 'lunas') return;
        if (!t.jatuh_tempo) return;
        const jt = new Date(t.jatuh_tempo);
        if (isNaN(jt.getTime()) || jt >= kini) return;
        penunggak[String(t.id_siswa)] = true;
      });

      // --- Kartu 4: tagihan yang jatuh tempo pada bulan berjalan ---
      const jatuhTempoBulanIni = tagihan.filter(function(t) {
        return t && bulanBerjalan(t.jatuh_tempo);
      });

      const kartu = [
        { angka: formatRupiah(pemasukan),   label: 'Total Pemasukan Bulan Ini',   ikon: 'fa-arrow-down',     warna: 'hijau',  ikonWarna: 'hijau',  rupiah: true },
        { angka: formatRupiah(pengeluaran), label: 'Total Pengeluaran Bulan Ini', ikon: 'fa-arrow-up',       warna: 'merah',  ikonWarna: 'merah',  rupiah: true },
        { angka: Object.keys(penunggak).length, label: 'Jumlah Penunggak',        ikon: 'fa-user-clock',     warna: 'oranye', ikonWarna: 'oranye', rupiah: false },
        { angka: jatuhTempoBulanIni.length, label: 'Tagihan Jatuh Tempo',         ikon: 'fa-calendar-times', warna: 'biru',   ikonWarna: 'biru',   rupiah: false }
      ];

      const htmlKartu = kartu.map(function(k, i) {
        return '<div class="stat-card stat-card--' + k.warna + '" style="animation-delay:' + ((i + 1) / 10) + 's">' +
                 '<i class="fa-solid ' + k.ikon + ' stat-icon stat-icon--' + k.ikonWarna + '"></i>' +
                 '<div class="stat-number' + (k.rupiah ? ' stat-number--rupiah' : '') + '">' + k.angka + '</div>' +
                 '<div class="stat-label">' + k.label + '</div>' +
               '</div>';
      }).join('');

      // --- Grafik enam bulan terakhir ---
      // Datanya dititipkan pada atribut kanvas, lalu dibaca gambarGrafikKeuangan()
      const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni',
                          'Juli','Agustus','September','Oktober','November','Desember'];
      const label = [];
      const dataMasuk = [];
      const dataKeluar = [];
      let adaDataGrafik = false;

      for (let m = 5; m >= 0; m--) {
        const acuan = new Date(tahunIni, bulanIni - m, 1);
        label.push(NAMA_BULAN[acuan.getMonth()] + ' ' + String(acuan.getFullYear()).slice(-2));

        let masuk = 0, keluar = 0;
        transaksi.forEach(function(t) {
          if (!t || !t.tgl) return;
          const tg = new Date(t.tgl);
          if (isNaN(tg.getTime())) return;
          if (tg.getMonth() !== acuan.getMonth() || tg.getFullYear() !== acuan.getFullYear()) return;
          const tipe = String(t.tipe || '').toLowerCase();
          if (tipe === 'pemasukan') { masuk += Number(t.jumlah) || 0; adaDataGrafik = true; }
          else if (tipe === 'pengeluaran') { keluar += Number(t.jumlah) || 0; adaDataGrafik = true; }
        });
        dataMasuk.push(masuk);
        dataKeluar.push(keluar);
      }

      const htmlGrafik =
        '<div class="card">' +
          '<h2 class="section-title">Grafik Keuangan 6 Bulan Terakhir</h2>' +
          (adaDataGrafik
            ? '<div class="grafik-wadah"><canvas id="grafikKeuangan" ' +
                'data-label=\'' + JSON.stringify(label) + '\' ' +
                'data-masuk=\'' + JSON.stringify(dataMasuk) + '\' ' +
                'data-keluar=\'' + JSON.stringify(dataKeluar) + '\'></canvas></div>'
            : '<p class="pesan-info">Belum ada data keuangan</p>') +
        '</div>';

      // --- Tabel tagihan jatuh tempo bulan berjalan, maksimal lima terbaru ---
      const daftarTagihan = jatuhTempoBulanIni.slice();
      daftarTagihan.sort(function(a, b) {
        const selisih = new Date(b.jatuh_tempo) - new Date(a.jatuh_tempo);
        if (selisih !== 0) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });
      const limaTeratas = daftarTagihan.slice(0, 5);

      let isiTabel;
      if (limaTeratas.length === 0) {
        isiTabel = '<p class="pesan-info">Tidak ada tagihan jatuh tempo bulan ini</p>';
      } else {
        const baris = limaTeratas.map(function(t, urut) {
          const s = siswa.find(function(x) { return x && String(x.id) === String(t.id_siswa); });
          const b = biaya.find(function(x) { return x && String(x.id) === String(t.id_biaya); });
          const lunas = String(t.status_bayar || '').toLowerCase() === 'lunas';
          return '<tr>' +
                   '<td>' + (urut + 1) + '</td>' +
                   '<td>' + (s && s.nis ? s.nis : '-') + '</td>' +
                   '<td>' + (s && (s.nama_lengkap || s.nama) ? (s.nama_lengkap || s.nama) : '-') + '</td>' +
                   '<td>' + (b && b.nama_biaya ? b.nama_biaya : '-') + '</td>' +
                   '<td>' + formatRupiah(t.nominal) + '</td>' +
                   '<td>' + formatTanggal(t.jatuh_tempo) + '</td>' +
                   '<td><span class="badge badge--' + (lunas ? 'aktif' : 'merah') + '">' +
                     (lunas ? 'Lunas' : 'Belum Lunas') + '</span></td>' +
                 '</tr>';
        }).join('');

        isiTabel =
          '<div class="tabel-wrap">' +
            '<table class="tabel">' +
              '<thead><tr>' +
                '<th>No</th><th>NIS</th><th>Nama Siswa</th><th>Jenis Biaya</th>' +
                '<th>Nominal</th><th>Jatuh Tempo</th><th>Status</th>' +
              '</tr></thead>' +
              '<tbody>' + baris + '</tbody>' +
            '</table>' +
          '</div>';
      }

      const htmlTabel =
        '<div class="card">' +
          '<div class="card-head">' +
            '<h2 class="section-title">Tagihan Jatuh Tempo Bulan Ini</h2>' +
            '<button class="btn-aksi btn-setujui" onclick="loadModule(\'Pencatatan Pembayaran\')">' +
              '<i class="fa-solid fa-list"></i>Lihat Semua</button>' +
          '</div>' +
          isiTabel +
        '</div>';

      return '<div class="stat-grid stat-grid--dua">' + htmlKartu + '</div>' +
             htmlGrafik + htmlTabel;
    }

    // Empat daftar dijemput serentak. getTagihan dan getTransaksi tidak
    // membawa nama siswa maupun nama biaya, jadi keduanya ikut dijemput
    // supaya tabel jatuh tempo tetap menyebut nama, bukan sekadar nomor.
    PEMUAT.dashboardBendahara = function() {
      return _muatModul('isi-dash-bendahara',
        [['getTransaksi'], ['getTagihan'], ['getSiswa'], ['getBiaya']],
        function(d) {
          _srvIsi({ transaksi: d[0], tagihan: d[1], siswa: d[2], biaya: d[3] });
          const html = _htmlIsiDashBendahara();

          // Kanvasnya baru ada setelah HTML ini menempel, jadi grafiknya
          // digambar pada putaran berikutnya, bukan sekarang.
          setTimeout(gambarGrafikKeuangan, 0);
          return html;
        }, 'dashboardBendahara', 4);
    };

    // Gambar grafik batang pemasukan dan pengeluaran pada kanvas yang tersedia
    function gambarGrafikKeuangan() {
      const kanvas = document.getElementById('grafikKeuangan');
      if (!kanvas || typeof Chart === 'undefined') return;

      // Grafik lama dibuang agar kanvas bisa dipakai ulang
      if (grafikKeuangan) {
        grafikKeuangan.destroy();
        grafikKeuangan = null;
      }

      let label = [], masuk = [], keluar = [];
      try {
        label = JSON.parse(kanvas.getAttribute('data-label')) || [];
        masuk = JSON.parse(kanvas.getAttribute('data-masuk')) || [];
        keluar = JSON.parse(kanvas.getAttribute('data-keluar')) || [];
      } catch (e) {
        return;
      }

      // Warna tulisan dan garis bantu mengikuti tema yang sedang dipakai
      const gaya = getComputedStyle(document.documentElement);
      const warnaTeks = gaya.getPropertyValue('--text-light').trim() || '#555';
      const gelap = document.documentElement.getAttribute('data-theme') === 'dark';
      const warnaGaris = gelap ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';

      grafikKeuangan = new Chart(kanvas, {
        type: 'bar',
        data: {
          labels: label,
          datasets: [
            { label: 'Pemasukan', data: masuk, backgroundColor: '#2D6A4F', borderRadius: 6 },
            { label: 'Pengeluaran', data: keluar, backgroundColor: '#E74C3C', borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: warnaTeks, font: { family: 'Poppins' } } },
            tooltip: {
              callbacks: {
                label: function(ctx) { return ctx.dataset.label + ': ' + formatRupiah(ctx.parsed.y); }
              }
            }
          },
          scales: {
            x: { ticks: { color: warnaTeks, font: { family: 'Poppins' } }, grid: { color: warnaGaris } },
            y: {
              beginAtZero: true,
              ticks: {
                color: warnaTeks,
                font: { family: 'Poppins' },
                callback: function(v) { return formatRupiah(v); }
              },
              grid: { color: warnaGaris }
            }
          }
        }
      });
    }

    // ================= MODUL PENGUMUMAN TAGIHAN (BENDAHARA) =================

    // Kumpulkan tagihan yang sudah lewat jatuh tempo dan belum lunas
    function daftarTagihanMenunggak() {
      const baca = function(kunci) {
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };

      const kini = new Date();
      const hasil = [];

      baca('sip_tagihan').forEach(function(t) {
        if (!t) return;
        if (String(t.status_bayar || '').toLowerCase() === 'lunas') return;
        if (!t.jatuh_tempo) return;
        const jt = new Date(t.jatuh_tempo);
        if (isNaN(jt.getTime()) || jt >= kini) return;
        hasil.push({
          tagihan: t,
          telat: Math.floor((kini - jt) / (1000 * 60 * 60 * 24))
        });
      });

      // Yang paling lama menunggak berada di atas
      hasil.sort(function(a, b) { return b.telat - a.telat; });
      return hasil;
    }

    // Modul Pengumuman Tagihan milik Bendahara, mengembalikan HTML siap tampil
    function bendaharaTagihan() {
      if (MODE_API) return '<div id="isi-peng-tagihan" data-muat="pengumumanTagihan"></div>';
      return _htmlIsiPengTagihan();
    }

    PEMUAT.pengumumanTagihan = function() {
      return _muatModul('isi-peng-tagihan',
        [['getBiaya'], ['getSiswa'], ['getTagihan'], ['getPengumuman']],
        function(d) {
          _srvIsi({ biaya: d[0], siswa: d[1], tagihan: d[2], pengumuman: d[3] });
          return _htmlIsiPengTagihan();
        }, 'pengumumanTagihan', 4);
    };

    function _htmlIsiPengTagihan() {
      const sesi = getSession();
      const baca = function(kunci) {
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };

      const siswa = _srv('siswa', 'sip_siswa');
      // Bendahara tidak berhak membaca daftar akun, jadi nama wali diambil
      // dari data siswa itu sendiri
      const dariServer = Array.isArray(SRV.siswa);
      const users = dariServer ? [] : _bacaArr('sip_users');
      const biaya = _srv('biaya', 'sip_biaya');
      const menunggak = daftarTagihanMenunggak();

      // --- Bagian atas: daftar siswa menunggak ---
      let bagianMenunggak;
      if (menunggak.length === 0) {
        bagianMenunggak =
          '<div class="card kosong-card">' +
            '<i class="fa-solid fa-check-circle kosong-ikon"></i>' +
            '<span class="kosong-teks">Semua tagihan sudah lunas</span>' +
          '</div>';
      } else {
        const baris = menunggak.map(function(m, urut) {
          const t = m.tagihan;
          const s = siswa.find(function(x) { return x && String(x.id) === String(t.id_siswa); });
          const b = biaya.find(function(x) { return x && String(x.id) === String(t.id_biaya); });

          // Nama wali murid: dari kolom siswa bila datanya dari server,
          // selain itu dicari pada daftar akun
          let namaWali = '-';
          if (s && dariServer) {
            namaWali = s.nama_ayah || s.nama_ibu || s.email_wali_murid || '-';
          } else if (s && s.id_wali_murid !== undefined && s.id_wali_murid !== null && s.id_wali_murid !== '') {
            const w = users.find(function(x) { return x && String(x.id) === String(s.id_wali_murid); });
            if (w) namaWali = w.nama || '-';
          }

          return '<tr>' +
                   '<td>' + (urut + 1) + '</td>' +
                   '<td>' + (s && s.nis ? s.nis : '-') + '</td>' +
                   '<td>' + (s && (s.nama_lengkap || s.nama) ? (s.nama_lengkap || s.nama) : '-') + '</td>' +
                   '<td>' + namaWali + '</td>' +
                   '<td>' + (b && b.nama_biaya ? b.nama_biaya : '-') + '</td>' +
                   '<td>' + formatRupiah(t.nominal) + '</td>' +
                   '<td>' + formatTanggal(t.jatuh_tempo) + '</td>' +
                   '<td>' + m.telat + ' hari</td>' +
                   '<td><input type="checkbox" class="cek-penunggak" value="' + t.id_siswa + '" ' +
                     'onchange="hitungPenerimaTerpilih()"></td>' +
                 '</tr>';
        }).join('');

        bagianMenunggak =
          '<div class="card">' +
            '<h2 class="section-title">Siswa dengan Tagihan Menunggak</h2>' +
            '<div class="tabel-wrap">' +
              '<table class="tabel tabel--lebar">' +
                '<thead><tr>' +
                  '<th>No</th><th>NIS</th><th>Nama Siswa</th><th>Nama Wali Murid</th>' +
                  '<th>Jenis Biaya</th><th>Nominal</th><th>Jatuh Tempo</th><th>Hari Keterlambatan</th>' +
                  '<th><input type="checkbox" class="cek-semua" id="cekSemua" title="Pilih semua" ' +
                    'onchange="toggleSemuaPenunggak(this)"></th>' +
                '</tr></thead>' +
                '<tbody>' + baris + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>';
      }

      // --- Bagian tengah: formulir pengumuman ---
      const form =
        '<div class="card card--form">' +
          '<h2 class="section-title">Kirim Pengumuman</h2>' +
          '<span class="info-badge"><i class="fa-solid fa-circle-info"></i>' +
            'Pengumuman ini memerlukan 2 tahap approval: KTU &rarr; Kepala Sekolah</span>' +
          '<label class="form-label" for="pesanTagihan">Isi Pesan Pengumuman</label>' +
          '<textarea id="pesanTagihan" class="input" rows="4" ' +
            'placeholder="Kepada Yth. Bapak/Ibu wali murid..."></textarea>' +
          '<p class="info-penerima">Pengumuman akan dikirim ke ' +
            '<strong id="jumlahPenerima">0</strong> wali murid yang dipilih</p>' +
          '<button class="btn btn--full" id="tagihan-kirim" onclick="kirimPengumumanTagihan()">' +
            '<i class="fa-solid fa-paper-plane"></i> Kirim Pengumuman</button>' +
        '</div>';

      // --- Bagian bawah: riwayat pengumuman tagihan milik bendahara ini ---
      const riwayat = _srv('pengumuman', 'sip_pengumuman').filter(function(p) {
        return p && p.tipe === 'tagihan' && sesi && String(p.dari_id_user) === String(sesi.id);
      });

      const pakaiTanggal = riwayat.length > 0 && riwayat.every(function(p) {
        return p.tgl && !isNaN(new Date(p.tgl).getTime());
      });
      riwayat.sort(function(a, b) {
        if (pakaiTanggal) {
          const selisih = new Date(b.tgl) - new Date(a.tgl);
          if (selisih !== 0) return selisih;
        }
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      let isiRiwayat;
      if (riwayat.length === 0) {
        isiRiwayat = '<p class="pesan-info">Belum ada pengumuman tagihan</p>';
      } else {
        const barisRiwayat = riwayat.map(function(p, urut) {
          const s = statusPengumumanTagihan(p.status);
          const konten = String(p.konten || '-');
          const jumlah = Array.isArray(p.id_penerima_list) ? p.id_penerima_list.length : 0;

          // Tanggal ditulis DD/MM/YYYY HH:mm
          let tgl = '-';
          const t = p.tgl ? new Date(p.tgl) : null;
          if (t && !isNaN(t.getTime())) {
            const dua = function(n) { return String(n).padStart(2, '0'); };
            tgl = formatTanggal(t) + ' ' + dua(t.getHours()) + ':' + dua(t.getMinutes());
          }

          return '<tr class="baris-klik" onclick="lihatDetailPengumumanTagihan(' + p.id + ')">' +
                   '<td>' + (urut + 1) + '</td>' +
                   '<td>' + tgl + '</td>' +
                   '<td>' + jumlah + ' wali murid</td>' +
                   '<td>' + (konten.length > 80 ? konten.slice(0, 80) + '...' : konten) + '</td>' +
                   '<td><span class="badge badge--' + s.kelas + '">' + s.teks + '</span></td>' +
                 '</tr>';
        }).join('');

        isiRiwayat =
          '<div class="tabel-wrap">' +
            '<table class="tabel">' +
              '<thead><tr>' +
                '<th>No</th><th>Tanggal Kirim</th><th>Jumlah Penerima</th><th>Isi Pesan</th><th>Status</th>' +
              '</tr></thead>' +
              '<tbody>' + barisRiwayat + '</tbody>' +
            '</table>' +
          '</div>';
      }

      const bagianRiwayat =
        '<div class="card">' +
          '<h2 class="section-title">Riwayat Pengumuman Tagihan</h2>' +
          isiRiwayat +
        '</div>';

      return '<h1 class="module-title">Pengumuman Tagihan</h1>' +
             '<p class="module-sub">Kirim pengingat ke wali murid yang menunggak pembayaran</p>' +
             bagianMenunggak + form + bagianRiwayat;
    }

    // Terjemahkan kode status menjadi teks dan warna badge
    function statusPengumumanTagihan(status) {
      const s = String(status || '');
      if (s === 'pending_KTU') return { teks: 'Menunggu KTU', kelas: 'pending' };
      if (s === 'pending_Kepsek') return { teks: 'Menunggu Kepsek', kelas: 'biru' };
      if (s === 'approved') return { teks: 'Terkirim', kelas: 'aktif' };
      if (s === 'rejected') return { teks: 'Ditolak', kelas: 'merah' };
      return { teks: s || '-', kelas: 'nonaktif' };
    }

    // Centang atau lepas seluruh baris penunggak sekaligus
    function toggleSemuaPenunggak(el) {
      document.querySelectorAll('.cek-penunggak').forEach(function(c) { c.checked = el.checked; });
      hitungPenerimaTerpilih();
    }

    // Perbarui angka jumlah penerima tanpa menggambar ulang modul,
    // supaya centang yang sudah dipilih tidak ikut hilang
    function hitungPenerimaTerpilih() {
      const kotak = [].slice.call(document.querySelectorAll('.cek-penunggak'));
      const terpilih = kotak.filter(function(c) { return c.checked; });

      // Satu siswa bisa punya lebih dari satu tagihan menunggak,
      // jadi yang dihitung adalah siswa yang berbeda
      const unik = {};
      terpilih.forEach(function(c) { unik[c.value] = true; });

      const tampil = document.getElementById('jumlahPenerima');
      if (tampil) tampil.textContent = Object.keys(unik).length;

      // Selaraskan keadaan kotak "Pilih Semua"
      const cekSemua = document.getElementById('cekSemua');
      if (cekSemua) {
        cekSemua.checked = (kotak.length > 0 && terpilih.length === kotak.length);
        cekSemua.indeterminate = (terpilih.length > 0 && terpilih.length < kotak.length);
      }
    }

    // Kirim pengumuman tagihan ke wali murid yang dipilih
    async function kirimPengumumanTagihan() {
      const sesi = getSession();
      const kolomPesan = document.getElementById('pesanTagihan');
      if (!kolomPesan) {
        showNotif('Formulir tidak ditemukan', 'error');
        return;
      }

      // Kumpulkan id siswa yang dicentang, tanpa pengulangan
      const unik = {};
      document.querySelectorAll('.cek-penunggak').forEach(function(c) {
        if (c.checked) unik[c.value] = true;
      });
      const daftarPenerima = Object.keys(unik);

      if (daftarPenerima.length === 0) {
        showNotif('Pilih minimal satu siswa penerima', 'error');
        return;
      }

      const pesan = kolomPesan.value.trim();
      if (!pesan) {
        showNotif('Isi pesan tidak boleh kosong', 'error');
        return;
      }

      if (MODE_API) {
        // Pengumuman tagihan berstatus pending_KTU, disetujui KTU lalu Kepsek
        await _kirimAksi('tagihan-kirim', 'createPengumuman',
          { data: { tipe: 'tagihan', konten: pesan, target: 'walimurid' } },
          'pengumumanTagihan', 'Mengirim');
        return;
      }

      let daftar = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_pengumuman'));
        daftar = Array.isArray(isi) ? isi : [];
      } catch (e) {
        daftar = [];
      }

      // Id berbasis Date.now(), dinaikkan bila angkanya sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(p) { return p && Number(p.id) === idBaru; })) {
        idBaru++;
      }

      daftar.push({
        id: idBaru,
        dari_id_user: sesi ? sesi.id : null,
        dari_nama: sesi ? sesi.nama : '-',
        dari_role: 'bendahara',
        tipe: 'tagihan',
        id_penerima_list: daftarPenerima,
        konten: pesan,
        status: 'pending_KTU',
        tgl: new Date(),
        approved_by: ''
      });
      localStorage.setItem('sip_pengumuman', JSON.stringify(daftar));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({
        aksi: 'kirim_pengumuman_tagihan',
        pengumumanId: idBaru,
        jumlahPenerima: daftarPenerima.length,
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      // Modul digambar ulang, jadi pesan dan seluruh centang kembali kosong
      loadModule('Pengumuman Tagihan');
      showNotif('Pengumuman dikirim ke ' + daftarPenerima.length +
                ' wali murid. Menunggu persetujuan KTU.', 'success');
    }

    // Popup rincian satu pengumuman tagihan
    function lihatDetailPengumumanTagihan(id) {
      const baca = function(kunci) {
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };

      const p = _srv('pengumuman', 'sip_pengumuman').find(function(x) { return x && String(x.id) === String(id); });
      if (!p) {
        showNotif('Pengumuman tidak ditemukan', 'error');
        return;
      }

      const siswa = _srv('siswa', 'sip_siswa');
      const users = _srv('users', 'sip_users');
      const dua = function(n) { return String(n).padStart(2, '0'); };

      let tgl = '-';
      const t = p.tgl ? new Date(p.tgl) : null;
      if (t && !isNaN(t.getTime())) {
        tgl = formatTanggal(t) + ' ' + dua(t.getHours()) + ':' + dua(t.getMinutes());
      }

      const s = statusPengumumanTagihan(p.status);
      const penerima = Array.isArray(p.id_penerima_list) ? p.id_penerima_list : [];

      // --- Daftar penerima: nama siswa beserta wali muridnya ---
      const htmlPenerima = penerima.length
        ? '<ul class="penerima-list">' + penerima.map(function(idSiswa) {
            const sw = siswa.find(function(x) { return x && String(x.id) === String(idSiswa); });
            const namaSiswa = sw ? (sw.nama_lengkap || sw.nama || '-') : '-';
            let namaWali = '-';
            if (sw && sw.id_wali_murid !== undefined && sw.id_wali_murid !== null && sw.id_wali_murid !== '') {
              const w = users.find(function(x) { return x && String(x.id) === String(sw.id_wali_murid); });
              if (w) namaWali = w.nama || '-';
            }
            return '<li class="penerima-item">' + namaSiswa +
                     '<span class="penerima-wali">Wali murid: ' + namaWali + '</span></li>';
          }).join('') + '</ul>'
        : '<p class="pesan-info">Tidak ada penerima tercatat</p>';

      // --- Runtutan tahap persetujuan ---
      const ditolak = (p.status === 'rejected');
      const lolosKTU = (p.status === 'pending_Kepsek' || p.status === 'approved');
      const lolosKepsek = (p.status === 'approved');

      const tahap = function(judul, keterangan, keadaan) {
        const ikon = { selesai: 'fa-check', tunggu: 'fa-hourglass-half', tolak: 'fa-xmark', mati: 'fa-minus' };
        return '<li class="timeline-item">' +
                 '<span class="timeline-ikon timeline-ikon--' + keadaan + '">' +
                   '<i class="fa-solid ' + ikon[keadaan] + '"></i></span>' +
                 '<span><span class="timeline-judul">' + judul + '</span>' +
                 '<span class="timeline-ket">' + keterangan + '</span></span>' +
               '</li>';
      };

      const htmlTimeline =
        '<ul class="timeline">' +
          tahap('Dikirim Bendahara', (p.dari_nama || '-') + ' &middot; ' + tgl, 'selesai') +
          tahap('Persetujuan KTU',
                ditolak ? 'Ditolak' : (lolosKTU ? 'Disetujui' : 'Menunggu diperiksa'),
                ditolak ? 'tolak' : (lolosKTU ? 'selesai' : 'tunggu')) +
          tahap('Persetujuan Kepala Sekolah',
                lolosKepsek ? 'Disetujui' : (ditolak ? 'Tidak dilanjutkan' : (lolosKTU ? 'Menunggu diperiksa' : 'Belum sampai tahap ini')),
                lolosKepsek ? 'selesai' : (ditolak ? 'mati' : (lolosKTU ? 'tunggu' : 'mati'))) +
        '</ul>';

      const item = function(label, nilai) {
        return '<div class="detail-item">' +
                 '<span class="detail-label">' + label + '</span>' +
                 '<span class="detail-nilai">' + nilai + '</span>' +
               '</div>';
      };

      // Popup lama dibuang dulu agar tidak menumpuk
      tutupDetailPengumumanTagihan();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.setAttribute('onclick', 'if(event.target===this)tutupDetailPengumumanTagihan()');
      overlay.innerHTML =
        '<div class="modal">' +
          '<div class="modal-head">' +
            '<span class="modal-judul">Detail Pengumuman Tagihan</span>' +
            '<button class="modal-tutup" title="Tutup" onclick="tutupDetailPengumumanTagihan()">' +
              '<i class="fa-solid fa-xmark"></i></button>' +
          '</div>' +
          '<div class="detail-section"><h4>Informasi</h4><div class="detail-grid">' +
            item('Tanggal Kirim', tgl) +
            item('Status', '<span class="badge badge--' + s.kelas + '">' + s.teks + '</span>') +
            item('Jumlah Penerima', penerima.length + ' wali murid') +
          '</div></div>' +
          '<div class="detail-section"><h4>Isi Pesan</h4>' +
            '<p class="peng-konten">' + (p.konten || '-') + '</p></div>' +
          '<div class="detail-section"><h4>Daftar Penerima</h4>' + htmlPenerima + '</div>' +
          '<div class="detail-section"><h4>Tahap Persetujuan</h4>' + htmlTimeline + '</div>' +
        '</div>';

    // Pembaca localStorage yang aman untuk modul pembayaran
    function _bacaArr(kunci) {
      try {
        const isi = JSON.parse(localStorage.getItem(kunci));
        return Array.isArray(isi) ? isi : [];
      } catch (e) {
        return [];
      }
    }

    // Terjemahkan status approval pembayaran menjadi teks dan warna badge
    function statusPembayaran(status) {
      const s = String(status || '');
      if (s === 'pending_KTU') return { teks: 'Menunggu KTU', kelas: 'pending' };
      if (s === 'pending_Kepsek') return { teks: 'Menunggu Kepsek', kelas: 'biru' };
      if (s === 'approved') return { teks: 'Disetujui', kelas: 'aktif' };
      if (s === 'rejected') return { teks: 'Ditolak', kelas: 'merah' };
      return { teks: s || '-', kelas: 'nonaktif' };
    }

    // Rangkum satu transaksi menjadi kolom-kolom siap tampil
    function _barisPembayaran(t) {
      const siswa = _srv('siswa', 'sip_siswa');
      const biaya = _srv('biaya', 'sip_biaya');
      const s = siswa.find(function(x) { return x && String(x.id) === String(t.id_siswa); });
      const b = biaya.find(function(x) { return x && String(x.id) === String(t.id_biaya); });
      return {
        nis: s && s.nis ? s.nis : '-',
        nama: s && (s.nama_lengkap || s.nama) ? (s.nama_lengkap || s.nama) : '-',
        biaya: b && b.nama_biaya ? b.nama_biaya : '-',
        nominal: formatRupiah(t.jumlah),
        keterangan: t.keterangan && String(t.keterangan).trim() !== '' ? t.keterangan : '-'
      };
    }

    // Tabel pembayaran yang tercatat hari ini beserta jumlah totalnya
    function htmlRiwayatHariIni() {
      const kini = new Date();
      const dua = function(n) { return String(n).padStart(2, '0'); };

      const hariIni = _srv('transaksi', 'sip_transaksi').filter(function(t) {
        if (!t || String(t.tipe || '').toLowerCase() !== 'pemasukan') return false;
        if (!t.tgl) return false;
        const d = new Date(t.tgl);
        return !isNaN(d.getTime()) && d.toDateString() === kini.toDateString();
      });

      // Terbaru di atas
      hariIni.sort(function(a, b) { return new Date(b.tgl) - new Date(a.tgl); });

      if (hariIni.length === 0) {
        return '<p class="pesan-info">Belum ada pembayaran hari ini</p>';
      }

      let total = 0;
      const baris = hariIni.map(function(t, urut) {
        total += Number(t.jumlah) || 0;
        const k = _barisPembayaran(t);
        const st = statusPembayaran(t.status_approval);
        const d = new Date(t.tgl);
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + dua(d.getHours()) + ':' + dua(d.getMinutes()) + '</td>' +
                 '<td>' + k.nis + '</td>' +
                 '<td>' + k.nama + '</td>' +
                 '<td>' + k.biaya + '</td>' +
                 '<td>' + k.nominal + '</td>' +
                 '<td>' + k.keterangan + '</td>' +
                 '<td><span class="badge badge--' + st.kelas + '">' + st.teks + '</span></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap">' +
               '<table class="tabel tabel--lebar">' +
                 '<thead><tr>' +
                   '<th>No</th><th>Waktu</th><th>NIS</th><th>Nama Siswa</th>' +
                   '<th>Jenis Biaya</th><th>Nominal</th><th>Keterangan</th><th>Status</th>' +
                 '</tr></thead>' +
                 '<tbody>' + baris + '</tbody>' +
               '</table>' +
             '</div>' +
             '<p class="tabel-total">Total: ' + formatRupiah(total) + '</p>';
    }

    // Tabel riwayat seluruh pembayaran, mengikuti penyaring tanggal bila ada
    function htmlRiwayatSemua() {
      let daftar = _srv('transaksi', 'sip_transaksi').filter(function(t) {
        return t && String(t.tipe || '').toLowerCase() === 'pemasukan';
      });

      // Bila rentang tanggal diisi, seluruh data dalam rentang itu ditampilkan.
      // Tanpa penyaring, hanya 20 transaksi terbaru yang ditampilkan.
      const adaFilter = !!(filterPembayaran.mulai || filterPembayaran.akhir);
      if (adaFilter) {
        daftar = filterByTanggal(daftar, filterPembayaran.mulai, filterPembayaran.akhir);
      }

      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      if (!adaFilter) daftar = daftar.slice(0, 20);

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada riwayat pembayaran</p>';
      }

      const baris = daftar.map(function(t, urut) {
        const k = _barisPembayaran(t);
        const st = statusPembayaran(t.status_approval);
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + formatTanggal(t.tgl) + '</td>' +
                 '<td>' + k.nis + '</td>' +
                 '<td>' + k.nama + '</td>' +
                 '<td>' + k.biaya + '</td>' +
                 '<td>' + k.nominal + '</td>' +
                 '<td>' + k.keterangan + '</td>' +
                 '<td><span class="badge badge--' + st.kelas + '">' + st.teks + '</span></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-scroll">' +
               '<table class="tabel tabel--lebar">' +
                 '<thead><tr>' +
                   '<th>No</th><th>Tanggal</th><th>NIS</th><th>Nama Siswa</th>' +
                   '<th>Jenis Biaya</th><th>Nominal</th><th>Keterangan</th><th>Status</th>' +
                 '</tr></thead>' +
                 '<tbody>' + baris + '</tbody>' +
               '</table>' +
             '</div>';
    }

    // Kosongkan seluruh isian formulir pencatatan
    function resetFormPembayaran() {
      const ymd = function(d) {
        const dua = function(n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '-' + dua(d.getMonth() + 1) + '-' + dua(d.getDate());
      };
      const set = function(id, nilai) {
        const el = document.getElementById(id);
        if (el) el.value = nilai;
      };
      set('bayarSiswa', '');
      set('bayarBiaya', '');
      set('bayarNominal', '');
      set('bayarKeterangan', '');
      set('bayarTanggal', ymd(new Date()));
      const berkas = document.getElementById('bayarBukti');
      if (berkas) berkas.value = '';
    }

    // Simpan satu pembayaran dan tandai tagihan terkait menjadi lunas
    async function catatPembayaran() {
      const sesi = getSession();
      const elSiswa = document.getElementById('bayarSiswa');
      const elBiaya = document.getElementById('bayarBiaya');
      const elNominal = document.getElementById('bayarNominal');
      const elTanggal = document.getElementById('bayarTanggal');
      const elKeterangan = document.getElementById('bayarKeterangan');
      const elBukti = document.getElementById('bayarBukti');

      if (!elSiswa || !elBiaya || !elNominal) {
        showNotif('Formulir tidak ditemukan', 'error');
        return;
      }

      if (!elSiswa.value) {
        showNotif('Siswa harus dipilih', 'error');
        return;
      }
      if (!elBiaya.value) {
        showNotif('Jenis biaya harus dipilih', 'error');
        return;
      }
      const nominal = Number(elNominal.value);
      if (!nominal || nominal <= 0) {
        showNotif('Nominal harus lebih dari 0', 'error');
        return;
      }

      const siswa = _srv('siswa', 'sip_siswa');
      const biaya = _srv('biaya', 'sip_biaya');
      const s = siswa.find(function(x) { return x && String(x.id) === String(elSiswa.value); });
      const b = biaya.find(function(x) { return x && String(x.id) === String(elBiaya.value); });
      if (!s || !b) {
        showNotif('Data siswa atau biaya tidak ditemukan', 'error');
        return;
      }

      const namaSiswa = s.nama_lengkap || s.nama || '-';

      if (MODE_API) {
        // Bendahara mencatat pembayaran atas satu tagihan yang belum lunas
        // Tagihan yang sedang menunggu persetujuan tidak boleh diajukan lagi
        const tagihanSiswa = _srv('tagihan', 'sip_tagihan').filter(function(g) {
          if (!g) return false;
          const st = String(g.status_bayar || '').toLowerCase();
          return String(g.id_siswa) === String(elSiswa.value) &&
                 String(g.id_biaya) === String(elBiaya.value) &&
                 st !== 'lunas' && st !== 'proses';
        });
        if (tagihanSiswa.length === 0) {
          showNotif('Tidak ada tagihan yang bisa dicatat untuk siswa ini. ' +
                    'Mungkin sudah lunas atau sedang menunggu persetujuan.', 'error');
          return;
        }

        // Buktinya dikirim sebagai berkas, bukan sekadar nama berkas,
        // supaya tersimpan di Drive dan bisa ditelusuri kembali
        let buktiBase64 = '';
        const berkas = (elBukti && elBukti.files && elBukti.files[0]) ? elBukti.files[0] : null;
        if (berkas) {
          if (berkas.size > 5 * 1024 * 1024) {
            showNotif('Ukuran bukti maksimal 5 MB', 'error');
            return;
          }
          try {
            buktiBase64 = await _berkasKeBase64(berkas);
          } catch (e) {
            showNotif('Berkas bukti tidak dapat dibaca', 'error');
            return;
          }
        }

        await _kirimAksi('bayar-catat', 'catatPembayaran',
          { tagihanId: tagihanSiswa[0].id, fileBase64: buktiBase64 },
          'catatPembayaran', 'Mencatat');
        return;
      }

      // Tanggal bayar mengikuti isian, jamnya memakai waktu saat pencatatan
      let tglBayar = new Date();
      if (elTanggal && elTanggal.value) {
        const pilihan = new Date(elTanggal.value + 'T00:00:00');
        if (!isNaN(pilihan.getTime())) {
          const kini = new Date();
          pilihan.setHours(kini.getHours(), kini.getMinutes(), kini.getSeconds(), 0);
          tglBayar = pilihan;
        }
      }

      // Hanya nama berkas yang disimpan, isinya tidak diunggah ke mana pun
      let namaBukti = '';
      if (elBukti && elBukti.files && elBukti.files.length > 0) {
        namaBukti = elBukti.files[0].name;
      }

      const transaksi = _srv('transaksi', 'sip_transaksi');

      // Id berbasis Date.now(), dinaikkan bila angkanya sudah terpakai
      let idBaru = Date.now();
      while (transaksi.some(function(t) { return t && Number(t.id) === idBaru; })) {
        idBaru++;
      }

      transaksi.push({
        id: idBaru,
        tipe: 'pemasukan',
        jumlah: nominal,
        deskripsi: 'Pembayaran ' + (b.nama_biaya || '-') + ' - ' + namaSiswa + ' (NIS: ' + (s.nis || '-') + ')',
        id_pengaju: sesi ? sesi.id : null,
        id_siswa: s.id,
        id_biaya: b.id,
        keterangan: elKeterangan ? elKeterangan.value.trim() : '',
        bukti: namaBukti,
        status_approval: 'pending_KTU',
        approved_by: '',
        tgl: tglBayar
      });
      localStorage.setItem('sip_transaksi', JSON.stringify(transaksi));

      // Tagihan sengaja TIDAK diubah menjadi lunas di tahap ini.
      // Pelunasan baru terjadi setelah status_approval mencapai 'approved',
      // yang dikerjakan pada modul KTU dan Kepala Sekolah.

      // Catat jejak aksi
      const log = _bacaArr('sip_log');
      log.push({
        aksi: 'catat_pembayaran',
        transaksiId: idBaru,
        idSiswa: s.id,
        jumlah: nominal,
        status: 'pending_KTU',
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      // Formulir dikosongkan, kedua tabel riwayat digambar ulang
      resetFormPembayaran();
      const wadahHariIni = document.getElementById('riwayat-hari-ini');
      if (wadahHariIni) wadahHariIni.innerHTML = htmlRiwayatHariIni();
      const wadahSemua = document.getElementById('riwayat-semua');
      if (wadahSemua) wadahSemua.innerHTML = htmlRiwayatSemua();

      showNotif('Pembayaran ' + namaSiswa + ' sebesar ' + formatRupiah(nominal) +
                ' berhasil dicatat. Menunggu persetujuan KTU.', 'success');
    }

    // Saring riwayat pembayaran berdasarkan rentang tanggal
    function filterRiwayatPembayaran() {
      const m = document.getElementById('bayarMulai');
      const a = document.getElementById('bayarAkhir');
      if (!m || !a) return;

      if (m.value && a.value && new Date(m.value) > new Date(a.value)) {
        showNotif('Tanggal mulai tidak boleh melewati tanggal akhir', 'error');
        return;
      }

    // ================= MODUL MANAJEMEN KAS (BENDAHARA) =================

    // Batas nominal pengeluaran yang masih boleh langsung dicatat
    const BATAS_PENGELUARAN_KAS = 1000000;

    // Saldo kas: pemasukan dikurangi pengeluaran, hanya yang sudah disetujui
    function hitungSaldo() {
      let masuk = 0, keluar = 0;
      _srv('transaksi', 'sip_transaksi').forEach(function(t) {
        if (!t || String(t.status_approval || '') !== 'approved') return;
        const jumlah = Number(t.jumlah) || 0;
        const tipe = String(t.tipe || '').toLowerCase();
        if (tipe === 'pemasukan') masuk += jumlah;
        else if (tipe === 'pengeluaran') keluar += jumlah;
      });
      return masuk - keluar;
    }

    // Terjemahkan status approval transaksi kas menjadi teks dan warna badge
    function statusKas(status) {
      const s = String(status || '');
      if (s === 'approved') return { teks: 'Disetujui', kelas: 'aktif' };
      if (s === 'pending_Kepsek') return { teks: 'Menunggu Kepsek', kelas: 'pending' };
      if (s === 'rejected') return { teks: 'Ditolak', kelas: 'merah' };
      // Pembayaran dari modul 5.3 masih menunggu KTU lebih dulu
      if (s === 'pending_KTU') return { teks: 'Menunggu KTU', kelas: 'pending' };
      return { teks: s || '-', kelas: 'nonaktif' };
    }

    // Perbarui kotak keterangan sesuai tipe dan jumlah yang sedang diisi
    function perbaruiInfoKas() {
      const kotak = document.getElementById('infoKas');
      const elTipe = document.getElementById('kasTipe');
      const elJumlah = document.getElementById('kasJumlah');
      if (!kotak || !elTipe || !elJumlah) return;

      const tipe = elTipe.value;
      const jumlah = Number(elJumlah.value) || 0;

      let teks, warna;
      if (tipe === 'pengeluaran' && jumlah > BATAS_PENGELUARAN_KAS) {
        teks = 'Transaksi ini memerlukan persetujuan Kepala Sekolah (di atas ' +
               formatRupiah(BATAS_PENGELUARAN_KAS) + ')';
        warna = 'oranye';
      } else if (tipe === 'pengeluaran') {
        teks = 'Transaksi langsung dicatat';
        warna = 'hijau';
      } else if (tipe === 'pemasukan') {
        teks = 'Pemasukan langsung dicatat';
        warna = 'hijau';
      } else {
        teks = 'Pilih tipe transaksi lebih dulu';
        warna = 'hijau';
      }

      kotak.className = 'info-badge info-badge--' + warna;
      kotak.innerHTML = '<i class="fa-solid fa-circle-info"></i>' + teks;
    }

    // Susun tabel riwayat transaksi kas sesuai penyaring yang sedang aktif
    function htmlRiwayatKas() {
      let daftar = _srv('transaksi', 'sip_transaksi').filter(function(t) {
        return t && t.id !== undefined && t.id !== null;
      });

      // Penyaring tipe
      if (filterKas.tipe) {
        daftar = daftar.filter(function(t) {
          return String(t.tipe || '').toLowerCase() === filterKas.tipe;
        });
      }

      // Bila rentang tanggal diisi, seluruh data dalam rentang ditampilkan.
      // Tanpa penyaring apa pun, hanya 20 transaksi terbaru yang ditampilkan.
      const adaFilter = !!(filterKas.tipe || filterKas.mulai || filterKas.akhir);
      if (filterKas.mulai || filterKas.akhir) {
        daftar = filterByTanggal(daftar, filterKas.mulai, filterKas.akhir);
      }

      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      if (!adaFilter) daftar = daftar.slice(0, 20);

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada transaksi</p>';
      }

      const baris = daftar.map(function(t, urut) {
        const tipe = String(t.tipe || '').toLowerCase();
        const st = statusKas(t.status_approval);

        // Pembatalan hanya untuk transaksi yang masih menunggu Kepala Sekolah
        const aksi = (String(t.status_approval || '') === 'pending_Kepsek')
          ? '<button class="btn-aksi btn-batal" onclick="batalTransaksi(' + t.id + ')">' +
              '<i class="fa-solid fa-xmark"></i>Batal</button>'
          : '-';

        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + formatTanggal(t.tgl) + '</td>' +
                 '<td><span class="badge badge--' + (tipe === 'pengeluaran' ? 'pengeluaran' : 'pemasukan') + '">' +
                   (tipe === 'pengeluaran' ? 'Pengeluaran' : 'Pemasukan') + '</span></td>' +
                 '<td>' + formatRupiah(t.jumlah) + '</td>' +
                 '<td>' + (t.deskripsi && String(t.deskripsi).trim() !== '' ? t.deskripsi : '-') + '</td>' +
                 '<td><span class="badge badge--' + st.kelas + '">' + st.teks + '</span></td>' +
                 '<td>' + aksi + '</td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-scroll">' +
               '<table class="tabel tabel--lebar">' +
                 '<thead><tr>' +
                   '<th>No</th><th>Tanggal</th><th>Tipe</th><th>Jumlah</th>' +
                   '<th>Deskripsi</th><th>Status</th><th>Aksi</th>' +
                 '</tr></thead>' +
                 '<tbody>' + baris + '</tbody>' +
               '</table>' +
             '</div>';
    }

    // Simpan satu transaksi kas
    async function catatTransaksi() {
      const sesi = getSession();
      const elTipe = document.getElementById('kasTipe');
      const elJumlah = document.getElementById('kasJumlah');
      const elTanggal = document.getElementById('kasTanggal');
      const elDeskripsi = document.getElementById('kasDeskripsi');

      if (!elTipe || !elJumlah || !elDeskripsi) {
        showNotif('Formulir tidak ditemukan', 'error');
        return;
      }

      const tipe = elTipe.value;
      if (tipe !== 'pemasukan' && tipe !== 'pengeluaran') {
        showNotif('Tipe transaksi harus dipilih', 'error');
        return;
      }

      const jumlah = Number(elJumlah.value);
      if (!jumlah || jumlah <= 0) {
        showNotif('Jumlah harus lebih dari 0', 'error');
        return;
      }

      const deskripsi = elDeskripsi.value.trim();
      if (!deskripsi) {
        showNotif('Deskripsi tidak boleh kosong', 'error');
        return;
      }

      if (MODE_API) {
        // Ambang persetujuan pengeluaran juga diperiksa di server
        await _kirimAksi('kas-catat', 'catatTransaksi', { data: {
          tipe: tipe, jumlah: jumlah, deskripsi: deskripsi,
          tgl: (elTanggal && elTanggal.value) ? elTanggal.value : undefined
        } }, 'manajemenKas', 'Mencatat');
        return;
      }

      // Pengeluaran besar menunggu persetujuan Kepala Sekolah,
      // selain itu langsung tercatat
      const perluApproval = (tipe === 'pengeluaran' && jumlah > BATAS_PENGELUARAN_KAS);
      const status = perluApproval ? 'pending_Kepsek' : 'approved';

      // Tanggal mengikuti isian, jamnya memakai waktu saat pencatatan
      let tglTransaksi = new Date();
      if (elTanggal && elTanggal.value) {
        const pilihan = new Date(elTanggal.value + 'T00:00:00');
        if (!isNaN(pilihan.getTime())) {
          const kini = new Date();
          pilihan.setHours(kini.getHours(), kini.getMinutes(), kini.getSeconds(), 0);
          tglTransaksi = pilihan;
        }
      }

      const transaksi = _srv('transaksi', 'sip_transaksi');

      // Id berbasis Date.now(), dinaikkan bila angkanya sudah terpakai
      let idBaru = Date.now();
      while (transaksi.some(function(t) { return t && Number(t.id) === idBaru; })) {
        idBaru++;
      }

      transaksi.push({
        id: idBaru,
        tipe: tipe,
        jumlah: jumlah,
        deskripsi: deskripsi,
        id_pengaju: sesi ? sesi.id : null,
        status_approval: status,
        approved_by: perluApproval ? '' : (sesi ? sesi.id : null),
        tgl: tglTransaksi
      });
      localStorage.setItem('sip_transaksi', JSON.stringify(transaksi));

      // Catat jejak aksi
      const log = _bacaArr('sip_log');
      log.push({
        aksi: 'catat_transaksi_kas',
        transaksiId: idBaru,
        tipe: tipe,
        jumlah: jumlah,
        status: status,
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      // Modul digambar ulang agar saldo dan riwayat ikut diperbarui
      loadModule('Manajemen Kas');
      showNotif(perluApproval
        ? 'Transaksi tersimpan. Menunggu persetujuan Kepala Sekolah.'
        : 'Transaksi ' + tipe + ' sebesar ' + formatRupiah(jumlah) + ' berhasil dicatat', 'success');
    }

    // Batalkan transaksi yang masih menunggu persetujuan
    async function batalTransaksi(id) {
      if (MODE_API) {
        if (!confirm('Batalkan transaksi ini?')) return;
        await _kirimAksi('kas-batal-' + id, 'batalTransaksi', { idTransaksi: id }, 'manajemenKas', 'Membatalkan');
        return;
      }

      if (!confirm('Batalkan transaksi ini?')) return;

      const sesi = getSession();
      const transaksi = _srv('transaksi', 'sip_transaksi');
      const i = transaksi.findIndex(function(t) { return t && String(t.id) === String(id); });
      if (i === -1) {
        showNotif('Transaksi tidak ditemukan', 'error');
        return;
      }

      transaksi[i].status_approval = 'rejected';
      localStorage.setItem('sip_transaksi', JSON.stringify(transaksi));

      // Catat jejak aksi
      const log = _bacaArr('sip_log');
      log.push({
        aksi: 'batal_transaksi_kas',
        transaksiId: id,
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      loadModule('Manajemen Kas');
      showNotif('Transaksi dibatalkan', 'success');
    }

    // ================= MODUL LAPORAN KEUANGAN (BENDAHARA) =================

    // Saring transaksi mengikuti rentang tanggal dan status pada penyaring
    function filterLaporan(daftar) {
      let hasil = daftar.filter(function(t) { return t && t.id !== undefined && t.id !== null; });

      if (laporanKeu.mulai || laporanKeu.akhir) {
        hasil = filterByTanggal(hasil, laporanKeu.mulai, laporanKeu.akhir);
      }

      // "pending" mencakup pending_KTU maupun pending_Kepsek
      if (laporanKeu.status === 'approved') {
        hasil = hasil.filter(function(t) { return String(t.status_approval || '') === 'approved'; });
      } else if (laporanKeu.status === 'pending') {
        hasil = hasil.filter(function(t) { return String(t.status_approval || '').indexOf('pending') === 0; });
      }

      hasil.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });
      return hasil;
    }
