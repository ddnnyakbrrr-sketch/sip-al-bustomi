    function _htmlIsiMonitoring() {
      // Pembaca localStorage yang aman: selalu mengembalikan array
      const baca = function(kunci) {
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };

      const hariIni = new Date().toDateString();
      const R = SRV.ringkasan;

      // Angka dari server bila ada, selain itu dihitung dari penyimpanan peramban
      const guruHadir = R ? R.guru_hadir_hari_ini : baca('sip_absensi').filter(function(a) {
        if (!a || !a.tgl) return false;
        const t = new Date(a.tgl);
        return !isNaN(t.getTime()) && t.toDateString() === hariIni;
      }).length;

      const akunPending = R ? R.akun_pending
        : baca('sip_users').filter(function(u) { return u && u.aktif === false; }).length;
      const pengumumanPending = R ? R.pengumuman_pending
        : baca('sip_pengumuman').filter(function(p) { return p && p.status === 'pending'; }).length;
      const siswaPending = R ? R.siswa_pending
        : baca('sip_siswa').filter(function(s) { return s && s.status_data === 'pending'; }).length;

      // Kiriman keuangan yang sudah lolos KTU dan kini menunggu Kepala Sekolah
      const rincianKeu = _rincianKeuanganKepsek();

      // Susunan kelima kartu statistik
      const kartu = [
        { angka: guruHadir,        label: 'Guru Hadir Hari Ini', ikon: 'fa-user-check',    warna: 'hijau',  tujuan: null },
        { angka: akunPending,      label: 'Akun Pending',        ikon: 'fa-user-clock',    warna: 'oranye', tujuan: 'Approve Akun' },
        { angka: pengumumanPending,label: 'Pengumuman Pending',  ikon: 'fa-bullhorn',      warna: 'biru',   tujuan: 'Approve Pengumuman' },
        { angka: siswaPending,     label: 'Siswa Pending',       ikon: 'fa-user-graduate', warna: 'ungu',   tujuan: 'Data Siswa Pending' },
        { angka: rincianKeu.total, label: 'Approval Keuangan',   ikon: 'fa-money-check-dollar', warna: 'merah', tujuan: 'Approve Keuangan',
          ket: 'Tagihan: ' + rincianKeu.tagihan + ', Pembayaran: ' + rincianKeu.pembayaran +
               ', Pengeluaran: ' + rincianKeu.pengeluaran }
      ];

      const htmlKartu = kartu.map(function(k, i) {
        // Tiap kartu muncul berurutan dengan jeda 0.1 detik
        const jeda = 'animation-delay:' + ((i + 1) / 10) + 's';
        const bisaKlik = k.tujuan ? ' stat-card--klik' : '';
        const aksi = k.tujuan ? ' onclick="loadModule(\'' + k.tujuan + '\')"' : '';
        return '<div class="stat-card stat-card--' + k.warna + bisaKlik + '" style="' + jeda + '"' + aksi + '>' +
                 '<i class="fa-solid ' + k.ikon + ' stat-icon"></i>' +
                 '<div class="stat-number">' + k.angka + '</div>' +
                 '<div class="stat-label">' + k.label + '</div>' +
                 (k.ket ? '<div class="stat-ket">' + k.ket + '</div>' : '') +
               '</div>';
      }).join('');

      // Lima catatan aktivitas paling akhir.
      // getLog sudah mengembalikannya terurut terbaru lebih dulu.
      const log = SRV.log ? SRV.log : baca('sip_log').slice(-5).reverse();
      const htmlLog = log.length
        ? '<ul class="log-list">' + log.map(function(l) {
            const waktu = l && l.timestamp ? new Date(l.timestamp) : null;
            const teksWaktu = waktu && !isNaN(waktu.getTime())
              ? waktu.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
              : '-';
            return '<li class="log-item">' +
                     '<span class="log-teks">' + ((l && (l.deskripsi || l.aksi)) || '-') +
                       '<span class="log-pelaku">' + ((l && (l.nama_user || l.oleh)) || '-') + '</span>' +
                     '</span>' +
                     '<span class="log-waktu">' + teksWaktu + '</span>' +
                   '</li>';
          }).join('') + '</ul>'
        : '<p class="log-kosong">Belum ada aktivitas yang tercatat.</p>';

      return '<div class="stat-grid">' + htmlKartu + '</div>' +
             '<h2 class="section-title">Aktivitas Terbaru</h2>' +
             '<div class="card">' + htmlLog + '</div>';

    // Tampilkan pesan singkat di pojok kanan atas, hilang sendiri 3 detik
    function showNotif(pesan, tipe) {
      // Notifikasi lama dibuang dulu agar tidak menumpuk
      const lama = document.querySelector('.notif');
      if (lama) lama.remove();

      const el = document.createElement('div');
      el.className = 'notif notif--' + (tipe === 'error' ? 'error' : 'success');
      el.textContent = pesan;
      document.body.appendChild(el);

      setTimeout(function() {
        if (el.parentNode) el.remove();
      }, 3000);
    }

    // Modul Approve Akun milik Kepala Sekolah, mengembalikan HTML siap tampil
    // Deretan batang berkilau selagi data dijemput dari server
    function _skeletonTabel(jumlahBaris) {
      let batang = '';
      for (let i = 0; i < jumlahBaris; i++) batang += '<div class="skeleton-baris"></div>';
      return '<div class="card">' +
               '<span class="memuat-teks">' +
                 '<i class="fa-solid fa-spinner fa-spin"></i> Memuat data dari server…</span>' +
               batang +
             '</div>';
    }

    // Kartu saat data gagal dijemput, lengkap dengan tombol coba lagi
    function _kartuGagal(pesan, fungsiUlang) {
      return '<div class="card gagal-card">' +
               '<i class="fa-solid fa-triangle-exclamation gagal-ikon"></i>' +
               '<span class="gagal-teks">Gagal memuat data</span>' +
               '<span class="gagal-pesan">' + (pesan || 'Tidak ada jawaban dari server.') + '</span>' +
               '<button class="btn" onclick="' + fungsiUlang + '">' +
                 '<i class="fa-solid fa-rotate-right"></i> Coba Lagi</button>' +
             '</div>';
    }

    // Ubah tombol jadi sibuk selagi menunggu jawaban server
    function _tombolSibuk(el, teks) {
      if (!el) return null;
      const semula = el.innerHTML;
      el.disabled = true;
      el.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>' + (teks || 'Memproses');
      return semula;
    }

    // Kembalikan tombol seperti semula bila permintaannya gagal
    function _tombolPulih(el, semula) {
      if (!el) return;
      el.disabled = false;
      if (semula !== null && semula !== undefined) el.innerHTML = semula;
    }

    /* ====================================================================
     *  LAPISAN PEMUAT MODUL API
     * --------------------------------------------------------------------
     *  Pola Modul 4.2 diulang di banyak modul: gambar kerangka, jemput data,
     *  isi kerangka, tampilkan kartu gagal bila server tidak menjawab.
     *  Bagian yang selalu sama dikumpulkan di sini supaya tiap modul cukup
     *  menyebutkan aksi apa yang dijemput dan bagaimana hasilnya digambar.
     *
     *  Cara memakai pada sebuah modul:
     *    1. Fungsi modulnya mengembalikan wadah kosong saat MODE_API menyala:
     *         <div id="isi-xxx" data-muat="namaPemuat"></div>
     *    2. Daftarkan pemuatnya:
     *         PEMUAT.namaPemuat = () => _muatModul('isi-xxx', [['getAnu']],
     *                                    d => _htmlAnu(d[0]), 'namaPemuat');
     *    3. loadModule() memanggilnya sendiri lewat atribut data-muat,
     *       jadi loadModule() tidak perlu disentuh lagi tiap tambah modul.
     * ==================================================================== */

    // Daftar pemuat data (PEMUAT) diumumkan di dekat MODE_API,
    // kuncinya dipakai pada atribut data-muat.

    /**
     * Jemput satu atau beberapa aksi sekaligus lalu gambar hasilnya.
     *
     * idWadah     : id elemen tempat hasilnya ditulis
     * daftarAksi  : array [namaAksi, muatanOpsional], dijemput serentak
     * gambar      : fungsi(dataArray) -> HTML string
     * namaPemuat  : kunci di PEMUAT, dipakai tombol "Coba Lagi"
     * barisRangka : jumlah batang kerangka saat menunggu
     */
    /* Singgahan jawaban server berumur pendek.
     *
     * Satu bolak-balik ke Apps Script memakan ~3 detik, dan itu tidak bisa
     * ditawar. Yang bisa ditekan adalah berapa kali kita menempuhnya:
     * getSiswa dipakai 9 modul, getPengumuman 9 modul, dan sebelum ini
     * setiap perpindahan menu menjemputnya lagi dari nol.
     *
     * Umurnya sengaja pendek, dan setiap aksi tulis membuangnya, supaya
     * angka yang tampil tidak pernah tertinggal dari keadaan sebenarnya.
     */
    const UMUR_SINGGAHAN_MS = 60000;
    const SINGGAHAN = {};

    function _singgahanKosongkan() {
      Object.keys(SINGGAHAN).forEach(function(k) { delete SINGGAHAN[k]; });
    }

    // Jemput satu aksi, pakai singgahan bila masih segar
    async function _jemput(aksi, muatan, paksaSegar) {
      const kunci = aksi + '|' + JSON.stringify(muatan || {});
      const simpan = SINGGAHAN[kunci];

      if (!paksaSegar && simpan && (Date.now() - simpan.waktu) < UMUR_SINGGAHAN_MS) {
        return simpan.jawaban;
      }

      const jawaban = await callAPI(aksi, muatan || {});

      // Hanya jawaban berhasil yang disinggahi. Kegagalan harus selalu
      // dicoba ulang sungguhan, bukan diulang dari catatan lama.
      if (jawaban && jawaban.status === 'success') {
        SINGGAHAN[kunci] = { waktu: Date.now(), jawaban: jawaban };
      }
      return jawaban;
    }

    async function _muatModul(idWadah, daftarAksi, gambar, namaPemuat, barisRangka, paksaSegar) {
      const wadah = document.getElementById(idWadah);
      if (!wadah) return;

      wadah.innerHTML = _skeletonTabel(barisRangka || 4);

      // Seluruh aksi dijemput serentak, bukan bergiliran. Satu panggilan
      // Apps Script memakan 3-4 detik, jadi menunggunya berbaris akan terasa.
      const jawaban = await Promise.all(
        daftarAksi.map(function(a) { return _jemput(a[0], a[1] || {}, paksaSegar); })
      );

      // Wadahnya bisa saja sudah lenyap kalau pengguna pindah modul
      // selagi data masih dijemput. Menulis ke elemen yatim itu percuma.
      if (!document.getElementById(idWadah)) return;

      // "Coba Lagi" membuang singgahan lebih dulu supaya benar-benar
      // menjemput ulang, bukan mengulang catatan lama
      const ulang = '_singgahanKosongkan(); PEMUAT[\'' + namaPemuat + '\']()';

      for (let i = 0; i < jawaban.length; i++) {
        const j = jawaban[i];
        if (!j) {
          wadah.innerHTML = _kartuGagal('Tidak dapat menghubungi server.', ulang);
          return;
        }
        if (j.status !== 'success') {
          wadah.innerHTML = _kartuGagal(
            (j.message || 'Server menolak permintaan.') + ' (' + daftarAksi[i][0] + ')', ulang);
          return;
        }
      }

      try {
        wadah.innerHTML = gambar(jawaban.map(function(j) { return j.data; }));
      } catch (e) {
        // Kesalahan saat menggambar tidak boleh menyisakan layar kosong
        wadah.innerHTML = _kartuGagal('Data dari server tidak sesuai bentuk: ' + e.message, ulang);
      }
    }

    /**
     * Kirim satu aksi yang mengubah data, dengan tombolnya dibuat sibuk.
     * Setelah berhasil, pemuat modulnya dijalankan ulang supaya isi layar
     * datang dari server, bukan ditebak dari sisi peramban.
     *
     * Mengembalikan true bila aksinya berhasil.
     */
    async function _kirimAksi(idTombol, aksi, muatan, namaPemuat, teksSibuk) {
      const tombol = idTombol ? document.getElementById(idTombol) : null;
      const semula = _tombolSibuk(tombol, teksSibuk || 'Memproses');

      const hasil = await callAPI(aksi, muatan || {});

      if (!hasil || hasil.status !== 'success') {
        _tombolPulih(tombol, semula);
        showNotif((hasil && hasil.message) || 'Aksi gagal dijalankan', 'error');
        return false;
      }

      // Data di server sudah berubah, jadi seluruh singgahan tidak berlaku lagi
      _singgahanKosongkan();

      if (namaPemuat && typeof PEMUAT[namaPemuat] === 'function') {
        // Pemuat menggambar ulang modulnya, tombol sibuk ikut terganti
        await PEMUAT[namaPemuat]();
      } else {
        // Tidak ada yang menggambar ulang, jadi tombolnya dipulihkan sendiri.
        // Tanpa ini tombol akan tersangkut pada teks sibuk selamanya.
        _tombolPulih(tombol, semula);
      }
      showNotif(hasil.message || 'Berhasil', 'success');
      return true;
    }

    /* Status sebuah tagihan kini ada tiga, bukan dua.
     *
     * "proses" berarti Bendahara sudah mencatat pembayarannya dan sedang
     * menunggu KTU lalu Kepala Sekolah. Menampilkannya sebagai "Belum
     * Lunas" akan menyesatkan: wali murid bisa merasa perlu membayar lagi.
     */
    function _statusTagihan(t, kini) {
      const st = String((t && t.status_bayar) || '').toLowerCase();
      if (st === 'lunas')  return { kelas: 'lunas',  teks: 'Lunas',  lunas: true,  proses: false, menunggak: false };
      if (st === 'proses') return { kelas: 'pending', teks: 'Menunggu Persetujuan', lunas: false, proses: true, menunggak: false };

      const jt = t && t.jatuh_tempo ? new Date(t.jatuh_tempo) : null;
      const menunggak = !!(jt && !isNaN(jt.getTime()) && jt < (kini || new Date()));
      return {
        kelas: menunggak ? 'menunggak' : 'belum',
        teks: menunggak ? 'Menunggak' : 'Belum Lunas',
        lunas: false, proses: false, menunggak: menunggak
      };
    }

    // Kartu hijau serbaguna saat daftarnya kosong
    function _kartuKosong(teks, ikon) {
      return '<div class="card kosong-card">' +
               '<i class="fa-solid ' + (ikon || 'fa-check-circle') + ' kosong-ikon"></i>' +
               '<span class="kosong-teks">' + teks + '</span>' +
             '</div>';
    }

    // Bangun satu tabel dari daftar objek.
    // kolom: array { judul, ambil(baris) }
    function _tabelDari(daftar, kolom, teksKosong, ikonKosong) {
      if (!daftar || daftar.length === 0) return _kartuKosong(teksKosong, ikonKosong);

      const kepala = kolom.map(function(k) { return '<th>' + k.judul + '</th>'; }).join('');
      const isi = daftar.map(function(b) {
        return '<tr>' + kolom.map(function(k) {
          return '<td>' + k.ambil(b) + '</td>';
        }).join('') + '</tr>';
      }).join('');

      return '<div class="card"><div class="tabel-wrap"><table class="tabel">' +
               '<thead><tr>' + kepala + '</tr></thead>' +
               '<tbody>' + isi + '</tbody>' +
             '</table></div></div>';
    }

    // Rupiah tanpa desimal, dipakai seluruh modul keuangan
    function _rp(n) {
      const angka = Number(n) || 0;
      return 'Rp ' + angka.toLocaleString('id-ID');
    }

    // Tanggal pendek. Isi dari sheet bisa berupa teks ISO maupun objek tanggal.
    function _tgl(v) {
      if (!v) return '-';
      const t = new Date(v);
      if (isNaN(t.getTime())) return String(v);
      return t.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    // Kurung isi teks supaya tanda < dan & dari sheet tidak merusak HTML
    function _aman(v) {
      return String(v === null || v === undefined ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* --------------------------------------------------------------------
     *  SIMPANAN DATA SERVER
     * --------------------------------------------------------------------
     *  Beberapa modul menggambar isinya lewat fungsi html* yang sejak awal
     *  membaca localStorage. Supaya fungsi-fungsi itu tidak perlu ditulis
     *  ulang, hasil jemputan server dititipkan di sini lebih dulu, lalu
     *  fungsi html*-nya membaca lewat _srv().
     *
     *  Aturannya sederhana:
     *    - Sudah dijemput dari server  -> pakai isi server
     *    - Belum pernah dijemput       -> pakai localStorage (MODE_API mati)
     *
     *  Jemputan yang GAGAL tidak pernah sampai ke sini karena _muatModul()
     *  berhenti di kartu gagal, jadi layar tidak akan pernah menampilkan
     *  data peramban sambil mengaku data server.
     * -------------------------------------------------------------------- */

    // Titipkan hasil satu jemputan. Kunci memakai nama tabelnya.
    function _srvIsi(isi) {
      Object.keys(isi || {}).forEach(function(k) {
        if (Array.isArray(isi[k])) SRV[k] = isi[k];
      });
    }

    // Baca satu daftar: server bila ada, selain itu localStorage.
    function _srv(kunciServer, kunciLokal) {
      return Array.isArray(SRV[kunciServer]) ? SRV[kunciServer] : _bacaArr(kunciLokal);
    }

    // Buang titipan sebelum modul lain dibuka, supaya sisa data modul
    // sebelumnya tidak terbawa dan tersangka data modul yang baru.
    function _srvKosongkan() {
      Object.keys(SRV).forEach(function(k) { delete SRV[k]; });
    }

    // Tabel akun pending. Dipakai jalur localStorage maupun jalur API,
    // supaya tampilannya tidak pernah berbeda antara keduanya.
    function _htmlTabelApproveAkun(pending) {
      const baris = pending.map(function(u) {
        const role = String(u.role || '').toLowerCase();

        // Tanggal daftar ditampilkan bila datanya ada.
        // Sheet Users belum punya kolom ini, jadi lewat API isinya "-".
        let tglDaftar = '-';
        if (u.tgl_daftar) {
          const t = new Date(u.tgl_daftar);
          if (!isNaN(t.getTime())) {
            tglDaftar = t.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
          }
        }

        return '<tr>' +
                 '<td>' + (u.nama || '-') + '</td>' +
                 '<td>' + (u.email || '-') + '</td>' +
                 '<td><span class="badge badge--' + role + '">' + (u.role || '-') + '</span></td>' +
                 '<td>' + tglDaftar + '</td>' +
                 '<td>' +
                   '<button class="btn-aksi btn-setujui" id="setuju-' + u.id + '" ' +
                     'onclick="approveAkun(' + u.id + ')">' +
                     '<i class="fa-solid fa-check"></i>Setujui</button>' +
                   '<button class="btn-aksi btn-tolak" id="tolak-' + u.id + '" ' +
                     'onclick="tolakAkun(' + u.id + ')">' +
                     '<i class="fa-solid fa-times"></i>Tolak</button>' +
                 '</td>' +
               '</tr>';
      }).join('');

      return '<div class="card">' +
               '<div class="tabel-wrap">' +
                 '<table class="tabel">' +
                   '<thead><tr>' +
                     '<th>Nama</th><th>Email</th><th>Role</th><th>Tanggal Daftar</th><th>Aksi</th>' +
                   '</tr></thead>' +
                   '<tbody>' + baris + '</tbody>' +
                 '</table>' +
               '</div>' +
             '</div>';
    }

    // Kartu hijau saat tidak ada akun yang menunggu
    function _kartuSemuaAktif() {
      return '<div class="card kosong-card">' +
               '<i class="fa-solid fa-check-circle kosong-ikon"></i>' +
               '<span class="kosong-teks">Semua akun sudah aktif</span>' +
             '</div>';
    }

    // Saring akun yang belum aktif lalu urutkan agar hasilnya konsisten
    function _akunPending(users) {
      const pending = users.filter(function(u) { return u && u.aktif === false; });

      // Urutan memakai tgl_daftar hanya bila SEMUA akun pending memilikinya,
      // selain itu seluruhnya diurutkan berdasarkan id
      const pakaiTanggal = pending.length > 0 && pending.every(function(u) {
        return u.tgl_daftar && !isNaN(new Date(u.tgl_daftar).getTime());
      });

      pending.sort(function(a, b) {
        if (pakaiTanggal) return new Date(a.tgl_daftar) - new Date(b.tgl_daftar);
        return (parseInt(a.id, 10) || 0) - (parseInt(b.id, 10) || 0);
      });
      return pending;
    }

    function kepsekApproveAkun() {
      const judul = '<h1 class="module-title">Approve Akun</h1>';

      // --- Jalur API: kerangka dulu, isinya menyusul lewat muatApproveAkun() ---
      if (MODE_API) {
        return judul + '<div id="isi-approve-akun">' + _skeletonTabel(4) + '</div>';
      }

      // --- Jalur localStorage: seperti semula, dipertahankan sebagai cadangan ---
      let users = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_users'));
        users = Array.isArray(isi) ? isi : [];
      } catch (e) {
        users = [];
      }

      const pending = _akunPending(users);
      return judul + (pending.length === 0 ? _kartuSemuaAktif() : _htmlTabelApproveAkun(pending));
    }

    // Jemput daftar akun dari server lalu isikan ke kerangka yang sudah tergambar.
    // Dipanggil loadModule() setelah HTML modulnya menempel di halaman.
    async function muatApproveAkun() {
      const wadah = document.getElementById('isi-approve-akun');
      if (!wadah) return;

      wadah.innerHTML = _skeletonTabel(4);

      const hasil = await callAPI('getUsers');

      // callAPI mengembalikan null bila jaringannya putus atau tokennya kedaluwarsa
      if (!hasil) {
        wadah.innerHTML = _kartuGagal('Tidak dapat menghubungi server.', 'muatApproveAkun()');
        return;
      }
      if (hasil.status !== 'success') {
        wadah.innerHTML = _kartuGagal(hasil.message || 'Server menolak permintaan.', 'muatApproveAkun()');
        return;
      }

      const pending = _akunPending(Array.isArray(hasil.data) ? hasil.data : []);
      wadah.innerHTML = (pending.length === 0) ? _kartuSemuaAktif() : _htmlTabelApproveAkun(pending);
    }

    // Setujui satu akun: status aktif diubah menjadi true
    async function approveAkun(userId) {
      // --- Jalur API ---
      if (MODE_API) {
        const tombol = document.getElementById('setuju-' + userId);
        const semula = _tombolSibuk(tombol, 'Memproses');

        const hasil = await callAPI('approveAkun', { userId: userId });

        if (!hasil || hasil.status !== 'success') {
          _tombolPulih(tombol, semula);
          showNotif((hasil && hasil.message) || 'Gagal menyetujui akun', 'error');
          return;
        }

        // Daftarnya dijemput ulang dari server, bukan ditebak dari sisi peramban
        await muatApproveAkun();
        showNotif(hasil.message || 'Akun berhasil diaktifkan', 'success');
        return;
      }

      // --- Jalur localStorage ---
      const sesi = getSession();
      let users = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_users'));
        users = Array.isArray(isi) ? isi : [];
      } catch (e) {
        users = [];
      }

      const i = users.findIndex(function(u) { return u && String(u.id) === String(userId); });
      if (i === -1) {
        showNotif('Akun tidak ditemukan', 'error');
        return;
      }

      const nama = users[i].nama || 'Akun';
      users[i].aktif = true;
      localStorage.setItem('sip_users', JSON.stringify(users));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({ aksi: 'approve_akun', userId: userId, oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      loadModule('Approve Akun');
      showNotif(nama + ' berhasil diaktifkan', 'success');
    }

    // Tolak satu akun: datanya dihapus dari daftar pengguna
    async function tolakAkun(userId) {
      // --- Jalur API ---
      if (MODE_API) {
        // Memakai aksi tersendiri tolakAkun(). Sengaja TIDAK memanggil
        // approveAkun dengan status 'rejected': fungsi itu hanya menerima
        // userId dan selalu menulis aktif = true, sehingga justru akan
        // MENGAKTIFKAN akun yang hendak ditolak.
        if (!confirm('Yakin ingin menolak akun ini? Datanya akan dihapus.')) return;

        const tombol = document.getElementById('tolak-' + userId);
        const semula = _tombolSibuk(tombol, 'Menolak');

        const hasil = await callAPI('tolakAkun', { userId: userId });

        if (!hasil || hasil.status !== 'success') {
          _tombolPulih(tombol, semula);
          showNotif((hasil && hasil.message) || 'Gagal menolak akun', 'error');
          return;
        }

        await muatApproveAkun();
        showNotif(hasil.message || 'Akun berhasil ditolak', 'success');
        return;
      }

      // --- Jalur localStorage ---
      if (!confirm('Yakin ingin menolak akun ini?')) return;

      const sesi = getSession();
      let users = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_users'));
        users = Array.isArray(isi) ? isi : [];
      } catch (e) {
        users = [];
      }

      const i = users.findIndex(function(u) { return u && String(u.id) === String(userId); });
      if (i === -1) {
        showNotif('Akun tidak ditemukan', 'error');
        return;
      }

      const nama = users[i].nama || 'Akun';
      users.splice(i, 1);
      localStorage.setItem('sip_users', JSON.stringify(users));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({ aksi: 'tolak_akun', userId: userId, oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      loadModule('Approve Akun');
      showNotif('Akun ' + nama + ' ditolak', 'success');
    }

    // Pindah tab tanpa menjemput ulang
    function gantiTabPengumuman(nilai) {
      tabPengumumanAktif = nilai;
      const wadah = document.getElementById('isi-approve-peng');

    function _htmlIsiApprovePengumuman(tanpaJudul) {
      const semua = _srv('pengumuman', 'sip_pengumuman');

      // Hanya yang menunggu persetujuan dan sesuai tab yang sedang dipilih
      const daftar = semua.filter(function(p) {
        return p && p.status === 'pending' && p.tipe === tabPengumumanAktif;
      });

      // Terbaru di atas. Tanggal dipakai hanya bila semua entri punya tgl yang sah,
      // selain itu urutan memakai id agar hasilnya konsisten.
      const pakaiTanggal = daftar.length > 0 && daftar.every(function(p) {
        return p.tgl && !isNaN(new Date(p.tgl).getTime());
      });
      daftar.sort(function(a, b) {
        if (pakaiTanggal) return new Date(b.tgl) - new Date(a.tgl);
        return (parseInt(b.id, 10) || 0) - (parseInt(a.id, 10) || 0);
      });

      // Dua tab: global dan khusus wali murid
      const tab = [
        { nilai: 'global', teks: 'Pengumuman Global' },
        { nilai: 'khusus', teks: 'Pengumuman Khusus Wali Murid' }
      ].map(function(t) {
        const aktif = (t.nilai === tabPengumumanAktif) ? ' active' : '';
        return '<button class="tab-btn' + aktif + '" ' +
               'onclick="gantiTabPengumuman(\'' + t.nilai + '\')">' +
               t.teks + '</button>';
      }).join('');

      const judul = (tanpaJudul ? '' : '<h1 class="module-title">Approve Pengumuman</h1>') +
                    '<div class="tab-bar">' + tab + '</div>';

      if (daftar.length === 0) {
        return judul +
          '<div class="card kosong-card">' +
            '<i class="fa-solid fa-inbox kosong-ikon"></i>' +
            '<span class="kosong-teks">Tidak ada pengumuman menunggu persetujuan</span>' +
          '</div>';
      }

      const kartu = daftar.map(function(p) {
        // Tanggal ditulis DD/MM/YYYY HH:mm
        let tgl = '-';
        const t = p.tgl ? new Date(p.tgl) : null;
        if (t && !isNaN(t.getTime())) {
          const dua = function(n) { return String(n).padStart(2, '0'); };
          tgl = dua(t.getDate()) + '/' + dua(t.getMonth() + 1) + '/' + t.getFullYear() +
                ' ' + dua(t.getHours()) + ':' + dua(t.getMinutes());
        }

        const labelTipe = (p.tipe === 'khusus') ? 'Khusus Wali Murid' : 'Global';

        return '<div class="card">' +
                 '<div class="peng-head">' +
                   '<div>' +
                     '<span class="peng-nama">' + (p.dari_nama || '-') + '</span>' +
                     '<span class="peng-tgl">' + tgl + '</span>' +
                   '</div>' +
                   '<span class="badge badge--' + (p.tipe === 'khusus' ? 'khusus' : 'global') + '">' + labelTipe + '</span>' +
                 '</div>' +
                 '<p class="peng-konten">' + (p.konten || '-') + '</p>' +
                 '<div class="peng-aksi">' +
                   '<button class="btn-aksi btn-setujui" id="peng-setuju-' + p.id + '" onclick="approvePengumuman(' + p.id + ')">' +
                     '<i class="fa-solid fa-check"></i>Setujui</button>' +
                   '<button class="btn-aksi btn-tolak" id="peng-tolak-' + p.id + '" onclick="tolakPengumuman(' + p.id + ')">' +
                     '<i class="fa-solid fa-times"></i>Tolak</button>' +
                 '</div>' +
               '</div>';
      }).join('');

      return judul + kartu;
    }

    // Ubah angka menjadi tulisan rupiah, contoh: 500000 -> "Rp 500.000"
    function formatRupiah(angka) {
      const n = Math.round(Number(angka) || 0);
      const tanda = n < 0 ? '-' : '';
      const digit = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return 'Rp ' + tanda + digit;
    }

    function _htmlIsiKelolaBiaya() {
      const daftar = _srv('biaya', 'sip_biaya').filter(function(b) { return b && b.id !== undefined; }).slice();

      // Terbaru di atas. Tanggal dipakai hanya bila semua entri punya tgl_dibuat
      // yang sah, selain itu urutan memakai id agar hasilnya konsisten.
      const pakaiTanggal = daftar.length > 0 && daftar.every(function(b) {
        return b.tgl_dibuat && !isNaN(new Date(b.tgl_dibuat).getTime());
      });
      daftar.sort(function(a, b) {
        if (pakaiTanggal) {
          const selisih = new Date(b.tgl_dibuat) - new Date(a.tgl_dibuat);
          // Bila tanggalnya sama persis, id dipakai sebagai penentu urutan
          if (selisih !== 0) return selisih;
        }
        return (Number(b.id) || 0) - (Number(a.id) || 0);

      // --- Bagian atas: form tambah biaya ---

      if (daftar.length === 0) {
        bawah =
          '<div class="card kosong-card">' +
            '<i class="fa-solid fa-money-bill-wave kosong-ikon"></i>' +
            '<span class="kosong-teks">Belum ada biaya terdaftar</span>' +
          '</div>';
      } else {
        const baris = daftar.map(function(b, urut) {
          const aktif = (b.status_aktif !== false);
          const sedangDiedit = (String(biayaSedangDiedit) === String(b.id));

          const selStatus = '<td><span class="badge badge--' + (aktif ? 'aktif' : 'nonaktif') + '">' +
                            (aktif ? 'Aktif' : 'Nonaktif') + '</span></td>';

          // Baris yang sedang disunting menampilkan kolom isian
          if (sedangDiedit) {
            return '<tr>' +
                     '<td>' + (urut + 1) + '</td>' +
                     '<td><input type="text" class="input-inline" id="edit-nama-' + b.id + '" value="' + (b.nama_biaya || '') + '"></td>' +
                     '<td><input type="number" class="input-inline" id="edit-nominal-' + b.id + '" value="' + (Number(b.nominal_default) || 0) + '" min="1"></td>' +
                     selStatus +
                     '<td><div class="aksi-grup">' +
                       '<button class="btn-aksi btn-setujui" id="biaya-simpan-' + b.id + '" onclick="simpanEditBiaya(' + b.id + ')">' +
                         '<i class="fa-solid fa-check"></i>Simpan</button>' +
                       '<button class="btn-aksi btn-abu" onclick="biayaSedangDiedit=null;_gambarUlangBiaya()">' +
                         '<i class="fa-solid fa-xmark"></i>Batal</button>' +
                     '</div></td>' +
                   '</tr>';
          }

          return '<tr>' +
                   '<td>' + (urut + 1) + '</td>' +
                   '<td>' + (b.nama_biaya || '-') + '</td>' +
                   '<td>' + formatRupiah(b.nominal_default) + '</td>' +
                   selStatus +
                   '<td><div class="aksi-grup">' +
                     '<button class="btn-aksi btn-edit" onclick="biayaSedangDiedit=' + b.id + ';_gambarUlangBiaya()">' +
                       '<i class="fa-solid fa-pen"></i>Edit</button>' +
                     (aktif
                       ? '<button class="btn-aksi btn-abu" id="biaya-status-' + b.id + '" onclick="toggleStatusBiaya(' + b.id + ')">' +
                           '<i class="fa-solid fa-ban"></i>Nonaktifkan</button>'
                       : '<button class="btn-aksi btn-setujui" id="biaya-status-' + b.id + '" onclick="toggleStatusBiaya(' + b.id + ')">' +
                           '<i class="fa-solid fa-rotate-left"></i>Aktifkan</button>') +
                   '</div></td>' +
                 '</tr>';
        }).join('');

        bawah =
          '<div class="card">' +
            '<h2 class="section-title">Daftar Biaya</h2>' +
            '<div class="tabel-wrap">' +
              '<table class="tabel">' +
                '<thead><tr>' +
                  '<th>No</th><th>Nama Biaya</th><th>Nominal</th><th>Status</th><th>Aksi</th>' +
                '</tr></thead>' +
                '<tbody>' + baris + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>';
      }

      return '<h1 class="module-title">Kelola Biaya Pesantren</h1>' + form + bawah;
    }

    // Tambah satu jenis biaya baru dari form
    async function tambahBiaya() {
      const sesi = getSession();
      const nama = document.getElementById('biaya-nama').value.trim();
      const nominal = Number(document.getElementById('biaya-nominal').value);

      if (!nama) {
        showNotif('Nama biaya harus diisi', 'error');
        return;
      }
      if (!nominal || nominal <= 0) {
        showNotif('Nominal harus lebih dari 0', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('biaya-tambah', 'crudBiaya',
          { aksiBiaya: 'create', data: { nama_biaya: nama, nominal_default: nominal } },
          'kelolaBiaya', 'Menambah');
        return;
      }

      let daftar = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_biaya'));
        daftar = Array.isArray(isi) ? isi : [];
      } catch (e) {
        daftar = [];
      }

      // Id berbasis Date.now(). Bila ada penambahan lain pada milidetik yang sama,
      // angkanya dinaikkan supaya tidak ada dua biaya ber-id kembar.
      let idBaru = Date.now();
      while (daftar.some(function(b) { return b && Number(b.id) === idBaru; })) {
        idBaru++;
      }

      daftar.push({
        id: idBaru,
        nama_biaya: nama,
        nominal_default: nominal,
        dibuat_oleh: sesi ? sesi.nama : '-',
        status_aktif: true,
        tgl_dibuat: new Date()
      });
      localStorage.setItem('sip_biaya', JSON.stringify(daftar));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({ aksi: 'tambah_biaya', namaBiaya: nama, oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      // Form ikut kosong karena modul digambar ulang
      biayaSedangDiedit = null;
      loadModule('Kelola Biaya');
      showNotif('Biaya "' + nama + '" berhasil ditambahkan', 'success');
    }

    // Simpan hasil penyuntingan satu baris biaya
    async function simpanEditBiaya(id) {
      const sesi = getSession();
      const kolomNama = document.getElementById('edit-nama-' + id);
      const kolomNominal = document.getElementById('edit-nominal-' + id);
      if (!kolomNama || !kolomNominal) {
        showNotif('Kolom isian tidak ditemukan', 'error');
        return;
      }

      const nama = kolomNama.value.trim();
      const nominal = Number(kolomNominal.value);

      if (!nama) {
        showNotif('Nama biaya harus diisi', 'error');
        return;
      }
      if (!nominal || nominal <= 0) {
        showNotif('Nominal harus lebih dari 0', 'error');
        return;
      }

      if (MODE_API) {
        // crudBiaya hanya menerima perubahan nominal, namanya tidak ikut diubah
        biayaSedangDiedit = null;
        await _kirimAksi('biaya-simpan-' + id, 'crudBiaya',
          { aksiBiaya: 'update', data: { id: id, nominal_default: nominal } },
          'kelolaBiaya', 'Menyimpan');
        return;
      }

      let daftar = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_biaya'));
        daftar = Array.isArray(isi) ? isi : [];
      } catch (e) {
        daftar = [];
      }

      const i = daftar.findIndex(function(b) { return b && String(b.id) === String(id); });
      if (i === -1) {
        showNotif('Biaya tidak ditemukan', 'error');
        return;
      }

      daftar[i].nama_biaya = nama;
      daftar[i].nominal_default = nominal;
      localStorage.setItem('sip_biaya', JSON.stringify(daftar));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({ aksi: 'edit_biaya', biayaId: id, oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      biayaSedangDiedit = null;
      loadModule('Kelola Biaya');
      showNotif('Biaya "' + nama + '" berhasil diperbarui', 'success');
    }

    // Nonaktifkan atau aktifkan kembali satu biaya. Data tidak pernah dihapus.
    async function toggleStatusBiaya(id) {
      const sesi = getSession();
      let daftar = _srv('biaya', 'sip_biaya');

      const i = daftar.findIndex(function(b) { return b && String(b.id) === String(id); });
      if (i === -1) {
        showNotif('Biaya tidak ditemukan', 'error');
        return;
      }

      const sedangAktif = (daftar[i].status_aktif !== false);

      // Konfirmasi hanya saat menonaktifkan
      if (sedangAktif && !confirm('Nonaktifkan biaya ini?')) return;

      if (MODE_API) {
        // Backend hanya menyediakan penonaktifan; mengaktifkan kembali
        // belum ada aksinya, jadi dikatakan apa adanya.
        if (!sedangAktif) {
          showNotif('Mengaktifkan kembali biaya belum tersedia di server', 'error');
          return;
        }
        await _kirimAksi('biaya-status-' + id, 'crudBiaya',
          { aksiBiaya: 'delete', data: { id: id } }, 'kelolaBiaya', 'Menonaktifkan');
        return;
      }

      daftar[i].status_aktif = !sedangAktif;
      localStorage.setItem('sip_biaya', JSON.stringify(daftar));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({
        aksi: sedangAktif ? 'nonaktifkan_biaya' : 'aktifkan_biaya',
        biayaId: id,
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      biayaSedangDiedit = null;
      loadModule('Kelola Biaya');
      showNotif(sedangAktif ? 'Biaya dinonaktifkan' : 'Biaya diaktifkan kembali', 'success');
    }

    // Modul Data Siswa Pending milik Kepala Sekolah, mengembalikan HTML siap tampil
    function kepsekDataSiswa() {
      if (MODE_API) return '<div id="isi-siswa-pending" data-muat="siswaPending"></div>';
      return _htmlIsiDataSiswaKepsek();
    }

    PEMUAT.siswaPending = function() {
      return _muatModul('isi-siswa-pending', [['getSiswa'], ['getKelas'], ['getUsers']],
        function(d) {
          _srvIsi({ siswa: d[0], kelas: d[1], users: d[2] });
          return _htmlIsiDataSiswaKepsek();
        }, 'siswaPending', 4);
    };

    function _htmlIsiDataSiswaKepsek() {
      // Pembaca localStorage yang aman: selalu mengembalikan array
      const baca = function(kunci) {
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };

      const semua = _srv('siswa', 'sip_siswa');
      const kelas = _srv('kelas', 'sip_kelas');
      const users = _srv('users', 'sip_users');

      // Seluruh siswa ditampilkan, bukan hanya yang menunggu verifikasi
      const daftar = semua.filter(function(s) { return s && s.id !== undefined; });

      // Tanggal dipakai sebagai penentu urutan hanya bila semua entri punya
      // tgl_input yang sah, selain itu urutan memakai id agar konsisten.
      const pakaiTanggal = daftar.length > 0 && daftar.every(function(s) {
        return s.tgl_input && !isNaN(new Date(s.tgl_input).getTime());
      });

      daftar.sort(function(a, b) {
        // Yang masih menunggu verifikasi selalu berada di atas
        const urutA = (a.status_data === 'approved') ? 1 : 0;
        const urutB = (b.status_data === 'approved') ? 1 : 0;
        if (urutA !== urutB) return urutA - urutB;

        // Di dalam kelompok yang sama, yang terbaru di atas
        if (pakaiTanggal) {
          const selisih = new Date(b.tgl_input) - new Date(a.tgl_input);
          if (selisih !== 0) return selisih;
        }
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const judul = '<h1 class="module-title">Data Siswa Pending</h1>' +
                    '<p class="module-sub">Siswa yang menunggu verifikasi</p>';

      if (daftar.length === 0) {
        return judul +
          '<div class="card kosong-card">' +
            '<i class="fa-solid fa-user-graduate kosong-ikon"></i>' +
            '<span class="kosong-teks">Belum ada data siswa</span>' +
          '</div>';
      }

      // Isian kosong selalu ditampilkan sebagai tanda hubung
      const tampil = function(nilai) {
        if (nilai === undefined || nilai === null || String(nilai).trim() === '') return '-';
        return String(nilai);
      };

      const baris = daftar.map(function(s, urut) {
        // Nama kelas diambil dari sip_kelas. Bila datanya belum ada,
        // id_kelas ditampilkan apa adanya.
        let namaKelas = '-';
        if (s.id_kelas !== undefined && s.id_kelas !== null && s.id_kelas !== '') {
          const k = kelas.find(function(x) { return x && String(x.id) === String(s.id_kelas); });
          namaKelas = k ? (k.nama || String(s.id_kelas)) : String(s.id_kelas);
        }

        // Badge jenis kelamin
        const jk = String(s.jenis_kelamin || '').toUpperCase();
        const selJk = (jk === 'L' || jk === 'P')
          ? '<span class="badge badge--' + jk + '">' + (jk === 'L' ? 'Laki-laki' : 'Perempuan') + '</span>'
          : '-';

        // Badge status data
        const pending = (s.status_data !== 'approved');
        const selStatus = pending
          ? '<span class="badge badge--pending">Menunggu Verifikasi</span>'
          : '<span class="badge badge--terverifikasi">Terverifikasi</span>';

        // Tombol Setujui dan Tolak hanya untuk data yang belum diverifikasi
        const tombolVerifikasi = pending
          ? '<button class="btn-aksi btn-setujui" id="siswa-setuju-' + s.id + '" onclick="approveSiswa(' + s.id + ')">' +
              '<i class="fa-solid fa-check"></i>Setujui</button>' +
            '<button class="btn-aksi btn-tolak" id="siswa-tolak-' + s.id + '" onclick="tolakSiswa(' + s.id + ')">' +
              '<i class="fa-solid fa-times"></i>Tolak</button>'
          : '';

        return '<tr' + (pending ? ' class="baris-pending"' : '') + '>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + tampil(s.nis) + '</td>' +
                 '<td>' + tampil(s.nama_lengkap) + '</td>' +
                 '<td>' + tampil(s.nama_panggilan) + '</td>' +
                 '<td>' + selJk + '</td>' +
                 '<td>' + namaKelas + '</td>' +
                 '<td>' + tampil(s.nama_ayah) + '</td>' +
                 '<td>' + tampil(s.no_hp_orangtua) + '</td>' +
                 '<td>' + selStatus + '</td>' +
                 '<td><div class="aksi-grup">' +
                   '<button class="btn-aksi btn-detail" title="Lihat detail" onclick="lihatDetailSiswa(' + s.id + ')">' +
                     '<i class="fa-solid fa-eye"></i></button>' +
                   tombolVerifikasi +
                 '</div></td>' +
               '</tr>';
      }).join('');

      return judul +
        '<div class="card">' +
          '<div class="tabel-wrap">' +
            '<table class="tabel tabel--lebar">' +
              '<thead><tr>' +
                '<th>No</th><th>NIS</th><th>Nama Lengkap</th><th>Nama Panggilan</th>' +
                '<th>Jenis Kelamin</th><th>Kelas</th><th>Nama Orang Tua</th>' +
                '<th>No HP Orang Tua</th><th>Status</th><th>Aksi</th>' +
              '</tr></thead>' +
              '<tbody>' + baris + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';
    }

    // Tampilkan popup berisi seluruh data satu siswa
    function lihatDetailSiswa(id) {
      const baca = function(kunci) {
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };

      const s = baca('sip_siswa').find(function(x) { return x && String(x.id) === String(id); });
      if (!s) {
        showNotif('Data siswa tidak ditemukan', 'error');
        return;
      }

      const kelas = baca('sip_kelas');
      const users = baca('sip_users');

      // Isian kosong selalu ditampilkan sebagai tanda hubung
      const tampil = function(nilai) {
        if (nilai === undefined || nilai === null || String(nilai).trim() === '') return '-';
        return String(nilai);
      };
      const dua = function(n) { return String(n).padStart(2, '0'); };

      // Tanggal tanpa jam, contoh 15/05/2010
      const tglPendek = function(nilai) {
        if (!nilai) return '-';
        const t = new Date(nilai);
        if (isNaN(t.getTime())) return '-';
        return dua(t.getDate()) + '/' + dua(t.getMonth() + 1) + '/' + t.getFullYear();
      };

      // Tanggal beserta jam, contoh 15/05/2010 08:30
      const tglPanjang = function(nilai) {
        if (!nilai) return '-';
        const t = new Date(nilai);
        if (isNaN(t.getTime())) return '-';
        return tglPendek(nilai) + ' ' + dua(t.getHours()) + ':' + dua(t.getMinutes());
      };

      // Satu pasang label dan nilai
      const item = function(label, nilai, penuh) {
        return '<div class="detail-item' + (penuh ? ' detail-item--full' : '') + '">' +
                 '<span class="detail-label">' + label + '</span>' +
                 '<span class="detail-nilai">' + nilai + '</span>' +
               '</div>';
      };

      // --- Bagian 1: identitas pribadi ---
      const jk = String(s.jenis_kelamin || '').toUpperCase();
      const teksJk = jk === 'L' ? 'Laki-laki' : (jk === 'P' ? 'Perempuan' : '-');

      const bagian1 =
        '<div class="detail-section"><h4>Data Identitas Pribadi</h4><div class="detail-grid">' +
          item('NIS', tampil(s.nis)) +
          item('NISN', tampil(s.nisn)) +
          item('Nama Lengkap', tampil(s.nama_lengkap)) +
          item('Nama Panggilan', tampil(s.nama_panggilan)) +
          item('Tempat Lahir', tampil(s.tempat_lahir)) +
          item('Tanggal Lahir', tglPendek(s.tanggal_lahir)) +
          item('Jenis Kelamin', teksJk) +
          item('Agama', tampil(s.agama)) +
          item('Kewarganegaraan', tampil(s.kewarganegaraan)) +
          item('Alamat Domisili', tampil(s.alamat_domisili), true) +
        '</div></div>';

      // --- Bagian 2: akademik ---
      let namaKelas = '-';
      if (s.id_kelas !== undefined && s.id_kelas !== null && s.id_kelas !== '') {
        const k = kelas.find(function(x) { return x && String(x.id) === String(s.id_kelas); });
        namaKelas = k ? (k.nama || String(s.id_kelas)) : String(s.id_kelas);
      }

      const bagian2 =
        '<div class="detail-section"><h4>Data Akademik</h4><div class="detail-grid">' +
          item('Kelas', namaKelas) +
          item('Tahun Masuk', tampil(s.tahun_masuk)) +
        '</div></div>';

      // --- Bagian 3: keluarga dan orang tua ---
      const bagian3 =
        '<div class="detail-section"><h4>Data Keluarga &amp; Orang Tua</h4><div class="detail-grid">' +
          item('Nama Ayah', tampil(s.nama_ayah)) +
          item('Pekerjaan Ayah', tampil(s.pekerjaan_ayah)) +
          item('Penghasilan Ayah', s.penghasilan_ayah === undefined || s.penghasilan_ayah === null || s.penghasilan_ayah === '' ? '-' : formatRupiah(s.penghasilan_ayah)) +
          item('Nama Ibu', tampil(s.nama_ibu)) +
          item('Pekerjaan Ibu', tampil(s.pekerjaan_ibu)) +
          item('Penghasilan Ibu', s.penghasilan_ibu === undefined || s.penghasilan_ibu === null || s.penghasilan_ibu === '' ? '-' : formatRupiah(s.penghasilan_ibu)) +
          item('No HP Orang Tua', tampil(s.no_hp_orangtua)) +
          item('Jumlah Saudara', (s.jumlah_saudara === undefined || s.jumlah_saudara === null || s.jumlah_saudara === '') ? '-' : (s.jumlah_saudara + ' orang')) +
          item('Alamat Orang Tua', tampil(s.alamat_orangtua), true) +
        '</div></div>';

      // --- Bagian 4: akun wali murid ---
      let namaWali = '-';
      let emailWali = tampil(s.email_wali_murid);
      let statusAkun = '-';
      if (s.id_wali_murid !== undefined && s.id_wali_murid !== null && s.id_wali_murid !== '') {
        const w = users.find(function(x) { return x && String(x.id) === String(s.id_wali_murid); });
        if (w) {
          namaWali = tampil(w.nama);
          if (w.email) emailWali = w.email;
          statusAkun = (w.aktif === false) ? 'Nonaktif' : 'Aktif';
        }
      }

      const bagian4 =
        '<div class="detail-section"><h4>Data Wali Murid (Akun)</h4><div class="detail-grid">' +
          item('Nama Wali Murid', namaWali) +
          item('Email Wali Murid', emailWali) +
          item('Status Akun', statusAkun) +
        '</div></div>';

      // --- Bagian 5: metadata ---
      const badgeStatus = (s.status_data === 'approved')
        ? '<span class="badge badge--terverifikasi">Terverifikasi</span>'
        : '<span class="badge badge--pending">Menunggu Verifikasi</span>';

      const bagian5 =
        '<div class="detail-section"><h4>Metadata</h4><div class="detail-grid">' +
          item('Status Data', badgeStatus) +
          item('Diinput Oleh', tampil(s.diinput_oleh)) +
          item('Tanggal Input', tglPanjang(s.tgl_input)) +
          item('Disetujui Oleh', tampil(s.approved_by)) +
          item('Tanggal Approve', tglPanjang(s.tgl_approve)) +
        '</div></div>';

      // Popup lama dibuang dulu agar tidak menumpuk
      tutupDetailSiswa();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      // Klik pada area gelap di luar kartu ikut menutup popup
      overlay.setAttribute('onclick', 'if(event.target===this)tutupDetailSiswa()');
      overlay.innerHTML =
        '<div class="modal">' +
          '<div class="modal-head">' +
            '<span class="modal-judul">' + tampil(s.nama_lengkap) + '</span>' +
            '<button class="modal-tutup" title="Tutup" onclick="tutupDetailSiswa()">' +
              '<i class="fa-solid fa-xmark"></i></button>' +
          '</div>' +
          bagian1 + bagian2 + bagian3 + bagian4 + bagian5 +
        '</div>';
      document.body.appendChild(overlay);
    }

    // Tutup popup detail siswa
    function tutupDetailSiswa() {
      const p = document.querySelector('.modal-overlay');
      if (p) p.remove();
    }

    // Setujui data satu siswa
    async function approveSiswa(id) {
      if (MODE_API) {
        await _kirimAksi('siswa-setuju-' + id, 'approveSiswa',
          { siswaId: id, status: 'approved' }, 'siswaPending', 'Menyetujui');
        return;
      }

      const sesi = getSession();
      let daftar = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_siswa'));
        daftar = Array.isArray(isi) ? isi : [];
      } catch (e) {
        daftar = [];
      }

      const i = daftar.findIndex(function(s) { return s && String(s.id) === String(id); });
      if (i === -1) {
        showNotif('Data siswa tidak ditemukan', 'error');
        return;
      }

      const nama = daftar[i].nama_lengkap || daftar[i].nama || 'Siswa';
      daftar[i].status_data = 'approved';
      daftar[i].approved_by = sesi ? sesi.nama : '-';
      daftar[i].tgl_approve = new Date();
      localStorage.setItem('sip_siswa', JSON.stringify(daftar));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({ aksi: 'approve_siswa', siswaId: id, oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      loadModule('Data Siswa Pending');
      showNotif('Data ' + nama + ' berhasil diverifikasi', 'success');
    }

    // Tolak data siswa. Datanya dihapus, jadi wajib dikonfirmasi lebih dulu.
    async function tolakSiswa(id) {
      if (!confirm('Tolak data siswa ini? Data akan dihapus.')) return;

      if (MODE_API) {
        await _kirimAksi('siswa-tolak-' + id, 'approveSiswa',
          { siswaId: id, status: 'rejected' }, 'siswaPending', 'Menolak');
        return;
      }


      const sesi = getSession();
      let daftar = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_siswa'));
        daftar = Array.isArray(isi) ? isi : [];
      } catch (e) {
        daftar = [];
      }

      const i = daftar.findIndex(function(s) { return s && String(s.id) === String(id); });
      if (i === -1) {
        showNotif('Data siswa tidak ditemukan', 'error');
        return;
      }

      const nama = daftar[i].nama_lengkap || daftar[i].nama || 'Siswa';
      daftar.splice(i, 1);
      localStorage.setItem('sip_siswa', JSON.stringify(daftar));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({ aksi: 'tolak_siswa', siswaId: id, oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      loadModule('Data Siswa Pending');
      showNotif('Data ' + nama + ' ditolak dan dihapus', 'success');
    }

    // Sebutan role yang enak dibaca, dipakai di daftar penerima dan badge
    function labelRole(role, subrole) {
      const r = String(role || '').toLowerCase();
      if (r === 'guru') {
        return String(subrole || '').toLowerCase() === 'walikelas' ? 'Guru Wali Kelas' : 'Guru';
      }
      if (r === 'bendahara') return 'Bendahara';
      if (r === 'ktu') return 'KTU';
      if (r === 'kepsek') return 'Kepala Sekolah';
      if (r === 'walimurid') return 'Wali Murid';
      return role || '-';
    }

    function kepsekPengumumanPersonal() {
      if (MODE_API) return '<div id="isi-peng-personal" data-muat="pengPersonal"></div>';

    function _htmlIsiPengPersonal() {
      const sesi = getSession();
      const baca = function(kunci) {
        if (kunci === 'sip_users') return _srv('users', 'sip_users');
        if (kunci === 'sip_pengumuman') return _srv('pengumuman', 'sip_pengumuman');
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };

      // --- Daftar penerima: hanya guru, bendahara, dan KTU yang akunnya aktif ---
      const bolehTerima = ['guru', 'bendahara', 'ktu'];
      const penerima = baca('sip_users').filter(function(u) {
        return u && u.aktif !== false && bolehTerima.indexOf(String(u.role || '').toLowerCase()) > -1;
      });

      // Diurutkan berdasarkan role lebih dulu, lalu nama
      penerima.sort(function(a, b) {
        const ra = String(a.role || '').toLowerCase();
        const rb = String(b.role || '').toLowerCase();
        if (ra !== rb) return ra < rb ? -1 : 1;
        return String(a.nama || '').localeCompare(String(b.nama || ''));
      });

      const pilihan = penerima.map(function(u) {
        return '<option value="' + u.id + '">' + (u.nama || '-') + ' - (' + labelRole(u.role, u.subrole) + ')</option>';
      }).join('');

      const form =
        '<div class="card card--form">' +
          '<label class="form-label" for="personal-penerima">Pilih Penerima</label>' +
          '<select id="personal-penerima" class="input">' +
            '<option value="">-- Pilih Penerima --</option>' + pilihan +
          '</select>' +
          '<label class="form-label" for="personal-pesan">Isi Pesan</label>' +
          '<textarea id="personal-pesan" class="input" rows="5" placeholder="Tulis pesan pengumuman..."></textarea>' +
          '<button class="btn btn--full" id="personal-kirim" onclick="kirimPengumumanPersonal()">' +
            '<i class="fa-solid fa-paper-plane"></i> Kirim Pengumuman</button>' +
        '</div>';

      // --- Riwayat: hanya kiriman personal dari Kepala Sekolah yang sedang masuk ---
      const riwayat = baca('sip_pengumuman').filter(function(p) {
        return p && p.tipe === 'personal' && sesi && String(p.dari_id_user) === String(sesi.id);
      });

      // Terbaru di atas
      const pakaiTanggal = riwayat.length > 0 && riwayat.every(function(p) {
        return p.tgl && !isNaN(new Date(p.tgl).getTime());
      });
      riwayat.sort(function(a, b) {
        if (pakaiTanggal) {
          const selisih = new Date(b.tgl) - new Date(a.tgl);
          if (selisih !== 0) return selisih;
        }
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      let isiRiwayat;
      if (riwayat.length === 0) {
        isiRiwayat =
          '<div class="card kosong-card">' +
            '<i class="fa-solid fa-inbox kosong-ikon"></i>' +
            '<span class="kosong-teks">Belum ada pengumuman terkirim</span>' +
          '</div>';
      } else {
        isiRiwayat = riwayat.map(function(p) {
          // Tanggal ditulis DD/MM/YYYY HH:mm
          let tgl = '-';
          const t = p.tgl ? new Date(p.tgl) : null;
          if (t && !isNaN(t.getTime())) {
            const dua = function(n) { return String(n).padStart(2, '0'); };
            tgl = dua(t.getDate()) + '/' + dua(t.getMonth() + 1) + '/' + t.getFullYear() +
                  ' ' + dua(t.getHours()) + ':' + dua(t.getMinutes());
          }

          const role = String(p.ke_role || '').toLowerCase();

          return '<div class="card">' +
                   '<div class="peng-head">' +
                     '<div>' +
                       '<span class="peng-nama">' + (p.ke_nama || '-') + '</span>' +
                       '<span class="peng-tgl">' + tgl + '</span>' +
                     '</div>' +
                     '<div>' +
                       '<span class="badge badge--' + role + '">' + labelRole(p.ke_role, p.ke_subrole) + '</span>' +
                       '<div class="peng-status"><span class="badge badge--terkirim">Terkirim</span></div>' +
                     '</div>' +
                   '</div>' +
                   '<p class="peng-konten">' + (p.konten || '-') + '</p>' +
                 '</div>';
        }).join('');
      }

      return '<h1 class="module-title">Pengumuman Personal</h1>' +
             '<p class="module-sub">Kirim pengumuman langsung ke individu (tanpa approval)</p>' +
             form +
             '<h3 class="section-title">Riwayat Pengumuman Terkirim</h3>' +
             isiRiwayat;
    }

    // Kirim satu pengumuman personal. Langsung berstatus approved karena dari Kepsek.
    async function kirimPengumumanPersonal() {
      const sesi = getSession();
      const kolomPenerima = document.getElementById('personal-penerima');
      const kolomPesan = document.getElementById('personal-pesan');
      if (!kolomPenerima || !kolomPesan) {
        showNotif('Formulir tidak ditemukan', 'error');
        return;
      }

      const idPenerima = kolomPenerima.value;
      const pesan = kolomPesan.value.trim();

      if (!idPenerima) {
        showNotif('Penerima harus dipilih', 'error');
        return;
      }
      if (!pesan) {
        showNotif('Isi pesan tidak boleh kosong', 'error');
        return;
      }

      const users = _srv('users', 'sip_users');
      const penerima = users.find(function(u) { return u && String(u.id) === String(idPenerima); });
      if (!penerima) {
        showNotif('Penerima tidak ditemukan', 'error');
        return;
      }

      if (MODE_API) {
        // Pesan pribadi dari Kepala Sekolah tidak melewati persetujuan lagi;
        // beliau memang penyetuju tertingginya
        await _kirimAksi('personal-kirim', 'createPengumuman', { data: {
          tipe: 'personal', id_penerima_user: idPenerima, konten: pesan,
          judul: 'Pesan untuk ' + (penerima.nama || '-')
        } }, 'pengPersonal', 'Mengirim');
        return;
      }

      let daftar = [];
      try {
        const isi = JSON.parse(localStorage.getItem('sip_pengumuman'));
        daftar = Array.isArray(isi) ? isi : [];
      } catch (e) {
        daftar = [];
      }

      // Id berbasis Date.now(), dinaikkan bila angkanya sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(p) { return p && Number(p.id) === idBaru; })) {
        idBaru++;
      }

      daftar.push({
        id: idBaru,
        dari_id_user: sesi ? sesi.id : null,
        dari_nama: sesi ? sesi.nama : '-',
        dari_role: 'kepsek',
        tipe: 'personal',
        ke_id_user: penerima.id,
        ke_nama: penerima.nama || '-',
        ke_role: penerima.role || '',
        ke_subrole: penerima.subrole || '',
        id_penerima_siswa: null,
        konten: pesan,
        status: 'approved',
        tgl: new Date(),
        approved_by: sesi ? sesi.nama : '-'
      });
      localStorage.setItem('sip_pengumuman', JSON.stringify(daftar));

      // Catat jejak aksi
      let log = [];
      try {
        const isiLog = JSON.parse(localStorage.getItem('sip_log'));
        log = Array.isArray(isiLog) ? isiLog : [];
      } catch (e) {
        log = [];
      }
      log.push({
        aksi: 'kirim_pengumuman_personal',
        pengumumanId: idBaru,
        ke: penerima.nama || '-',
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      // Modul digambar ulang, jadi formulir otomatis kosong kembali
      loadModule('Pengumuman Personal');
      showNotif('Pengumuman berhasil dikirim ke ' + (penerima.nama || '-'), 'success');
    }

    // ================= FUNGSI BANTU LAPORAN KINERJA =================

    // Ubah tanggal menjadi tulisan DD/MM/YYYY
    function formatTanggal(date) {
      if (!date) return '-';
      const t = new Date(date);
      if (isNaN(t.getTime())) return '-';
      const dua = function(n) { return String(n).padStart(2, '0'); };
      return dua(t.getDate()) + '/' + dua(t.getMonth() + 1) + '/' + t.getFullYear();
    }

    // Rata-rata dari sekumpulan angka, dibulatkan satu angka di belakang koma
    function hitungRataRata(arrayNilai) {
      if (!Array.isArray(arrayNilai) || arrayNilai.length === 0) return 0;
      const angka = arrayNilai.map(Number).filter(function(n) { return !isNaN(n); });
      if (angka.length === 0) return 0;
      const jumlah = angka.reduce(function(a, b) { return a + b; }, 0);
      return Math.round((jumlah / angka.length) * 10) / 10;
    }

    // Saring data berdasarkan rentang tanggal pada field tgl
    function filterByTanggal(data, mulai, akhir) {
      if (!Array.isArray(data)) return [];
      const batasAwal = mulai ? new Date(mulai + 'T00:00:00') : null;
      const batasAkhir = akhir ? new Date(akhir + 'T23:59:59') : null;
      return data.filter(function(d) {
        if (!d || !d.tgl) return false;
        const t = new Date(d.tgl);
        if (isNaN(t.getTime())) return false;
        if (batasAwal && t < batasAwal) return false;
        if (batasAkhir && t > batasAkhir) return false;
        return true;
      });
    }

    // Modul Laporan Kinerja milik Kepala Sekolah, mengembalikan HTML siap tampil
    function kepsekLaporanKinerja() {
      const kepala = '<h1 class="module-title">Laporan Kinerja Pengajar</h1>' +
                     '<p class="module-sub">Rekap absensi, RPP, dan nilai per guru</p>';

    // Rentang tanggal dikirim ke server, penyaringan per guru dikerjakan di
    // layar supaya daftar pilihan gurunya tidak menyusut jadi satu nama.
    PEMUAT.laporanKinerja = function() {
      _isiTanggalLaporanBilaKosong();
      const rentang = { tgl_mulai: laporanFilter.tglMulai, tgl_akhir: laporanFilter.tglAkhir };

      // Data rincian ikut dijemput sekarang, serentak dalam satu putaran,
      // supaya popup detail per guru tidak perlu menunggu server lagi.
      return _muatModul('isi-laporan-kinerja',
        [['getLaporanKinerja', { filter: rentang }], ['getAbsensiGuru', { filter: rentang }],
         ['getRPP', { filter: rentang }], ['getNilai', { filter: rentang }],
         ['getMapel'], ['getKelas'], ['getSiswa']],
        function(d) {
          SRV.laporan = d[0];
          _srvIsi({ absensiGuru: d[1], rpp: d[2], nilai: d[3], mapel: d[4], kelas: d[5], siswa: d[6] });
          return _htmlIsiLaporanKinerja(true);
        }, 'laporanKinerja', 4);
    };

    // Nilai awal penyaring: sebulan terakhir sampai hari ini
    function _isiTanggalLaporanBilaKosong() {
      if (laporanFilter.tglMulai && laporanFilter.tglAkhir) return;
      const dua = function(n) { return String(n).padStart(2, '0'); };
      const ymd = function(d) { return d.getFullYear() + '-' + dua(d.getMonth() + 1) + '-' + dua(d.getDate()); };
      const kini = new Date();
      const sebulanLalu = new Date();
      sebulanLalu.setMonth(sebulanLalu.getMonth() - 1);
      laporanFilter.tglMulai = ymd(sebulanLalu);
      laporanFilter.tglAkhir = ymd(kini);
    }

    function _htmlIsiLaporanKinerja(tanpaJudul) {
      const baca = function(kunci) {
        try {
          const isi = JSON.parse(localStorage.getItem(kunci));
          return Array.isArray(isi) ? isi : [];
        } catch (e) {
          return [];
        }
      };
      const ymd = function(d) {
        const dua = function(n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '-' + dua(d.getMonth() + 1) + '-' + dua(d.getDate());
      };

      // Nilai awal penyaring: sebulan terakhir sampai hari ini
      if (!laporanFilter.tglMulai || !laporanFilter.tglAkhir) {
        const kini = new Date();
        const sebulanLalu = new Date();
        sebulanLalu.setMonth(sebulanLalu.getMonth() - 1);
        laporanFilter.tglMulai = ymd(sebulanLalu);
        laporanFilter.tglAkhir = ymd(kini);
      }

      // --- Daftar guru untuk dropdown, urut abjad ---
      // Daftar guru dari server sudah lengkap beserta jenis penugasannya
      const semuaGuru = SRV.laporan
        ? SRV.laporan.guru.map(function(g) {
            return { id: g.id, nama: g.nama, subrole: g.jenis_guru,
                     absensi_hadir: g.absensi_hadir, jumlah_rpp: g.jumlah_rpp,
                     jumlah_nilai: g.jumlah_nilai, rata_nilai: g.rata_nilai };
          })
        : baca('sip_users').filter(function(u) {
            return u && String(u.role || '').toLowerCase() === 'guru';
          });
      semuaGuru.sort(function(a, b) {
        return String(a.nama || '').localeCompare(String(b.nama || ''));
      });

      const pilihanGuru = semuaGuru.map(function(g) {
        const jenis = String(g.subrole || '').toLowerCase() === 'walikelas' ? 'Guru Wali Kelas' : 'Guru Mapel';
        const terpilih = String(laporanFilter.idGuru) === String(g.id) ? ' selected' : '';
        return '<option value="' + g.id + '"' + terpilih + '>' + (g.nama || '-') + ' - (' + jenis + ')</option>';
      }).join('');

      const filter =
        '<div class="card--filter">' +
          '<div class="filter-grid">' +
            '<div>' +
              '<label class="form-label" for="filterGuru">Pilih Guru</label>' +
              '<select id="filterGuru" class="input">' +
                '<option value=""' + (laporanFilter.idGuru ? '' : ' selected') + '>Semua Guru</option>' +
                pilihanGuru +
              '</select>' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="tglMulai">Tanggal Mulai</label>' +
              '<input type="date" id="tglMulai" class="input" value="' + laporanFilter.tglMulai + '">' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="tglAkhir">Tanggal Akhir</label>' +
              '<input type="date" id="tglAkhir" class="input" value="' + laporanFilter.tglAkhir + '">' +
            '</div>' +
          '</div>' +
          '<div class="filter-aksi">' +
            '<button class="btn" id="laporan-tampilkan" onclick="tampilkanLaporan()"><i class="fa-solid fa-search"></i> Tampilkan</button>' +
            '<button class="btn btn--abu" onclick="resetLaporan()"><i class="fa-solid fa-sync"></i> Reset</button>' +
          '</div>' +
        '</div>';

      const judul = tanpaJudul ? '' : ('<h1 class="module-title">Laporan Kinerja Pengajar</h1>' +
                    '<p class="module-sub">Rekap absensi, RPP, dan nilai per guru</p>');

      // Selama tombol Tampilkan belum ditekan, tidak ada data yang digambar
      if (!laporanSudahTampil) {
        return judul + filter +
          '<div class="card"><p class="pesan-info">Gunakan filter di atas untuk melihat laporan</p></div>';
      }

      // Guru yang masuk laporan mengikuti pilihan dropdown
      const guruTampil = laporanFilter.idGuru
        ? semuaGuru.filter(function(g) { return String(g.id) === String(laporanFilter.idGuru); })
        : semuaGuru;

      // --- Kumpulkan angka ---
      // Server sudah mengirimnya terhitung per guru; jalur localStorage
      // masih menghitungnya sendiri dari baris mentah.
      let absensi = [], rpp = [], nilai = [];
      let totalHadir, totalRpp, rataSemua, adaAngka;

      if (SRV.laporan) {
        totalHadir = guruTampil.reduce(function(a, g) { return a + (g.absensi_hadir || 0); }, 0);
        totalRpp = guruTampil.reduce(function(a, g) { return a + (g.jumlah_rpp || 0); }, 0);
        const jumlahNilai = guruTampil.reduce(function(a, g) { return a + (g.jumlah_nilai || 0); }, 0);
        const bobot = guruTampil.reduce(function(a, g) { return a + (g.rata_nilai || 0) * (g.jumlah_nilai || 0); }, 0);
        rataSemua = jumlahNilai ? bobot / jumlahNilai : 0;
        adaAngka = jumlahNilai > 0;
      } else {
        absensi = filterByTanggal(baca('sip_absensi'), laporanFilter.tglMulai, laporanFilter.tglAkhir);
        rpp = filterByTanggal(baca('sip_rpp'), laporanFilter.tglMulai, laporanFilter.tglAkhir);
        nilai = filterByTanggal(baca('sip_nilai'), laporanFilter.tglMulai, laporanFilter.tglAkhir);

        const idTampil = guruTampil.map(function(g) { return String(g.id); });
        const milikGuru = function(arr) {
          return arr.filter(function(d) { return idTampil.indexOf(String(d.id_guru)) > -1; });
        };
        totalHadir = milikGuru(absensi).filter(function(a) {
          return String(a.status || '').toLowerCase() === 'hadir';
        }).length;
        totalRpp = milikGuru(rpp).length;
        const nilaiTampil = milikGuru(nilai);
        rataSemua = hitungRataRata(nilaiTampil.map(function(n) { return n.nilai; }));
        adaAngka = nilaiTampil.length > 0;
      }

      const ringkasan =
        '<div class="stat-grid">' +
          '<div class="stat-card stat-card--hijau" style="animation-delay:0.1s">' +
            '<i class="fa-solid fa-calendar-check stat-icon"></i>' +
            '<div class="stat-number">' + totalHadir + '</div>' +
            '<div class="stat-label">Total Absensi Hadir</div>' +
          '</div>' +
          '<div class="stat-card stat-card--biru" style="animation-delay:0.2s">' +
            '<i class="fa-solid fa-book stat-icon"></i>' +
            '<div class="stat-number">' + totalRpp + '</div>' +
            '<div class="stat-label">Total RPP Dibuat</div>' +
          '</div>' +
          '<div class="stat-card stat-card--emas" style="animation-delay:0.3s">' +
            '<i class="fa-solid fa-chart-line stat-icon"></i>' +
            '<div class="stat-number">' + (adaAngka ? rataSemua.toFixed(1) : '-') + '</div>' +
            '<div class="stat-label">Rata-rata Nilai</div>' +
          '</div>' +
        '</div>';

      // --- Tabel rincian per guru ---
      // Pesan kosong dipakai bila tidak ada guru yang cocok, atau bila sepanjang
      // periode itu memang tidak ada satu pun absensi, RPP, maupun nilai.
      const tanpaData = (totalHadir === 0 && totalRpp === 0 && !adaAngka);

      let tabel;
      if (guruTampil.length === 0 || tanpaData) {
        tabel = '<div class="card"><p class="pesan-info">Tidak ada data untuk periode yang dipilih</p></div>';
      } else {
        const baris = guruTampil.map(function(g, urut) {
          const idg = String(g.id);
          let hadir, jmlRpp, rata;

          if (SRV.laporan) {
            hadir = g.absensi_hadir || 0;
            jmlRpp = g.jumlah_rpp || 0;
            rata = g.jumlah_nilai ? Number(g.rata_nilai).toFixed(1) : '-';
          } else {
            hadir = absensi.filter(function(a) {
              return String(a.id_guru) === idg && String(a.status || '').toLowerCase() === 'hadir';
            }).length;
            jmlRpp = rpp.filter(function(r) { return String(r.id_guru) === idg; }).length;
            const nilaiGuru = nilai.filter(function(n) { return String(n.id_guru) === idg; });
            rata = nilaiGuru.length ? hitungRataRata(nilaiGuru.map(function(n) { return n.nilai; })).toFixed(1) : '-';
          }

          const waliKelas = String(g.subrole || '').toLowerCase() === 'walikelas';
          const badge = '<span class="badge badge--' + (waliKelas ? 'walikelas' : 'mapel') + '">' +
                        (waliKelas ? 'Wali Kelas' : 'Mapel') + '</span>';

          return '<tr>' +
                   '<td>' + (urut + 1) + '</td>' +
                   '<td>' + (g.nama || '-') + '</td>' +
                   '<td>' + badge + '</td>' +
                   '<td>' + hadir + '</td>' +
                   '<td>' + jmlRpp + '</td>' +
                   '<td>' + rata + '</td>' +
                   '<td><button class="btn-aksi btn-detail" title="Lihat detail" onclick="lihatDetailGuru(' + g.id + ')">' +
                     '<i class="fa-solid fa-eye"></i></button></td>' +
                 '</tr>';
        }).join('');

        tabel =
          '<div class="card">' +
            '<div class="tabel-wrap">' +
              '<table class="tabel">' +
                '<thead><tr>' +
                  '<th>No</th><th>Nama Guru</th><th>Role</th><th>Jumlah Hadir</th>' +
                  '<th>Jumlah RPP</th><th>Rata-rata Nilai</th><th>Aksi</th>' +
                '</tr></thead>' +
                '<tbody>' + baris + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>';
      }

      return judul + filter + ringkasan + tabel;
    }
