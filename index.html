             '<div class="total-ganda">' +
               '<span>Total Pemasukan: ' + formatRupiah(masuk) + '</span>' +
               '<span>Total Pengeluaran: ' + formatRupiah(keluar) + '</span>' +
             '</div>';
    }

    // Tabel rekap tagihan beserta ringkasan per status
    function htmlTabelRekapTagihan(daftar) {
      if (daftar.length === 0) {
        return '<p class="pesan-info">Tidak ada tagihan untuk periode yang dipilih</p>';
      }

      const siswa = _srv('siswa', 'sip_siswa');
      const biaya = _srv('biaya', 'sip_biaya');
      const kini = new Date();
      let nLunas = 0, nBelum = 0, nMenunggak = 0;

      const baris = daftar.map(function(t, urut) {
        const s = siswa.find(function(x) { return x && String(x.id) === String(t.id_siswa); });
        const b = biaya.find(function(x) { return x && String(x.id) === String(t.id_biaya); });

        const st = _statusTagihan(t, kini);
        const lunas = st.lunas;
        const menunggak = st.menunggak;

        if (lunas) nLunas++;
        else { nBelum++; if (menunggak) nMenunggak++; }

        const kelas = lunas ? 'lunas' : (menunggak ? 'menunggak' : 'belum');
        const teks = lunas ? 'Lunas' : (menunggak ? 'Menunggak' : 'Belum Lunas');

        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (s && s.nis ? s.nis : '-') + '</td>' +
                 '<td>' + (s && (s.nama_lengkap || s.nama) ? (s.nama_lengkap || s.nama) : '-') + '</td>' +
                 '<td>' + (b && b.nama_biaya ? b.nama_biaya : '-') + '</td>' +
                 '<td>' + formatRupiah(t.nominal) + '</td>' +
                 '<td>' + formatTanggal(t.jatuh_tempo) + '</td>' +
                 '<td><span class="badge badge--' + kelas + '">' + teks + '</span></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-scroll">' +
               '<table class="tabel tabel--lebar">' +
                 '<thead><tr>' +
                   '<th>No</th><th>NIS</th><th>Nama Siswa</th><th>Jenis Biaya</th>' +
                   '<th>Nominal</th><th>Jatuh Tempo</th><th>Status</th>' +
                 '</tr></thead>' +
                 '<tbody>' + baris + '</tbody>' +
               '</table>' +
             '</div>' +
             '<div class="total-ganda">' +
               '<span>Lunas: ' + nLunas + '</span>' +
               '<span>Belum Lunas: ' + nBelum + '</span>' +
               '<span>Menunggak: ' + nMenunggak + '</span>' +
             '</div>';
    }

    // Tabel pemasukan yang dikelompokkan per jenis biaya
    function htmlTabelPemasukanPerBiaya(daftar) {
      const pemasukan = daftar.filter(function(t) {
        return String(t.tipe || '').toLowerCase() === 'pemasukan';
      });

      if (pemasukan.length === 0) {
        return '<p class="pesan-info">Tidak ada pemasukan untuk periode yang dipilih</p>';
      }

      const biaya = _srv('biaya', 'sip_biaya').filter(function(b) {
        return b && b.id !== undefined && b.id !== null;
      });

      // Satu transaksi dicocokkan lewat id_biaya, atau lewat nama biaya
      // yang tersebut di dalam deskripsinya
      const sudahTerpakai = {};
      const kelompok = [];

      biaya.forEach(function(b) {
        const nama = String(b.nama_biaya || '');
        let jumlah = 0, total = 0;
        pemasukan.forEach(function(t, i) {
          if (sudahTerpakai[i]) return;
          const cocokId = (t.id_biaya !== undefined && t.id_biaya !== null && String(t.id_biaya) === String(b.id));
          const cocokTeks = nama !== '' && String(t.deskripsi || '').toLowerCase().indexOf(nama.toLowerCase()) > -1;
          if (cocokId || cocokTeks) {
            sudahTerpakai[i] = true;
            jumlah++;
            total += Number(t.jumlah) || 0;
          }
        });
        if (jumlah > 0) kelompok.push({ nama: nama || '-', jumlah: jumlah, total: total });
      });

      // Pemasukan yang tidak terkait biaya apa pun tetap dilaporkan
      // supaya jumlah keseluruhan tetap sesuai
      let sisaJumlah = 0, sisaTotal = 0;
      pemasukan.forEach(function(t, i) {
        if (sudahTerpakai[i]) return;
        sisaJumlah++;
        sisaTotal += Number(t.jumlah) || 0;
      });
      if (sisaJumlah > 0) {
        kelompok.push({ nama: 'Tidak terkait jenis biaya', jumlah: sisaJumlah, total: sisaTotal });
      }

      // Nominal terbesar di atas
      kelompok.sort(function(a, b) { return b.total - a.total; });

      let grandTotal = 0;
      const baris = kelompok.map(function(k, urut) {
        grandTotal += k.total;
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + k.nama + '</td>' +
                 '<td>' + k.jumlah + ' kali</td>' +
                 '<td>' + formatRupiah(k.total) + '</td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-scroll">' +
               '<table class="tabel">' +
                 '<thead><tr>' +
                   '<th>No</th><th>Jenis Biaya</th><th>Jumlah Pembayaran</th><th>Total Nominal</th>' +
                 '</tr></thead>' +
                 '<tbody>' + baris + '</tbody>' +
               '</table>' +
             '</div>' +
             '<p class="tabel-total">Total: ' + formatRupiah(grandTotal) + '</p>';
    }

    // Modul Laporan Keuangan milik Bendahara, mengembalikan HTML siap tampil
    function bendaharaLaporan() {
      if (MODE_API) return '<div id="isi-lap-keuangan" data-muat="laporanKeuangan"></div>';
      return _htmlIsiLaporanKeuangan();
    }

    PEMUAT.laporanKeuangan = function() {
      return _muatModul('isi-lap-keuangan',
        [['getTransaksi'], ['getTagihan'], ['getSiswa'], ['getBiaya']],
        function(d) {
          _srvIsi({ transaksi: d[0], tagihan: d[1], siswa: d[2], biaya: d[3] });
          return _htmlIsiLaporanKeuangan();
        }, 'laporanKeuangan', 4);
    };

    function _htmlIsiLaporanKeuangan() {
      const ymd = function(d) {
        const dua = function(n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '-' + dua(d.getMonth() + 1) + '-' + dua(d.getDate());
      };

      // Nilai awal penyaring: sebulan terakhir sampai hari ini
      if (!laporanKeu.mulai || !laporanKeu.akhir) {
        const sebulanLalu = new Date();
        sebulanLalu.setMonth(sebulanLalu.getMonth() - 1);
        laporanKeu.mulai = ymd(sebulanLalu);
        laporanKeu.akhir = ymd(new Date());
      }

      const opsiJenis = [
        ['arus_kas', 'Arus Kas'],
        ['rekap_tagihan', 'Rekap Tagihan'],
        ['pemasukan_per_biaya', 'Pemasukan per Biaya']
      ].map(function(o) {
        return '<option value="' + o[0] + '"' + (laporanKeu.jenis === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('');

      const opsiStatus = [['', 'Semua'], ['approved', 'Approved'], ['pending', 'Pending']].map(function(o) {
        return '<option value="' + o[0] + '"' + (laporanKeu.status === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('');

      // Penyaring status hanya berlaku untuk laporan Arus Kas
      const statusMati = (laporanKeu.jenis !== 'arus_kas') ? ' disabled' : '';

      const filter =
        '<div class="card--filter">' +
          '<div class="filter-grid-4">' +
            '<div>' +
              '<label class="form-label" for="lapJenis">Jenis Laporan</label>' +
              '<select id="lapJenis" class="input" onchange="tampilkanLaporanKeuangan()">' + opsiJenis + '</select>' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="lapMulai">Tanggal Mulai</label>' +
              '<input type="date" id="lapMulai" class="input" value="' + laporanKeu.mulai + '">' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="lapAkhir">Tanggal Akhir</label>' +
              '<input type="date" id="lapAkhir" class="input" value="' + laporanKeu.akhir + '">' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="lapStatus">Status</label>' +
              '<select id="lapStatus" class="input"' + statusMati + '>' + opsiStatus + '</select>' +
            '</div>' +
          '</div>' +
          '<div class="filter-aksi">' +
            '<button class="btn" onclick="tampilkanLaporanKeuangan()"><i class="fa-solid fa-search"></i> Tampilkan</button>' +
            '<button class="btn btn--merah" ' +
              'onclick="alert(\'Fitur export PDF akan tersedia di versi production\')">' +
              '<i class="fa-solid fa-file-pdf"></i> Export PDF</button>' +
            '<button class="btn btn--hijau" ' +
              'onclick="alert(\'Fitur export Excel akan tersedia di versi production\')">' +
              '<i class="fa-solid fa-file-excel"></i> Export Excel</button>' +
          '</div>' +
        '</div>';

      const judul = '<h1 class="module-title">Laporan Keuangan</h1>' +
                    '<p class="module-sub">Rekap keuangan pesantren</p>';

      // Selama tombol Tampilkan belum ditekan, tidak ada data yang digambar
      if (!laporanKeuTampil) {
        return judul + filter +
          '<div class="card"><p class="pesan-info">Gunakan filter di atas untuk melihat laporan</p></div>';
      }

      let ringkasan, tabel;

      if (laporanKeu.jenis === 'rekap_tagihan') {
        // --- Rekap tagihan: disaring berdasarkan jatuh tempo ---
        const batasAwal = laporanKeu.mulai ? new Date(laporanKeu.mulai + 'T00:00:00') : null;
        const batasAkhir = laporanKeu.akhir ? new Date(laporanKeu.akhir + 'T23:59:59') : null;
        const kini = new Date();

        const tagihan = _srv('tagihan', 'sip_tagihan').filter(function(t) {
          if (!t || t.id === undefined || t.id === null) return false;
          if (!t.jatuh_tempo) return false;
          const jt = new Date(t.jatuh_tempo);
          if (isNaN(jt.getTime())) return false;
          if (batasAwal && jt < batasAwal) return false;
          if (batasAkhir && jt > batasAkhir) return false;
          return true;
        });
        tagihan.sort(function(a, b) { return new Date(b.jatuh_tempo) - new Date(a.jatuh_tempo); });

        let tTotal = 0, tLunas = 0, tBelum = 0, tMenunggak = 0;
        tagihan.forEach(function(t) {
          const n = Number(t.nominal) || 0;
          tTotal += n;
          if (String(t.status_bayar || '').toLowerCase() === 'lunas') {
            tLunas += n;
          } else {
            tBelum += n;
            const jt = new Date(t.jatuh_tempo);
            if (!isNaN(jt.getTime()) && jt < kini) tMenunggak += n;
          }
        });

        const kartu = [
          { angka: formatRupiah(tTotal),     label: 'Total Tagihan',     ikon: 'fa-file-invoice',        warna: 'biru',   ikonWarna: 'biru' },
          { angka: formatRupiah(tLunas),     label: 'Total Lunas',       ikon: 'fa-circle-check',        warna: 'hijau',  ikonWarna: 'hijau' },
          { angka: formatRupiah(tBelum),     label: 'Total Belum Lunas', ikon: 'fa-circle-exclamation',  warna: 'merah',  ikonWarna: 'merah' },
          { angka: formatRupiah(tMenunggak), label: 'Total Menunggak',   ikon: 'fa-triangle-exclamation',warna: 'oranye', ikonWarna: 'oranye' }
        ];
        ringkasan = '<div class="stat-grid">' + kartu.map(function(k, i) {
          return '<div class="stat-card stat-card--' + k.warna + '" style="animation-delay:' + ((i + 1) / 10) + 's">' +
                   '<i class="fa-solid ' + k.ikon + ' stat-icon stat-icon--' + k.ikonWarna + '"></i>' +
                   '<div class="stat-number stat-number--rupiah">' + k.angka + '</div>' +
                   '<div class="stat-label">' + k.label + '</div>' +
                 '</div>';
        }).join('') + '</div>';

        tabel = '<div class="card">' +
                  '<h2 class="section-title">Rekap Tagihan</h2>' + htmlTabelRekapTagihan(tagihan) +
                '</div>';

      } else {
        // --- Arus kas dan pemasukan per biaya memakai data transaksi ---
        const transaksi = filterLaporan(_srv('transaksi', 'sip_transaksi'));

        let masuk = 0, keluar = 0;
        transaksi.forEach(function(t) {
          if (String(t.status_approval || '') !== 'approved') return;
          const jumlah = Number(t.jumlah) || 0;
          const tipe = String(t.tipe || '').toLowerCase();
          if (tipe === 'pemasukan') masuk += jumlah;
          else if (tipe === 'pengeluaran') keluar += jumlah;
        });

        const kartu = [
          { angka: formatRupiah(masuk),          label: 'Total Pemasukan',  ikon: 'fa-arrow-down',  warna: 'hijau',  ikonWarna: 'hijau',  rupiah: true },
          { angka: formatRupiah(keluar),         label: 'Total Pengeluaran',ikon: 'fa-arrow-up',    warna: 'merah',  ikonWarna: 'merah',  rupiah: true },
          { angka: formatRupiah(masuk - keluar), label: 'Saldo Bersih',     ikon: 'fa-scale-balanced', warna: 'biru', ikonWarna: 'biru', rupiah: true },
          { angka: transaksi.length,             label: 'Total Transaksi',  ikon: 'fa-list',        warna: 'oranye', ikonWarna: 'oranye', rupiah: false }
        ];
        ringkasan = '<div class="stat-grid">' + kartu.map(function(k, i) {
          return '<div class="stat-card stat-card--' + k.warna + '" style="animation-delay:' + ((i + 1) / 10) + 's">' +
                   '<i class="fa-solid ' + k.ikon + ' stat-icon stat-icon--' + k.ikonWarna + '"></i>' +
                   '<div class="stat-number' + (k.rupiah ? ' stat-number--rupiah' : '') + '">' + k.angka + '</div>' +
                   '<div class="stat-label">' + k.label + '</div>' +
                 '</div>';
        }).join('') + '</div>';

        if (laporanKeu.jenis === 'pemasukan_per_biaya') {
          tabel = '<div class="card">' +
                    '<h2 class="section-title">Pemasukan per Jenis Biaya</h2>' +
                    htmlTabelPemasukanPerBiaya(transaksi) +
                  '</div>';
        } else {
          tabel = '<div class="card">' +
                    '<h2 class="section-title">Arus Kas</h2>' + htmlTabelArusKas(transaksi) +
                  '</div>';
        }
      }

      return judul + filter + ringkasan + tabel;
    }

    // Baca isian penyaring lalu gambar ulang laporan keuangan.
    // Namanya sengaja dibedakan dari tampilkanLaporan() milik modul
    // Laporan Kinerja (Kepala Sekolah) supaya tidak saling menimpa.
    function tampilkanLaporanKeuangan() {
      const j = document.getElementById('lapJenis');
      const m = document.getElementById('lapMulai');
      const a = document.getElementById('lapAkhir');
      const s = document.getElementById('lapStatus');
      if (!j || !m || !a || !s) {
        showNotif('Penyaring tidak ditemukan', 'error');
        return;
      }

      if (m.value && a.value && new Date(m.value) > new Date(a.value)) {
        showNotif('Tanggal mulai tidak boleh melewati tanggal akhir', 'error');
        return;
      }

      laporanKeu = { jenis: j.value, mulai: m.value, akhir: a.value, status: s.value };
      laporanKeuTampil = true;
      loadModule('Laporan Keuangan');
    }

    // ================= MODUL USULAN BIAYA (BENDAHARA) =================

    // Terjemahkan status usulan menjadi teks dan warna badge
    function statusUsulan(status) {
      const s = String(status || '');
      if (s === 'pending') return { teks: 'Menunggu Kepsek', kelas: 'pending' };
      if (s === 'approved') return { teks: 'Disetujui', kelas: 'aktif' };
      if (s === 'rejected') return { teks: 'Ditolak', kelas: 'merah' };
      return { teks: s || '-', kelas: 'nonaktif' };
    }

    // Modul Usulan Biaya milik Bendahara, mengembalikan HTML siap tampil
    function bendaharaUsulanBiaya() {
      if (MODE_API) return '<div id="isi-usulan-bendahara" data-muat="usulanBiayaBendahara"></div>';
      return _htmlIsiUsulanBiaya();
    }

    PEMUAT.usulanBiayaBendahara = function() {
      return _muatModul('isi-usulan-bendahara', [['getBiaya'], ['getUsulanBiaya']],
        function(d) {
          _srvIsi({ biaya: d[0], usulanBiaya: d[1] });
          return _htmlIsiUsulanBiaya();
        }, 'usulanBiayaBendahara', 4);
    };

    function _htmlIsiUsulanBiaya() {
      const sesi = getSession();

      // --- Bagian atas: daftar biaya yang masih aktif ---
      const biaya = _srv('biaya', 'sip_biaya').filter(function(b) {
        return b && b.id !== undefined && b.id !== null && b.status_aktif !== false;
      });

      let bagianBiaya;
      if (biaya.length === 0) {
        bagianBiaya =
          '<div class="card kosong-card">' +
            '<i class="fa-solid fa-money-bill-wave kosong-ikon"></i>' +
            '<span class="kosong-teks">Belum ada biaya terdaftar</span>' +
          '</div>';
      } else {
        const baris = biaya.map(function(b, urut) {
          const aktif = (b.status_aktif !== false);
          return '<tr>' +
                   '<td>' + (urut + 1) + '</td>' +
                   '<td>' + (b.nama_biaya || '-') + '</td>' +
                   '<td>' + formatRupiah(b.nominal_default) + '</td>' +
                   '<td><span class="badge badge--' + (aktif ? 'aktif' : 'nonaktif') + '">' +
                     (aktif ? 'Aktif' : 'Nonaktif') + '</span></td>' +
                   '<td><button class="btn-aksi btn-edit" onclick="tampilkanFormUsulan(' + b.id + ')">' +
                     '<i class="fa-solid fa-edit"></i>Usulkan Perubahan</button></td>' +
                 '</tr>';
        }).join('');

        bagianBiaya =
          '<div class="card">' +
            '<h2 class="section-title">Daftar Biaya Aktif</h2>' +
            '<div class="tabel-wrap">' +
              '<table class="tabel">' +
                '<thead><tr>' +
                  '<th>No</th><th>Nama Biaya</th><th>Nominal Saat Ini</th><th>Status</th><th>Aksi</th>' +
                '</tr></thead>' +
                '<tbody>' + baris + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>';
      }

      // --- Bagian tengah: formulir usulan, hanya saat ada biaya yang dipilih ---
      let bagianForm = '';
      if (usulanBiayaAktif !== null) {
        const b = biaya.find(function(x) { return String(x.id) === String(usulanBiayaAktif); });
        if (b) {
          bagianForm =
            '<div class="card card--usulan">' +
              '<h2 class="section-title">Usulan Perubahan: ' + (b.nama_biaya || '-') + '</h2>' +
              '<div class="usulan-info">' +
                '<div class="detail-item">' +
                  '<span class="detail-label">Nama Biaya</span>' +
                  '<span class="detail-nilai">' + (b.nama_biaya || '-') + '</span>' +
                '</div>' +
                '<div class="detail-item">' +
                  '<span class="detail-label">Nominal Saat Ini</span>' +
                  '<span class="detail-nilai">' + formatRupiah(b.nominal_default) + '</span>' +
                '</div>' +
              '</div>' +
              '<label class="form-label" for="usulanNominal">Nominal Baru</label>' +
              '<input type="number" id="usulanNominal" class="input" min="1" placeholder="contoh: 750000">' +
              '<label class="form-label" for="usulanAlasan">Alasan Perubahan</label>' +
              '<textarea id="usulanAlasan" class="input" rows="3" ' +
                'placeholder="contoh: Penyesuaian biaya operasional..."></textarea>' +
              '<span class="info-badge"><i class="fa-solid fa-circle-info"></i>' +
                'Usulan ini akan dikirim ke Kepala Sekolah untuk disetujui</span>' +
              '<div class="form-aksi">' +
                '<button class="btn" id="usulan-kirim" onclick="kirimUsulan()">' +
                  '<i class="fa-solid fa-paper-plane"></i> Kirim Usulan</button>' +
                '<button class="btn btn--abu" onclick="batalUsulan()">' +
                  '<i class="fa-solid fa-xmark"></i> Batal</button>' +
              '</div>' +
            '</div>';
        }
      }

      // --- Bagian bawah: riwayat usulan milik bendahara yang sedang masuk ---
      const riwayat = _srv('usulanBiaya', 'sip_usulan_biaya').filter(function(u) {
        return u && u.id !== undefined && sesi && String(u.id_pengaju) === String(sesi.id);
      });

      const pakaiTanggal = riwayat.length > 0 && riwayat.every(function(u) {
        return u.tgl && !isNaN(new Date(u.tgl).getTime());
      });
      riwayat.sort(function(a, b) {
        if (pakaiTanggal) {
          const selisih = new Date(b.tgl) - new Date(a.tgl);
          if (selisih !== 0) return selisih;
        }
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      let isiRiwayat;
      if (riwayat.length === 0) {
        isiRiwayat = '<p class="pesan-info">Belum ada usulan perubahan biaya</p>';
      } else {
        const barisRiwayat = riwayat.map(function(u, urut) {
          const st = statusUsulan(u.status);
          const alasan = String(u.alasan || '-');
          return '<tr class="baris-klik" onclick="lihatDetailUsulan(' + u.id + ')">' +
                   '<td>' + (urut + 1) + '</td>' +
                   '<td>' + formatTanggal(u.tgl) + '</td>' +
                   '<td>' + (u.nama_biaya || '-') + '</td>' +
                   '<td>' + formatRupiah(u.nominal_lama) + '</td>' +
                   '<td>' + formatRupiah(u.nominal_usulan) + '</td>' +
                   '<td>' + (alasan.length > 50 ? alasan.slice(0, 50) + '...' : alasan) + '</td>' +
                   '<td><span class="badge badge--' + st.kelas + '">' + st.teks + '</span></td>' +
                 '</tr>';
        }).join('');

        isiRiwayat =
          '<div class="tabel-wrap">' +
            '<table class="tabel tabel--lebar">' +
              '<thead><tr>' +
                '<th>No</th><th>Tanggal Usulan</th><th>Nama Biaya</th><th>Nominal Lama</th>' +

    function tampilkanFormUsulan(idBiaya) {

      usulanBiayaAktif = null;

    // Kirim satu usulan perubahan nominal biaya
    async function kirimUsulan() {
      const sesi = getSession();
      const elNominal = document.getElementById('usulanNominal');
      const elAlasan = document.getElementById('usulanAlasan');
      if (!elNominal || !elAlasan) {
        showNotif('Formulir tidak ditemukan', 'error');
        return;
      }

      const nominal = Number(elNominal.value);
      if (!nominal || nominal <= 0) {
        showNotif('Nominal baru harus lebih dari 0', 'error');
        return;
      }

      const alasan = elAlasan.value.trim();
      if (!alasan) {
        showNotif('Alasan perubahan tidak boleh kosong', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('usulan-kirim', 'usulanBiaya',
          { idBiaya: usulanBiayaAktif, nominalBaru: nominal }, 'usulanBiayaBendahara', 'Mengirim');
        return;
      }

      const b = _srv('biaya', 'sip_biaya').find(function(x) {
        return x && String(x.id) === String(usulanBiayaAktif);
      });
      if (!b) {
        showNotif('Biaya tidak ditemukan', 'error');
        return;
      }

      const daftar = _bacaArr('sip_usulan_biaya');

      // Id berbasis Date.now(), dinaikkan bila angkanya sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(u) { return u && Number(u.id) === idBaru; })) {
        idBaru++;
      }

      daftar.push({
        id: idBaru,
        id_biaya: b.id,
        nama_biaya: b.nama_biaya || '-',
        nominal_lama: Number(b.nominal_default) || 0,
        nominal_usulan: nominal,
        alasan: alasan,
        id_pengaju: sesi ? sesi.id : null,
        nama_pengaju: sesi ? sesi.nama : '-',
        status: 'pending',
        approved_by: '',
        tgl: new Date()
      });
      localStorage.setItem('sip_usulan_biaya', JSON.stringify(daftar));

      // Nominal di sip_biaya sengaja TIDAK diubah di sini.
      // Perubahannya baru berlaku setelah Kepala Sekolah menyetujui.

      // Catat jejak aksi
      const log = _bacaArr('sip_log');
      log.push({
        aksi: 'usulan_biaya',
        usulanId: idBaru,
        idBiaya: b.id,
        nominalLama: Number(b.nominal_default) || 0,
        nominalUsulan: nominal,
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      usulanBiayaAktif = null;
      loadModule('Usulan Biaya');
      showNotif('Usulan perubahan "' + (b.nama_biaya || '-') +
                '" terkirim. Menunggu persetujuan Kepala Sekolah.', 'success');
    }

    // Popup rincian satu usulan perubahan biaya
    function lihatDetailUsulan(id) {
      const u = _bacaArr('sip_usulan_biaya').find(function(x) {
        return x && String(x.id) === String(id);
      });
      if (!u) {
        showNotif('Usulan tidak ditemukan', 'error');
        return;
      }

      const users = _bacaArr('sip_users');
      const st = statusUsulan(u.status);
      const lama = Number(u.nominal_lama) || 0;
      const usul = Number(u.nominal_usulan) || 0;
      const selisih = usul - lama;

      // Naik ditandai hijau, turun ditandai merah
      const teksSelisih = '<span class="' + (selisih >= 0 ? 'selisih-naik' : 'selisih-turun') + '">' +
                          (selisih >= 0 ? '+ ' : '- ') + formatRupiah(Math.abs(selisih)) + '</span>';

      // Nama penyetuju dicari dari akun pengguna bila id-nya tersimpan
      let disetujuiOleh = '-';
      if (u.approved_by !== undefined && u.approved_by !== null && String(u.approved_by).trim() !== '') {
        const w = users.find(function(x) { return x && String(x.id) === String(u.approved_by); });
        disetujuiOleh = w ? (w.nama || String(u.approved_by)) : String(u.approved_by);
      }

      const item = function(label, nilai, penuh) {
        return '<div class="detail-item' + (penuh ? ' detail-item--full' : '') + '">' +
                 '<span class="detail-label">' + label + '</span>' +
                 '<span class="detail-nilai">' + nilai + '</span>' +
               '</div>';
      };

      // Popup lama dibuang dulu agar tidak menumpuk
      tutupDetailUsulan();

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.setAttribute('onclick', 'if(event.target===this)tutupDetailUsulan()');
      overlay.innerHTML =
        '<div class="modal">' +
          '<div class="modal-head">' +
            '<span class="modal-judul">Detail Usulan Perubahan Biaya</span>' +
            '<button class="modal-tutup" title="Tutup" onclick="tutupDetailUsulan()">' +
              '<i class="fa-solid fa-xmark"></i></button>' +
          '</div>' +
          '<div class="detail-section"><h4>Rincian Usulan</h4><div class="detail-grid">' +
            item('Nama Biaya', u.nama_biaya || '-') +
            item('Tanggal Usulan', formatTanggal(u.tgl)) +
            item('Nominal Lama', formatRupiah(lama)) +
            item('Nominal Usulan', formatRupiah(usul)) +
            item('Selisih', teksSelisih) +
            item('Status', '<span class="badge badge--' + st.kelas + '">' + st.teks + '</span>') +
            item('Disetujui Oleh', disetujuiOleh) +
            item('Diajukan Oleh', u.nama_pengaju || '-') +
            item('Alasan', u.alasan || '-', true) +
          '</div></div>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    function tutupDetailUsulan() {
      const p = document.querySelector('.modal-overlay');
      if (p) p.remove();
    }

    // ================= MODUL PENGUMUMAN GLOBAL (KTU) =================

    // Sebutan dan warna badge untuk sasaran penerima pengumuman
    function labelTarget(target) {
      const t = String(target || '');
      if (t === 'semua') return { teks: 'Semua Role', kelas: 'target-semua' };
      if (t === 'guru') return { teks: 'Guru Saja', kelas: 'target-guru' };
      if (t === 'walimurid') return { teks: 'Wali Murid Saja', kelas: 'target-walimurid' };
      if (t === 'kecuali_walimurid') return { teks: 'Semua Kecuali Wali Murid', kelas: 'target-kecuali' };
      return { teks: t || '-', kelas: 'nonaktif' };
    }

    // Tanggal beserta jam, contoh 31/07/2026 08:30
    function _tglJam(nilai) {
      if (!nilai) return '-';
      const t = new Date(nilai);
      if (isNaN(t.getTime())) return '-';
      const dua = function(n) { return String(n).padStart(2, '0'); };
      return formatTanggal(t) + ' ' + dua(t.getHours()) + ':' + dua(t.getMinutes());
    }

    // Ambil pengumuman global milik KTU yang sedang masuk, sesuai status
    function _pengumumanGlobalKtu(status) {
      const sesi = getSession();
      const hasil = _srv('pengumuman', 'sip_pengumuman').filter(function(p) {
        return p && p.tipe === 'global' && p.status === status &&
               sesi && String(p.dari_id_user) === String(sesi.id);
      });
      hasil.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });
      return hasil;
    }

    // Simpan satu pengumuman global baru berstatus menunggu Kepala Sekolah
    async function kirimPengumumanGlobal() {
      const sesi = getSession();
      const elJudul = document.getElementById('globalJudul');
      const elKonten = document.getElementById('globalKonten');
      const elTarget = document.getElementById('globalTarget');
      if (!elJudul || !elKonten || !elTarget) {
        showNotif('Formulir tidak ditemukan', 'error');
        return;
      }

      const judul = elJudul.value.trim();
      if (!judul) {
        showNotif('Judul pengumuman tidak boleh kosong', 'error');
        return;
      }

      const konten = elKonten.value.trim();
      if (!konten) {
        showNotif('Isi pengumuman tidak boleh kosong', 'error');
        return;
      }

      if (!elTarget.value) {
        showNotif('Target penerima harus dipilih', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('peng-global-kirim', 'createPengumuman',
          { data: { tipe: 'global', judul: judul, konten: konten, target: elTarget.value } },
          'pengumumanGlobal', 'Mengirim');
        return;
      }

      const daftar = _bacaArr('sip_pengumuman');

      // Id berbasis Date.now(), dinaikkan bila angkanya sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(p) { return p && Number(p.id) === idBaru; })) {
        idBaru++;
      }

      daftar.push({
        id: idBaru,
        dari_id_user: sesi ? sesi.id : null,
        dari_nama: sesi ? sesi.nama : '-',
        dari_role: 'ktu',
        tipe: 'global',
        judul: judul,
        konten: konten,
        target: elTarget.value,
        id_penerima_siswa: '',
        status: 'pending',
        tgl: new Date(),
        approved_by: ''
      });
      localStorage.setItem('sip_pengumuman', JSON.stringify(daftar));

      // Catat jejak aksi
      const log = _bacaArr('sip_log');
      log.push({
        aksi: 'buat_pengumuman_global',
        pengumumanId: idBaru,
        judul: judul,
        target: elTarget.value,
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      // Modul digambar ulang, jadi formulir otomatis kosong kembali
      loadModule('Pengumuman Global');
      showNotif('Pengumuman berhasil dibuat. Menunggu persetujuan Kepala Sekolah.', 'success');
    }

    // Batalkan pengumuman yang belum diproses Kepala Sekolah
    function batalPengumumanGlobal(id) {
      if (!confirm('Batalkan pengumuman ini?')) return;

      const sesi = getSession();
      const daftar = _bacaArr('sip_pengumuman');
      const i = daftar.findIndex(function(p) { return p && String(p.id) === String(id); });
      if (i === -1) {
        showNotif('Pengumuman tidak ditemukan', 'error');
        return;
      }

      // Datanya tidak dihapus, hanya ditandai dibatalkan agar jejaknya tetap ada
      daftar[i].status = 'dibatalkan';
      daftar[i].tgl_approve = new Date();
      localStorage.setItem('sip_pengumuman', JSON.stringify(daftar));

      // Catat jejak aksi
      const log = _bacaArr('sip_log');
      log.push({
        aksi: 'batal_pengumuman_global',
        pengumumanId: id,
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      loadModule('Pengumuman Global');
      showNotif('Pengumuman dibatalkan', 'success');
    }

    // ================= MODUL PENDAFTARAN AKUN (KTU) =================

    // Periksa bentuk alamat surel
    function validasiEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
    }

    // Ambil akun yang didaftarkan oleh KTU yang sedang masuk
    function _akunBuatanKtu() {
      const sesi = getSession();
      const hasil = _srv('users', 'sip_users').filter(function(u) {
        return u && u.id !== undefined && sesi &&
               String(u.dibuat_oleh || '') === String(sesi.nama);
      });
      hasil.sort(function(a, b) {
        const selisih = new Date(b.tgl_dibuat) - new Date(a.tgl_dibuat);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });
      return hasil;
    }

    // Badge subrole untuk akun guru
    function _badgeSubrole(u) {
      if (String(u.role || '').toLowerCase() !== 'guru') return '-';
      const sub = String(u.subrole || '').toLowerCase();
      if (sub === 'walikelas') return '<span class="badge badge--walikelas">Wali Kelas</span>';
      if (sub === 'mapel') return '<span class="badge badge--mapel">Mapel</span>';
      return '-';
    }

    // Tabel akun yang masih menunggu persetujuan Kepala Sekolah
    function htmlAkunPending() {
      const daftar = _akunBuatanKtu().filter(function(u) { return u.aktif === false; });

      if (daftar.length === 0) {
        return '<p class="pesan-info">Tidak ada akun menunggu persetujuan</p>';
      }

      const baris = daftar.map(function(u, urut) {
        const r = String(u.role || '').toLowerCase();
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (u.nama || '-') + '</td>' +
                 '<td class="sel-copy">' + (u.email || '-') + '</td>' +
                 '<td><span class="badge badge--' + r + '">' + labelRole(u.role, u.subrole) + '</span></td>' +
                 '<td>' + _badgeSubrole(u) + '</td>' +
                 '<td>' + _tglJam(u.tgl_dibuat) + '</td>' +
                 '<td><span class="badge badge--pending">Menunggu Kepsek</span></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap">' +
               '<table class="tabel tabel--lebar">' +
                 '<thead><tr>' +
                   '<th>No</th><th>Nama</th><th>Email</th><th>Role</th>' +
                   '<th>Subrole</th><th>Tanggal Daftar</th><th>Status</th>' +
                 '</tr></thead>' +
                 '<tbody>' + baris + '</tbody>' +
               '</table>' +
             '</div>';
    }

    // Tabel riwayat pendaftaran, mengikuti penyaring status
    function htmlRiwayatPendaftaran(filter) {
      let daftar = _akunBuatanKtu();

      // "ditolak" tidak akan pernah cocok karena Modul 4.2 menghapus
      // akun yang ditolak dari sip_users, bukan menandainya
      if (filter === 'aktif') {
        daftar = daftar.filter(function(u) { return u.aktif !== false; });
      } else if (filter === 'nonaktif') {
        daftar = daftar.filter(function(u) { return u.aktif === false; });
      } else if (filter === 'ditolak') {
        daftar = daftar.filter(function(u) { return String(u.status_akun || '') === 'ditolak'; });
      }

      // Tanpa penyaring, hanya sepuluh terbaru yang ditampilkan
      if (!filter) daftar = daftar.slice(0, 10);

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada riwayat pendaftaran</p>';
      }

      const baris = daftar.map(function(u, urut) {
        const r = String(u.role || '').toLowerCase();
        const ditolak = String(u.status_akun || '') === 'ditolak';
        const aktif = (u.aktif !== false);
        const st = ditolak
          ? { teks: 'Ditolak', kelas: 'merah' }
          : (aktif ? { teks: 'Aktif', kelas: 'aktif' } : { teks: 'Nonaktif', kelas: 'pending' });

        const penyetuju = (u.disetujui_oleh && String(u.disetujui_oleh).trim() !== '')
          ? u.disetujui_oleh : '-';

        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (u.nama || '-') + '</td>' +
                 '<td class="sel-copy">' + (u.email || '-') + '</td>' +
                 '<td><span class="badge badge--' + r + '">' + labelRole(u.role, u.subrole) + '</span></td>' +
                 '<td>' + _tglJam(u.tgl_dibuat) + '</td>' +
                 '<td><span class="badge badge--' + st.kelas + '">' + st.teks + '</span></td>' +
                 '<td>' + penyetuju + '</td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap">' +
               '<table class="tabel tabel--lebar">' +
                 '<thead><tr>' +
                   '<th>No</th><th>Nama</th><th>Email</th><th>Role</th>' +
                   '<th>Tanggal Daftar</th><th>Status</th><th>Disetujui Oleh</th>' +
                 '</tr></thead>' +
                 '<tbody>' + baris + '</tbody>' +
               '</table>' +
             '</div>';
    }

    // Simpan satu akun baru berstatus nonaktif
    async function daftarkanAkun() {
      const sesi = getSession();
      const elNama = document.getElementById('akunNama');
      const elEmail = document.getElementById('akunEmail');
      const elPin = document.getElementById('akunPin');
      const elRole = document.getElementById('akunRole');
      if (!elNama || !elEmail || !elPin || !elRole) {
        showNotif('Formulir tidak ditemukan', 'error');
        return;
      }

      const nama = elNama.value.trim();
      if (!nama) {
        showNotif('Nama lengkap tidak boleh kosong', 'error');
        return;
      }

      const email = elEmail.value.trim();
      if (!email) {
        showNotif('Email tidak boleh kosong', 'error');
        return;
      }
      if (!validasiEmail(email)) {
        showNotif('Format email tidak valid', 'error');
        return;
      }

      const pin = elPin.value.trim();
      if (!/^\d{6}$/.test(pin)) {
        showNotif('PIN harus 6 digit angka', 'error');
        return;
      }

      if (!elRole.value) {
        showNotif('Role harus dipilih', 'error');
        return;
      }

      if (MODE_API) {
        // Nilai option berbentuk "role|subrole"
        const bagian = String(elRole.value).split('|');
        await _kirimAksi('akun-daftar', 'createAccount',
          { nama: nama, email: email, pin: pin, role: bagian[0], subrole: bagian[1] || '' },
          'pendaftaranAkun', 'Mendaftarkan');
        return;
      }

      const users = _srv('users', 'sip_users');

      // Email tidak boleh dipakai dua kali
      const kembar = users.some(function(u) {
        return u && String(u.email || '').trim().toLowerCase() === email.toLowerCase();
      });
      if (kembar) {
        showNotif('Email sudah terdaftar', 'error');
        return;
      }

      const bagian = String(elRole.value).split('|');
      const role = bagian[0];
      const subrole = bagian[1] || '';

      // Id berbasis Date.now(), dinaikkan bila angkanya sudah terpakai
      let idBaru = Date.now();
      while (users.some(function(u) { return u && Number(u.id) === idBaru; })) {
        idBaru++;
      }

      users.push({
        id: idBaru,
        nama: nama,
        email: email,
        pin: pin,
        role: role,
        subrole: subrole,
        aktif: false,
        dibuat_oleh: sesi ? sesi.nama : '-',
        tgl_dibuat: new Date(),
        disetujui_oleh: '',
        tgl_disetujui: null,
        token: '',
        token_expired: ''
      });
      localStorage.setItem('sip_users', JSON.stringify(users));

      // Catat jejak aksi
      const log = _bacaArr('sip_log');
      log.push({
        aksi: 'daftar_akun',
        userId: idBaru,
        nama: nama,
        role: role,
        subrole: subrole,
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      // Modul digambar ulang, jadi formulir otomatis kosong kembali
      loadModule('Pendaftaran Akun');
      showNotif('Akun ' + nama + ' berhasil didaftarkan. Menunggu persetujuan Kepala Sekolah.', 'success');
    }

    // ================= MODUL DATA MASTER (KTU) =================

    // Cari nama pada daftar acuan berdasarkan id. Bila tidak ketemu, hasilnya "-".
    function _namaDari(daftar, id, kolom) {
      if (id === undefined || id === null || id === '') return '-';
      const x = daftar.find(function(d) { return d && String(d.id) === String(id); });
      return x ? (x[kolom] || '-') : '-';
    }

    // Susun dropdown pilihan dengan satu nilai yang sedang terpilih
    function _opsi(daftar, terpilih, kolom, teksKosong) {
      let html = '<option value="">' + teksKosong + '</option>';
      daftar.forEach(function(d) {
        const dipilih = (String(terpilih) === String(d.id)) ? ' selected' : '';
        html += '<option value="' + d.id + '"' + dipilih + '>' + (d[kolom] || '-') + '</option>';
      });
      return html;
    }

        return u && u.id !== undefined && String(u.role || '').toLowerCase() === 'walimurid';
      });
      if (daftar.length === 0) return '<p class="pesan-info">Belum ada data wali murid</p>';

      const siswa = _srv('siswa', 'sip_siswa');

      const baris = daftar.map(function(u, urut) {
        const anak = siswa.filter(function(s) {
          return s && String(s.id_wali_murid) === String(u.id);
        });

        // Nomor HP tidak tersimpan pada akun, jadi diambil dari data anaknya
        let noHp = '-';
        for (let i = 0; i < anak.length; i++) {
          if (anak[i].no_hp_orangtua && String(anak[i].no_hp_orangtua).trim() !== '') {
            noHp = anak[i].no_hp_orangtua;
            break;
          }
        }

        const aktif = (u.aktif !== false);
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (u.nama || '-') + '</td>' +
                 '<td class="sel-copy">' + (u.email || '-') + '</td>' +
                 '<td>' + noHp + '</td>' +
                 '<td>' + anak.length + ' anak</td>' +
                 '<td><span class="badge badge--' + (aktif ? 'aktif' : 'merah') + '">' +
                   (aktif ? 'Aktif' : 'Nonaktif') + '</span></td>' +
                 '<td>' + _tombolStatus(u) + '</td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel tabel--lebar">' +
               '<thead><tr><th>No</th><th>Nama</th><th>Email</th><th>No HP</th>' +
               '<th>Jumlah Anak</th><th>Status</th><th>Aksi</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    // --- TAB 5: KELAS ---
    function htmlTabKelas() {
      const kelas = _srv('kelas', 'sip_kelas').filter(function(k) { return k && k.id !== undefined; });
      const siswa = _srv('siswa', 'sip_siswa');

      const form =
        '<div class="form-grid-2">' +
          '<div>' +
            '<label class="form-label" for="kelasNama">Nama Kelas</label>' +
            '<input type="text" id="kelasNama" class="input" placeholder="contoh: 1A">' +
          '</div>' +
          '<div>' +
            '<label class="form-label" for="kelasTingkat">Tingkat</label>' +
            '<input type="number" id="kelasTingkat" class="input" min="1" placeholder="1">' +
          '</div>' +
        '</div>' +
        '<button class="btn btn--full" id="dm-tambah-kelas" onclick="tambahKelas()">' +
          '<i class="fa-solid fa-plus"></i> Tambah Kelas</button>';

      if (kelas.length === 0) {
        return form + '<p class="pesan-info">Belum ada data kelas</p>';
      }

      // Tingkat lebih kecil di atas, lalu urut nama
      kelas.sort(function(a, b) {
        const ta = Number(a.tingkat) || 0, tb = Number(b.tingkat) || 0;
        if (ta !== tb) return ta - tb;
        return String(a.nama || '').localeCompare(String(b.nama || ''));
      });

      const baris = kelas.map(function(k, urut) {
        const jumlah = siswa.filter(function(s) {
          return s && String(s.id_kelas) === String(k.id);
        }).length;
        const sedangDiedit = (String(kelasSedangDiedit) === String(k.id));

        if (sedangDiedit) {
          return '<tr>' +
                   '<td>' + (urut + 1) + '</td>' +
                   '<td><input type="text" class="input-inline" id="editKelasNama-' + k.id + '" value="' + (k.nama || '') + '"></td>' +
                   '<td><input type="number" class="input-inline" id="editKelasTingkat-' + k.id + '" min="1" value="' + (Number(k.tingkat) || '') + '"></td>' +
                   '<td>' + jumlah + ' siswa</td>' +
                   '<td><div class="aksi-grup">' +
                     '<button class="btn-aksi btn-setujui" id="dm-simpan-kelas-' + k.id + '" onclick="simpanEditKelas(' + k.id + ')">' +
                       '<i class="fa-solid fa-check"></i>Simpan</button>' +
                     '<button class="btn-aksi btn-abu" onclick="kelasSedangDiedit=null;_gambarUlangDataMaster()">' +
                       '<i class="fa-solid fa-xmark"></i>Batal</button>' +
                   '</div></td>' +
                 '</tr>';
        }

        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (k.nama || '-') + '</td>' +
                 '<td>' + (k.tingkat !== undefined && k.tingkat !== null && k.tingkat !== '' ? k.tingkat : '-') + '</td>' +
                 '<td>' + jumlah + ' siswa</td>' +
                 '<td><div class="aksi-grup">' +
                   '<button class="btn-aksi btn-edit" onclick="kelasSedangDiedit=' + k.id + ';_gambarUlangDataMaster()">' +
                     '<i class="fa-solid fa-pen"></i>Edit</button>' +
                   '<button class="btn-aksi btn-hapus" id="dm-hapus-kelas-' + k.id + '" onclick="hapusKelas(' + k.id + ')">' +
                     '<i class="fa-solid fa-trash"></i>Hapus</button>' +
                 '</div></td>' +
               '</tr>';
      }).join('');

      return form +
             '<div class="tabel-wrap"><table class="tabel">' +
               '<thead><tr><th>No</th><th>Nama Kelas</th><th>Tingkat</th>' +
               '<th>Jumlah Siswa</th><th>Aksi</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    // Modul Data Master milik KTU, mengembalikan HTML siap tampil
    function ktuDataMaster() {
      const daftarTab = [
        { nilai: 'guru',      teks: 'Guru',           ikon: 'fa-chalkboard-teacher' },
        { nilai: 'bendahara', teks: 'Bendahara',      ikon: 'fa-money-bill-wave' },
        { nilai: 'siswa',     teks: 'Siswa',          ikon: 'fa-user-graduate' },
        { nilai: 'walimurid', teks: 'Wali Murid',     ikon: 'fa-user-friends' },
        { nilai: 'kelas',     teks: 'Kelas',          ikon: 'fa-door-open' },
        { nilai: 'mapel',     teks: 'Mata Pelajaran', ikon: 'fa-book' }
      ];

      const tab = daftarTab.map(function(t) {
        const aktif = (t.nilai === tabDataMaster) ? ' active' : '';
        // Berpindah tab membatalkan penyuntingan yang sedang berjalan.
        // Lewat gantiTabDataMaster() supaya isinya digambar ulang dari data
        // yang sudah ada, tanpa menjemput ulang ke server tiap ganti tab.
        return '<button class="tab-btn' + aktif + '" ' +
               'onclick="gantiTabDataMaster(\'' + t.nilai + '\')">' +
               '<i class="fa-solid ' + t.ikon + '"></i>' + t.teks + '</button>';
      }).join('');

      const kepala = '<h1 class="module-title">Data Master</h1>' +
                     '<p class="module-sub">Kelola data guru, bendahara, siswa, wali murid, kelas, dan mata pelajaran</p>' +
                     '<div class="tab-bar tab-bar--scroll">' + tab + '</div>';

      // Isi tabelnya dijemput dari server, jadi di sini cukup wadah kosongnya
      if (MODE_API) return kepala + '<div id="isi-data-master" data-muat="dataMaster"></div>';

      return kepala + _htmlIsiDataMaster();
    }

    // Susun kartu isi sesuai tab yang sedang dibuka. Dipakai jalur server
    // maupun jalur localStorage supaya tampilan keduanya tidak pernah beda.
    function _htmlIsiDataMaster() {
      let isi, judulIsi;
      if (tabDataMaster === 'bendahara')      { isi = htmlTabBendahara();  judulIsi = 'Data Bendahara'; }
      else if (tabDataMaster === 'siswa')     { isi = htmlTabSiswa();      judulIsi = 'Data Siswa'; }
      else if (tabDataMaster === 'walimurid') { isi = htmlTabWaliMurid();  judulIsi = 'Data Wali Murid'; }
      else if (tabDataMaster === 'kelas')     { isi = htmlTabKelas();      judulIsi = 'Data Kelas'; }
      else if (tabDataMaster === 'mapel')     { isi = htmlTabMapel();      judulIsi = 'Data Mata Pelajaran'; }
      else                                    { isi = htmlTabGuru();       judulIsi = 'Data Guru'; }

      return '<div class="card"><h2 class="section-title">' + judulIsi + '</h2>' + isi + '</div>';
    }

    // Satu panggilan membawa users, siswa, kelas, dan mapel sekaligus.
    PEMUAT.dataMaster = function() {
      return _muatModul('isi-data-master', [['getDataMaster']], function(d) {
        _srvIsi(d[0]);
        return _htmlIsiDataMaster();
      }, 'dataMaster', 5);
    };

    // Gambar ulang isi Data Master dari data yang sudah ada di tangan.
    // Dipakai tombol Edit dan Batal yang hanya mengubah tampilan, bukan data,
    // supaya tidak memanggil server untuk sesuatu yang tidak berubah.
    function _gambarUlangDataMaster() {
      const wadah = document.getElementById('isi-data-master');
      if (!wadah || !SRV.users) { loadModule('Data Master'); return; }
      wadah.innerHTML = _htmlIsiDataMaster();
    }

    // Pindah tab tanpa menjemput ulang. Data master sudah ada di SRV,
    // jadi menunggu server lagi hanya membuat perpindahan terasa berat.
    function gantiTabDataMaster(nilai) {
      tabDataMaster = nilai;
      kelasSedangDiedit = null;
      mapelSedangDiedit = null;

      const wadah = document.getElementById('isi-data-master');
      if (!wadah || !SRV.users) { loadModule('Data Master'); return; }

      wadah.innerHTML = _htmlIsiDataMaster();

      // Tombol tab yang aktif ikut berpindah
      document.querySelectorAll('.tab-bar .tab-btn').forEach(function(b) {
        const klik = b.getAttribute('onclick') || '';
        b.classList.toggle('active', klik.indexOf('gantiTabDataMaster(\'' + nilai + '\')') !== -1);
      });
    }

    // Ubah satu nilai pada satu pengguna lalu simpan
    function _ubahUser(userId, ubah, pesan) {
      const users = _bacaArr('sip_users');
      const i = users.findIndex(function(u) { return u && String(u.id) === String(userId); });
      if (i === -1) {
        showNotif('Pengguna tidak ditemukan', 'error');
        return false;
      }
      ubah(users[i]);
      localStorage.setItem('sip_users', JSON.stringify(users));

      const sesi = getSession();
      const log = _bacaArr('sip_log');
      log.push({ aksi: 'data_master', userId: userId, catatan: pesan,
                 oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));
      return true;
    }

    // Kunci sementara seluruh pilihan pada satu baris, supaya pengguna tidak
    // menekan dua penugasan sekaligus selagi yang pertama masih dikirim.
    function _kunciBaris(el, kunci) {
      const baris = el && el.closest ? el.closest('tr') : null;
      if (!baris) return;
      baris.querySelectorAll('select, button').forEach(function(x) { x.disabled = kunci; });
    }

    // Tetapkan kelas yang diampu seorang wali kelas
    async function assignKelasWali(userId, idKelas, el) {
      if (MODE_API) {
        _kunciBaris(el, true);
        // idKelas dikirim apa adanya. String kosong berarti dikosongkan.
        const ok = await _kirimAksi(null, 'updateUser',
          { userId: userId, data: { id_kelas_wali: idKelas || '' } }, 'dataMaster', 'Menyimpan');
        if (!ok) _kunciBaris(el, false);
        return;

      const nama = _namaDari(_bacaArr('sip_kelas'), idKelas, 'nama');
      if (_ubahUser(userId, function(u) { u.id_kelas_wali = idKelas || null; }, 'assign kelas wali')) {
        loadModule('Data Master');
        showNotif(idKelas ? 'Kelas wali diatur ke ' + nama : 'Kelas wali dikosongkan', 'success');
      }

    // Nyalakan atau matikan status aktif satu pengguna. Data tidak pernah dihapus.
    async function toggleStatusUser(userId) {
      // Status sekarang dibaca dari sumber yang sedang tampil, bukan selalu
      // localStorage, supaya konfirmasinya cocok dengan yang dilihat pengguna.
      const u = _srv('users', 'sip_users').find(function(x) { return x && String(x.id) === String(userId); });
      if (!u) {
        showNotif('Pengguna tidak ditemukan', 'error');
        return;
      }
      const sedangAktif = (u.aktif !== false);
      if (sedangAktif && !confirm('Nonaktifkan akun ' + (u.nama || '') + '?')) return;

      if (MODE_API) {
        await _kirimAksi('dm-status-' + userId, 'updateUser',
          { userId: userId, data: { aktif: !sedangAktif } }, 'dataMaster',
          sedangAktif ? 'Menonaktifkan' : 'Mengaktifkan');
        return;
      }

      if (_ubahUser(userId, function(x) { x.aktif = !sedangAktif; }, 'ubah status aktif')) {
        loadModule('Data Master');
        showNotif((u.nama || 'Akun') + (sedangAktif ? ' dinonaktifkan' : ' diaktifkan kembali'), 'success');
      }
    }

    // Tambah satu kelas baru
    async function tambahKelas() {
      const elNama = document.getElementById('kelasNama');
      const elTingkat = document.getElementById('kelasTingkat');
      if (!elNama || !elTingkat) return;

      const nama = elNama.value.trim();
      if (!nama) {
        showNotif('Nama kelas tidak boleh kosong', 'error');
        return;
      }
      const tingkat = Number(elTingkat.value);
      if (!tingkat || tingkat <= 0) {
        showNotif('Tingkat harus diisi angka lebih dari 0', 'error');
        return;
      }

      if (MODE_API) {
        // Kembaran nama diperiksa juga di server, jadi di sini cukup dikirim
        await _kirimAksi('dm-tambah-kelas', 'crudKelas',
          { aksiKelas: 'create', data: { nama: nama, tingkat: tingkat } }, 'dataMaster', 'Menambah');
        return;
      }

      const kelas = _bacaArr('sip_kelas');
      if (kelas.some(function(k) {
        return k && String(k.nama || '').trim().toLowerCase() === nama.toLowerCase();
      })) {
        showNotif('Nama kelas sudah ada', 'error');
        return;
      }

      let idBaru = Date.now();
      while (kelas.some(function(k) { return k && Number(k.id) === idBaru; })) idBaru++;

      kelas.push({ id: idBaru, nama: nama, tingkat: tingkat });
      localStorage.setItem('sip_kelas', JSON.stringify(kelas));

      kelasSedangDiedit = null;
      loadModule('Data Master');
      showNotif('Kelas ' + nama + ' berhasil ditambahkan', 'success');
    }

    // Simpan hasil penyuntingan satu kelas
    async function simpanEditKelas(id) {
      const elNama = document.getElementById('editKelasNama-' + id);
      const elTingkat = document.getElementById('editKelasTingkat-' + id);
      if (!elNama || !elTingkat) return;

      const nama = elNama.value.trim();
      if (!nama) {
        showNotif('Nama kelas tidak boleh kosong', 'error');
        return;
      }
      const tingkat = Number(elTingkat.value);
      if (!tingkat || tingkat <= 0) {
        showNotif('Tingkat harus diisi angka lebih dari 0', 'error');
        return;
      }

      if (MODE_API) {
        kelasSedangDiedit = null;
        await _kirimAksi('dm-simpan-kelas-' + id, 'crudKelas',
          { aksiKelas: 'update', data: { id: id, nama: nama, tingkat: tingkat } }, 'dataMaster', 'Menyimpan');
        return;
      }

      const kelas = _bacaArr('sip_kelas');
      const i = kelas.findIndex(function(k) { return k && String(k.id) === String(id); });
      if (i === -1) {
        showNotif('Kelas tidak ditemukan', 'error');
        return;
      }
      kelas[i].nama = nama;
      kelas[i].tingkat = tingkat;
      localStorage.setItem('sip_kelas', JSON.stringify(kelas));

      kelasSedangDiedit = null;
      loadModule('Data Master');
      showNotif('Kelas ' + nama + ' berhasil diperbarui', 'success');
    }

    // Hapus satu kelas, hanya bila belum ada siswa di dalamnya
    async function hapusKelas(id) {
      const kelas = _srv('kelas', 'sip_kelas');
      const i = kelas.findIndex(function(k) { return k && String(k.id) === String(id); });
      if (i === -1) {
        showNotif('Kelas tidak ditemukan', 'error');
        return;
      }

      const jumlah = _srv('siswa', 'sip_siswa').filter(function(s) {
        return s && String(s.id_kelas) === String(id);
      }).length;
      if (jumlah > 0) {
        showNotif('Kelas masih berisi ' + jumlah + ' siswa, pindahkan dulu sebelum dihapus', 'error');
        return;
      }

      const nama = kelas[i].nama || 'Kelas';
      if (!confirm('Hapus kelas ' + nama + '? Data yang dihapus tidak bisa dikembalikan.')) return;

      if (MODE_API) {
        kelasSedangDiedit = null;
        await _kirimAksi('dm-hapus-kelas-' + id, 'crudKelas',
          { aksiKelas: 'delete', data: { id: id } }, 'dataMaster', 'Menghapus');
        return;
      }

      kelas.splice(i, 1);
      localStorage.setItem('sip_kelas', JSON.stringify(kelas));

      kelasSedangDiedit = null;
      loadModule('Data Master');
      showNotif('Kelas ' + nama + ' dihapus', 'success');
    }

    // Tambah satu mata pelajaran baru
    async function tambahMapel() {
      const elNama = document.getElementById('mapelNama');
      const elKode = document.getElementById('mapelKode');
      if (!elNama || !elKode) return;

      const nama = elNama.value.trim();
      if (!nama) {
        showNotif('Nama mata pelajaran tidak boleh kosong', 'error');
        return;
      }
      const kode = elKode.value.trim();
      if (!kode) {
        showNotif('Kode mata pelajaran tidak boleh kosong', 'error');
        return;
      }

      if (MODE_API) {
        // Kode kembar diperiksa juga di server
        await _kirimAksi('dm-tambah-mapel', 'crudMapel',
          { aksiMapel: 'create', data: { nama: nama, kode: kode } }, 'dataMaster', 'Menambah');
        return;
      }

      const mapel = _bacaArr('sip_mapel');
      if (mapel.some(function(m) {
        return m && String(m.kode || '').trim().toLowerCase() === kode.toLowerCase();
      })) {
        showNotif('Kode mata pelajaran sudah ada', 'error');
        return;
      }

      let idBaru = Date.now();
      while (mapel.some(function(m) { return m && Number(m.id) === idBaru; })) idBaru++;

      mapel.push({ id: idBaru, nama: nama, kode: kode });
      localStorage.setItem('sip_mapel', JSON.stringify(mapel));

      mapelSedangDiedit = null;
      loadModule('Data Master');
      showNotif('Mata pelajaran ' + nama + ' berhasil ditambahkan', 'success');
    }

    // Daftar sepuluh siswa terbaru dalam bentuk kartu ringkas
    function htmlDaftarSiswaTerbaru() {
      const siswa = _srv('siswa', 'sip_siswa').filter(function(s) { return s && s.id !== undefined; });
      if (siswa.length === 0) {
        return '<p class="pesan-info">Belum ada data siswa</p>';
      }

      siswa.sort(function(a, b) {
        const selisih = new Date(b.tgl_input) - new Date(a.tgl_input);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);

      return siswa.slice(0, 10).map(function(s) {
        const terverifikasi = String(s.status_data || '').toLowerCase() === 'approved';
        const namaKelas = _namaDari(kelas, s.id_kelas, 'nama');
        return '<div class="kartu-siswa' + (terverifikasi ? '' : ' kartu-siswa--pending') + '">' +
