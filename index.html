    // Kirim permohonan perubahan data ke KTU. Data akun sengaja belum diubah.
    async function ajukanPerubahanData() {
      const sesi = getSession();
      const elEmail = document.getElementById('profilEmail');
      const elHp = document.getElementById('profilHp');
      const elAlamat = document.getElementById('profilAlamat');
      if (!sesi || !elEmail || !elHp || !elAlamat) return;

      const users = MODE_API ? [] : _bacaArr('sip_users');
      const u = MODE_API ? {} : users.find(function(x) { return x && String(x.id) === String(sesi.id); });
      if (!u) {
        showNotif('Akun tidak ditemukan', 'error');
        return;
      }

      const emailBaru = elEmail.value.trim();
      const hpBaru = elHp.value.trim();
      const alamatBaru = elAlamat.value.trim();

      if (emailBaru === '' && hpBaru === '' && alamatBaru === '') {
        showNotif('Isi minimal satu kolom yang ingin diubah', 'error');
        return;
      }
      if (emailBaru !== '' && !validasiEmail(emailBaru)) {
        showNotif('Format email tidak valid', 'error');
        return;
      }

      if (MODE_API) {
        // Server yang membandingkan dengan data lama dan menolak bila tak berubah
        await _kirimAksi('profil-ajukan', 'ajukanPerubahanWali', { data: {
          email_baru: emailBaru, no_hp_baru: hpBaru, alamat_baru: alamatBaru
        } }, 'waliProfil', 'Mengirim');
        formEditProfil = false;
        return;
      }

      // Kolom yang dikosongkan berarti tetap seperti sekarang
      const emailLama = String(u.email || '');
      const hpLama = String(u.no_hp || '');
      const alamatLama = String(u.alamat || '');

      const isi = {
        email_lama: emailLama, email_baru: emailBaru === '' ? emailLama : emailBaru,
        no_hp_lama: hpLama,    no_hp_baru: hpBaru === '' ? hpLama : hpBaru,
        alamat_lama: alamatLama, alamat_baru: alamatBaru === '' ? alamatLama : alamatBaru
      };

      // Kalau isian barunya sama persis dengan yang sekarang, tidak ada yang diajukan
      if (_perubahanPermohonan(isi).length === 0) {
        showNotif('Data yang diisi sama dengan data saat ini', 'error');
        return;
      }

      const daftar = _bacaArr('sip_permohonan_wali');

      // Nomor urut memakai waktu sekarang, dinaikkan bila ternyata sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(p) { return p && Number(p.id) === idBaru; })) idBaru++;

      daftar.push({
        id: idBaru,
        id_user: sesi.id,
        nama: sesi.nama || '-',
        email_lama: isi.email_lama,
        email_baru: isi.email_baru,
        no_hp_lama: isi.no_hp_lama,
        no_hp_baru: isi.no_hp_baru,
        alamat_lama: isi.alamat_lama,
        alamat_baru: isi.alamat_baru,
        status: 'pending',
        tgl_permohonan: new Date(),
        approved_by: '',
        tgl_approve: null
      });
      localStorage.setItem('sip_permohonan_wali', JSON.stringify(daftar));

      formEditProfil = false;
      loadModule('Profil');
      showNotif('Permohonan perubahan data dikirim. Menunggu persetujuan KTU.', 'success');
    }

    // Ganti PIN akun sendiri. Session tidak diutak-atik sehingga tetap masuk.
    async function gantiPIN() {
      const sesi = getSession();
      const elLama = document.getElementById('pinLama');
      const elBaru = document.getElementById('pinBaru');
      const elKonfirmasi = document.getElementById('pinKonfirmasi');
      if (!sesi || !elLama || !elBaru || !elKonfirmasi) return;

      const lama = elLama.value.trim();
      const baru = elBaru.value.trim();
      const konfirmasi = elKonfirmasi.value.trim();

      if (!lama) {
        showNotif('PIN lama wajib diisi', 'error');
        return;
      }
      if (!baru) {
        showNotif('PIN baru wajib diisi', 'error');
        return;
      }
      if (!konfirmasi) {
        showNotif('Konfirmasi PIN baru wajib diisi', 'error');
        return;
      }

      if (!/^\d{6}$/.test(baru)) {
        showNotif('PIN baru harus 6 digit angka', 'error');
        return;
      }
      if (baru !== konfirmasi) {
        showNotif('PIN baru dan konfirmasi tidak sama', 'error');
        return;
      }
      if (baru === lama) {
        showNotif('PIN baru tidak boleh sama dengan PIN lama', 'error');
        return;
      }

      if (MODE_API) {
        // Kecocokan PIN lama diperiksa server
        const ok = await _kirimAksi('pin-ganti', 'gantiPin',
          { pinLama: lama, pinBaru: baru }, null, 'Mengganti');
        if (ok) { elLama.value = ''; elBaru.value = ''; elKonfirmasi.value = ''; }
        return;
      }

      const users = _bacaArr('sip_users');
      const i = users.findIndex(function(x) { return x && String(x.id) === String(sesi.id); });
      if (i === -1) {
        showNotif('Akun tidak ditemukan', 'error');
        return;
      }
      if (String(users[i].pin || '') !== lama) {
        showNotif('PIN lama tidak sesuai', 'error');
        return;
      }

      users[i].pin = baru;
      localStorage.setItem('sip_users', JSON.stringify(users));

      // Kosongkan ketiga kolom, tanpa menggambar ulang seluruh modul
      elLama.value = '';
      elBaru.value = '';
      elKonfirmasi.value = '';

      showNotif('PIN berhasil diubah', 'success');
    }

    // ================= MODUL APPROVAL TAGIHAN & PEMBAYARAN =================

    // Pengumuman tagihan dari Bendahara yang menunggu giliran KTU
    function _tagihanMenungguKtu() {
      return _srv('pengumuman', 'sip_pengumuman').filter(function(p) {
        return p && p.id !== undefined && String(p.tipe || '') === 'tagihan' &&
               String(p.status || '') === 'pending_KTU';
      });
    }

    // Pembayaran siswa yang menunggu giliran KTU. Ditandai oleh id_siswa,
    // karena transaksi dari Manajemen Kas tidak memilikinya.
    function _pembayaranMenungguKtu() {
      return _srv('transaksi', 'sip_transaksi').filter(function(t) {
        return t && t.id !== undefined && String(t.status_approval || '') === 'pending_KTU' &&
               t.id_siswa !== undefined && t.id_siswa !== null && t.id_siswa !== '';
      });
    }

    // Transaksi yang menunggu giliran Kepala Sekolah, dipisah menurut asalnya
    function _keuanganMenungguKepsek(dariPembayaran) {
      return _srv('transaksi', 'sip_transaksi').filter(function(t) {
        if (!t || t.id === undefined) return false;
        if (String(t.status_approval || '') !== 'pending_Kepsek') return false;
        const punyaSiswa = (t.id_siswa !== undefined && t.id_siswa !== null && t.id_siswa !== '');
        return dariPembayaran ? punyaSiswa : !punyaSiswa;
      });
    }

    // Rincian antrean keuangan milik Kepala Sekolah
    function _rincianKeuanganKepsek() {
      const tagihan = _srv('pengumuman', 'sip_pengumuman').filter(function(p) {
        return p && String(p.tipe || '') === 'tagihan' && String(p.status || '') === 'pending_Kepsek';
      }).length;
      const pembayaran = _keuanganMenungguKepsek(true).length;
      const pengeluaran = _keuanganMenungguKepsek(false).length;
      return { tagihan: tagihan, pembayaran: pembayaran, pengeluaran: pengeluaran,
               total: tagihan + pembayaran + pengeluaran };
    }

    // Catat satu jejak aksi approval ke sip_log
    function _catatLogApproval(aksi, idItem, catatan) {
      const sesi = getSession();
      const log = _bacaArr('sip_log');
      log.push({ aksi: aksi, idItem: idItem, catatan: catatan,
                 oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));
    }

    // Potong kalimat panjang supaya tabel tidak melar
    function _potongTeks(teks, batas) {
      const t = String(teks || '-');
      return t.length > batas ? t.slice(0, batas) + '…' : t;
    }

    // Rangkum satu transaksi pembayaran menjadi nama siswa dan nama biayanya
    function _rincianPembayaran(t) {
      const siswa = _srv('siswa', 'sip_siswa').find(function(s) {
        return s && String(s.id) === String(t.id_siswa);
      });
      const biaya = _srv('biaya', 'sip_biaya').find(function(b) {
        return b && String(b.id) === String(t.id_biaya);
      });
      return {
        siswa: siswa ? (siswa.nama_lengkap || siswa.nama || '-') : '-',
        biaya: biaya ? (biaya.nama_biaya || '-') : '-'
      };
    }

    // Dua tombol keputusan pada kolom Aksi
    function _tombolApproval(fnSetuju, fnTolak, id) {
      // id tombol dibentuk dari nama fungsinya supaya _kirimAksi bisa
      // membuat tombol yang tepat menjadi sibuk saat dikirim ke server
      return '<td><div class="aksi-grup">' +
               '<button class="btn-aksi btn-setujui" id="' + fnSetuju + '-' + id + '" onclick="' + fnSetuju + '(' + id + ')">' +
                 '<i class="fa-solid fa-check"></i>Setujui</button>' +
               '<button class="btn-aksi btn-hapus" id="' + fnTolak + '-' + id + '" onclick="' + fnTolak + '(' + id + ')">' +
                 '<i class="fa-solid fa-xmark"></i>Tolak</button>' +
             '</div></td>';
    }

    // --- TAB 1 KTU: pengumuman tagihan dari Bendahara ---
    function htmlApprovalTagihan() {
      const daftar = _tagihanMenungguKtu();

      if (daftar.length === 0) {
        return '<p class="pesan-info">Tidak ada pengumuman tagihan menunggu persetujuan</p>';
      }

      // Kiriman terbaru di atas
      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const baris = daftar.map(function(p, urut) {
        const jumlah = Array.isArray(p.id_penerima_list) ? p.id_penerima_list.length : 0;
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (p.dari_nama || '-') + '</td>' +
                 '<td>' + _tglJam(p.tgl) + '</td>' +
                 '<td>' + _potongTeks(p.konten, 60) + '</td>' +
                 '<td>' + jumlah + ' siswa</td>' +
                 _tombolApproval('setujuiPengumumanTagihan', 'tolakPengumumanTagihan', p.id) +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel tabel--approval">' +
               '<thead><tr><th>No</th><th>Pengirim</th><th>Tanggal</th><th>Isi Pesan</th>' +
               '<th>Penerima</th><th>Aksi</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    // --- TAB 2 KTU: pembayaran siswa dari Bendahara ---
    function htmlApprovalPembayaran() {
      const daftar = _pembayaranMenungguKtu();

      if (daftar.length === 0) {
        return '<p class="pesan-info">Tidak ada pembayaran menunggu persetujuan</p>';
      }

      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const baris = daftar.map(function(t, urut) {
        const r = _rincianPembayaran(t);
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + formatTanggal(t.tgl) + '</td>' +
                 '<td>' + r.siswa + '</td>' +
                 '<td>' + r.biaya + '</td>' +
                 '<td>' + formatRupiah(t.jumlah) + '</td>' +
                 _tombolApproval('setujuiPembayaranKtu', 'tolakPembayaranKtu', t.id) +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel tabel--approval">' +
               '<thead><tr><th>No</th><th>Tanggal</th><th>Siswa</th><th>Jenis Biaya</th>' +
               '<th>Nominal</th><th>Aksi</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    function _htmlIsiApprovalTagihan(tanpaJudul) {
      const daftarTab = [

    // Ambil satu pengumuman tagihan yang masih menunggu KTU
    function _ambilTagihanKtu(id) {
      const daftar = _srv('pengumuman', 'sip_pengumuman');
      const i = daftar.findIndex(function(p) { return p && String(p.id) === String(id); });
      if (i === -1) {
        showNotif('Pengumuman tidak ditemukan', 'error');
        return null;
      }
      if (String(daftar[i].status || '') !== 'pending_KTU') {
        showNotif('Pengumuman ini sudah diproses', 'error');
        return null;
      }
      return { daftar: daftar, i: i };
    }

    // Teruskan pengumuman tagihan ke Kepala Sekolah
    async function setujuiPengumumanTagihan(id) {
      if (MODE_API) {
        await _kirimAksi('setujuiPengumumanTagihan-' + id, 'approvePengumumanTagihanKTU',
          { pengumumanId: id }, 'approvalTagihan', 'Menyetujui');
        return;
      }

      const ambil = _ambilTagihanKtu(id);
      if (!ambil) return;

      ambil.daftar[ambil.i].status = 'pending_Kepsek';
      localStorage.setItem('sip_pengumuman', JSON.stringify(ambil.daftar));

      _catatLogApproval('approve_pengumuman_tagihan_ktu', id, 'diteruskan ke Kepala Sekolah');
      loadModule('Approval Tagihan');
      showNotif('Pengumuman tagihan disetujui. Diteruskan ke Kepala Sekolah.', 'success');
    }

    // Tolak pengumuman tagihan, tidak diteruskan ke siapa pun
    async function tolakPengumumanTagihan(id) {
      if (MODE_API) {
        // Backend belum menyediakan penolakan tagihan di tahap KTU
        showNotif('Penolakan tagihan di tahap KTU belum tersedia di server', 'error');
        return;
      }

      const ambil = _ambilTagihanKtu(id);
      if (!ambil) return;

      if (!confirm('Tolak pengumuman tagihan ini?')) return;

      ambil.daftar[ambil.i].status = 'rejected';
      localStorage.setItem('sip_pengumuman', JSON.stringify(ambil.daftar));

      _catatLogApproval('tolak_pengumuman_tagihan_ktu', id, 'ditolak KTU');
      loadModule('Approval Tagihan');
      showNotif('Pengumuman tagihan ditolak', 'success');
    }

    // Ambil satu transaksi yang statusnya masih sesuai harapan
    function _ambilTransaksi(id, statusDiharapkan) {
      const daftar = _srv('transaksi', 'sip_transaksi');
      const i = daftar.findIndex(function(t) { return t && String(t.id) === String(id); });
      if (i === -1) {
        showNotif('Transaksi tidak ditemukan', 'error');
        return null;
      }
      if (String(daftar[i].status_approval || '') !== statusDiharapkan) {
        showNotif('Transaksi ini sudah diproses', 'error');
        return null;
      }
      return { daftar: daftar, i: i };
    }

    // Teruskan pembayaran ke Kepala Sekolah. Tagihan belum dilunasi di sini.
    async function setujuiPembayaranKtu(id) {
      if (MODE_API) {
        await _kirimAksi('setujuiPembayaranKtu-' + id, 'approvePembayaranKTU',
          { transaksiId: id, status: 'approved' }, 'approvalTagihan', 'Menyetujui');
        return;
      }

      const ambil = _ambilTransaksi(id, 'pending_KTU');
      if (!ambil) return;

      ambil.daftar[ambil.i].status_approval = 'pending_Kepsek';
      localStorage.setItem('sip_transaksi', JSON.stringify(ambil.daftar));

      _catatLogApproval('approve_pembayaran_ktu', id, 'diteruskan ke Kepala Sekolah');
      loadModule('Approval Tagihan');
      showNotif('Pembayaran disetujui. Diteruskan ke Kepala Sekolah.', 'success');
    }

    // Tolak pembayaran, tagihan tetap berstatus belum lunas
    async function tolakPembayaranKtu(id) {
      if (MODE_API) {
        if (!confirm('Tolak pembayaran ini?')) return;
        await _kirimAksi('tolakPembayaranKtu-' + id, 'approvePembayaranKTU',
          { transaksiId: id, status: 'rejected' }, 'approvalTagihan', 'Menolak');
        return;
      }

      const ambil = _ambilTransaksi(id, 'pending_KTU');
      if (!ambil) return;

      if (!confirm('Tolak pembayaran ini?')) return;

      ambil.daftar[ambil.i].status_approval = 'rejected';
      localStorage.setItem('sip_transaksi', JSON.stringify(ambil.daftar));

      _catatLogApproval('tolak_pembayaran_ktu', id, 'ditolak KTU');
      loadModule('Approval Tagihan');
      showNotif('Pembayaran ditolak', 'success');
    }

    // ================= MODUL APPROVE KEUANGAN (KEPALA SEKOLAH) =================

    // Satu tabel antrean keuangan. dariPembayaran menentukan kolom yang dipakai.
    function htmlKeuanganKepsek(dariPembayaran) {
      const daftar = _keuanganMenungguKepsek(dariPembayaran);

      if (daftar.length === 0) {
        return '<p class="pesan-info">Tidak ada ' +
               (dariPembayaran ? 'pembayaran' : 'pengeluaran') +
               ' menunggu persetujuan</p>';
      }

      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const baris = daftar.map(function(t, urut) {
        let kolom;
        if (dariPembayaran) {
          const r = _rincianPembayaran(t);
          kolom = '<td>' + r.siswa + '</td><td>' + r.biaya + '</td>';
        } else {
          kolom = '<td colspan="2">' + _potongTeks(t.deskripsi, 70) + '</td>';
        }
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + formatTanggal(t.tgl) + '</td>' +
                 kolom +
                 '<td>' + formatRupiah(t.jumlah) + '</td>' +
                 _tombolApproval('setujuiKeuangan', 'tolakKeuangan', t.id) +
               '</tr>';
      }).join('');

      const judulKolom = dariPembayaran
        ? '<th>Siswa</th><th>Jenis Biaya</th>'
        : '<th colspan="2">Deskripsi</th>';

      return '<div class="tabel-wrap"><table class="tabel tabel--approval">' +
               '<thead><tr><th>No</th><th>Tanggal</th>' + judulKolom +
               '<th>Nominal</th><th>Aksi</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    function _htmlIsiApproveKeuangan(tanpaJudul) {
      const daftarTab = [
        { nilai: 'pengeluaran', teks: 'Pengeluaran Pending', ikon: 'fa-money-bill-transfer',
          jumlah: _keuanganMenungguKepsek(false).length },

      ];

      const tab = daftarTab.map(function(t) {
        const aktif = (t.nilai === tabApprovalKepsek) ? ' active' : '';
        return '<button class="tab-btn' + aktif + '" ' +
               'onclick="gantiTabApprovalKepsek(\'' + t.nilai + '\')">' +
               '<i class="fa-solid ' + t.ikon + '"></i> ' + t.teks + ' (' + t.jumlah + ')</button>';
      }).join('');

      const pembayaran = (tabApprovalKepsek === 'pembayaran');
      const judulIsi = pembayaran ? 'Pembayaran Menunggu Persetujuan Akhir'
                                  : 'Pengeluaran Menunggu Persetujuan';

      return (tanpaJudul ? '' : '<h1 class="module-title">Approve Keuangan</h1>' +
             '<p class="module-sub">Persetujuan akhir pengeluaran kas dan pembayaran siswa</p>') +
             '<span class="info-badge"><i class="fa-solid fa-circle-info"></i>' +
               'Pembayaran yang Anda setujui akan langsung melunasi tagihan siswa terkait</span>' +
             '<div class="tab-bar">' + tab + '</div>' +
             '<div class="card"><h2 class="section-title">' + judulIsi + '</h2>' +
               htmlKeuanganKepsek(pembayaran) + '</div>';
    }

    // Tandai lunas satu tagihan yang cocok dengan transaksi pembayaran.
    // Yang dipilih adalah tagihan belum lunas dengan jatuh tempo paling awal.
    function _lunasiTagihan(t) {
      const tagihan = _bacaArr('sip_tagihan');
      const cocok = tagihan.filter(function(g) {
        return g && String(g.id_siswa) === String(t.id_siswa) &&
               String(g.id_biaya) === String(t.id_biaya) &&
               String(g.status_bayar || '').toLowerCase() !== 'lunas';
      });
      if (cocok.length === 0) return false;

      cocok.sort(function(a, b) {
        const ta = new Date(a.jatuh_tempo), tb = new Date(b.jatuh_tempo);
        const va = !isNaN(ta.getTime()), vb = !isNaN(tb.getTime());
        if (va && vb) return ta - tb;
        if (va !== vb) return va ? -1 : 1;
        return (Number(a.id) || 0) - (Number(b.id) || 0);
      });

      const i = tagihan.findIndex(function(g) { return g && String(g.id) === String(cocok[0].id); });
      if (i === -1) return false;

      tagihan[i].status_bayar = 'lunas';
      tagihan[i].tgl_bayar = t.tgl;
      localStorage.setItem('sip_tagihan', JSON.stringify(tagihan));
      return true;
    }

    // Persetujuan akhir. Bila transaksinya pembayaran, tagihannya ikut dilunasi.
    async function setujuiKeuangan(id) {
      if (MODE_API) {
        await _kirimAksi('setujuiKeuangan-' + id, 'approveTransaksi',
          { transaksiId: id, status: 'approved' }, 'approveKeuangan', 'Menyetujui');
        return;
      }

      const ambil = _ambilTransaksi(id, 'pending_Kepsek');
      if (!ambil) return;

      const sesi = getSession();
      const t = ambil.daftar[ambil.i];
      t.status_approval = 'approved';
      t.approved_by = sesi ? sesi.nama : '-';
      localStorage.setItem('sip_transaksi', JSON.stringify(ambil.daftar));

      // Hanya pembayaran siswa yang punya tagihan untuk dilunasi
      let lunas = false;
      if (t.id_siswa !== undefined && t.id_siswa !== null && t.id_siswa !== '') {
        lunas = _lunasiTagihan(t);
      }

      _catatLogApproval('approve_keuangan_kepsek', id, lunas ? 'disetujui, tagihan dilunasi' : 'disetujui');
      loadModule('Approve Keuangan');
      showNotif(lunas ? 'Pembayaran disetujui. Tagihan siswa ditandai lunas.'
                      : 'Transaksi berhasil disetujui', 'success');
    }

    // Tolak transaksi. Tagihan siswa tidak diubah sama sekali.
    async function tolakKeuangan(id) {
      if (MODE_API) {
        if (!confirm('Tolak transaksi ini?')) return;
        await _kirimAksi('tolakKeuangan-' + id, 'approveTransaksi',
          { transaksiId: id, status: 'rejected' }, 'approveKeuangan', 'Menolak');
        return;
      }

      const ambil = _ambilTransaksi(id, 'pending_Kepsek');
      if (!ambil) return;

      if (!confirm('Tolak transaksi ini?')) return;

      const sesi = getSession();
      ambil.daftar[ambil.i].status_approval = 'rejected';
      ambil.daftar[ambil.i].approved_by = sesi ? sesi.nama : '-';
      localStorage.setItem('sip_transaksi', JSON.stringify(ambil.daftar));

      _catatLogApproval('tolak_keuangan_kepsek', id, 'ditolak Kepala Sekolah');
      loadModule('Approve Keuangan');
      showNotif('Transaksi ditolak', 'success');
    }

    /* ==================================================================
     *  MODUL APPROVE EVENT (KEPALA SEKOLAH)
     * ------------------------------------------------------------------
     *  KTU membuat event lewat modul Event, statusnya pending. Modul ini
     *  tempat Kepala Sekolah memutuskannya. Backend: getEvent + approveEvent.
     *  Modul ini lahir langsung di atas API, jadi tidak punya jalur
     *  localStorage seperti modul-modul lama.
     * ================================================================== */

    function kepsekApproveEvent() {
      return '<h1 class="module-title">Approve Event</h1>' +
             '<p class="module-sub">Persetujuan kegiatan yang diajukan Kepala Tata Usaha</p>' +
             '<div id="isi-approve-event" data-muat="approveEvent"></div>';
    }

    // Susun tabel event yang masih menunggu keputusan
    function _htmlApproveEvent(daftar) {
      const pending = (daftar || []).filter(function(e) {
        return String(e.status_approval || '').toLowerCase() === 'pending';
      });

      return _tabelDari(pending, [
        { judul: 'Nama Event', ambil: function(e) { return _aman(e.nama_event); } },
        { judul: 'Jenis',      ambil: function(e) { return _aman(e.jenis || '-'); } },
        { judul: 'Mulai',      ambil: function(e) { return _tgl(e.tgl_mulai); } },
        { judul: 'Selesai',    ambil: function(e) { return _tgl(e.tgl_selesai); } },
        { judul: 'Sasaran',    ambil: function(e) { return _aman(e.target || 'semua'); } },
        { judul: 'Keterangan', ambil: function(e) { return _aman(e.deskripsi || '-'); } },
        { judul: 'Aksi', ambil: function(e) {
            return '<button class="btn-aksi btn-setujui" id="ev-setuju-' + e.id + '" ' +
                     'onclick="putuskanEvent(' + e.id + ', \'approved\')">' +
                     '<i class="fa-solid fa-check"></i>Setujui</button>' +
                   '<button class="btn-aksi btn-tolak" id="ev-tolak-' + e.id + '" ' +
                     'onclick="putuskanEvent(' + e.id + ', \'rejected\')">' +
                     '<i class="fa-solid fa-times"></i>Tolak</button>';
          } }
      ], 'Tidak ada event yang menunggu persetujuan');
    }

    // Saringan dikirim di bawah kunci "filter" karena doPost meneruskannya
    // sebagai p.filter, bukan membaca kunci di tingkat atas muatan.
    PEMUAT.approveEvent = function() {
      return _muatModul('isi-approve-event', [['getEvent', { filter: { status_approval: 'pending' } }]],
        function(d) { return _htmlApproveEvent(d[0]); }, 'approveEvent', 3);
    };

    // Setujui atau tolak satu event
    async function putuskanEvent(idEvent, status) {
      if (status === 'rejected' && !confirm('Tolak event ini?')) return;

      await _kirimAksi(
        (status === 'approved' ? 'ev-setuju-' : 'ev-tolak-') + idEvent,
        'approveEvent',
        { idEvent: idEvent, status: status },
        'approveEvent',
        status === 'approved' ? 'Menyetujui' : 'Menolak'
      );
    }


    /* ==================================================================
     *  MODUL APPROVE USULAN BIAYA (KEPALA SEKOLAH)
     * ------------------------------------------------------------------
     *  Bendahara mengusulkan perubahan nominal biaya lewat usulanBiaya().
     *  Usulan itu tersimpan di sheet Approval_Log bertipe "biaya".
     *
     *  CATATAN: nominal usulannya TIDAK disimpan di kolom tersendiri,
     *  melainkan menyatu di dalam kalimat kolom "catatan". Karena
     *  approveUsulanBiaya() mewajibkan nominalBaru, angkanya dibaca dari
     *  kalimat itu lalu DITAMPILKAN pada kolom yang masih bisa disunting.
     *  Dengan begitu, kalau pembacaannya meleset, Kepala Sekolah melihatnya
     *  lebih dulu dan bisa membetulkan, bukan menyetujui angka yang salah.
     * ================================================================== */

    function kepsekApproveUsulanBiaya() {
      return '<h1 class="module-title">Approve Usulan Biaya</h1>' +
             '<p class="module-sub">Persetujuan perubahan nominal biaya yang diajukan Bendahara</p>' +
             '<span class="info-badge"><i class="fa-solid fa-circle-info"></i>' +
               'Periksa nominal sebelum menyetujui. Nominal yang Anda setujui langsung ' +
               'menggantikan nominal biaya yang berlaku.</span>' +
             '<div id="isi-usulan-biaya" data-muat="usulanBiaya"></div>';
    }

    // Baca nominal usulan dari kalimat catatan.
    // Bentuk kalimatnya: Usulan nominal "SPP" dari 500000 menjadi 600000
    // Mengembalikan null bila tidak terbaca, supaya bisa ditandai di layar.
    function _nominalUsulan(catatan) {
      const m = String(catatan || '').match(/menjadi\s+([0-9]+)/i);
      if (!m) return null;
      const n = Number(m[1]);
      return (!isNaN(n) && n > 0) ? n : null;
    }

    function _htmlUsulanBiaya(daftar) {
      const pending = (daftar || []).filter(function(u) {
        return String(u.status || '').toLowerCase() === 'pending';
      });

      return _tabelDari(pending, [
        { judul: 'Tanggal',  ambil: function(u) { return _tgl(u.timestamp); } },
        { judul: 'Usulan',   ambil: function(u) { return _aman(u.catatan || '-'); } },
        { judul: 'Nominal Disetujui', ambil: function(u) {
            const n = _nominalUsulan(u.catatan);
            const peringatan = (n === null)
              ? '<span class="gagal-pesan">Nominal tidak terbaca, isi manual</span>'
              : '';
            return '<input type="number" class="input" id="usulan-nominal-' + u.id + '" ' +
                     'value="' + (n === null ? '' : n) + '" min="1" ' +
                     'placeholder="Nominal baru">' + peringatan;
          } },
        { judul: 'Aksi', ambil: function(u) {
            return '<button class="btn-aksi btn-setujui" id="ub-setuju-' + u.id + '" ' +
                     'onclick="putuskanUsulanBiaya(' + u.id + ', \'approved\')">' +
                     '<i class="fa-solid fa-check"></i>Setujui</button>' +
                   '<button class="btn-aksi btn-tolak" id="ub-tolak-' + u.id + '" ' +
                     'onclick="putuskanUsulanBiaya(' + u.id + ', \'rejected\')">' +
                     '<i class="fa-solid fa-times"></i>Tolak</button>';
          } }
      ], 'Tidak ada usulan biaya yang menunggu persetujuan', 'fa-file-invoice-dollar');
    }

    PEMUAT.usulanBiaya = function() {
      return _muatModul('isi-usulan-biaya', [['getUsulanBiaya', { filter: { status: 'pending' } }]],
        function(d) { return _htmlUsulanBiaya(d[0]); }, 'usulanBiaya', 3);
    };

    async function putuskanUsulanBiaya(idUsulan, status) {
      const muatan = { idUsulan: idUsulan, status: status };

      // Nominal hanya wajib saat menyetujui. Backend menolak nominal <= 0,
      // tapi lebih baik dicegah di sini supaya pesannya jelas.
      if (status === 'approved') {
        const kolom = document.getElementById('usulan-nominal-' + idUsulan);
        const nominal = Number(kolom ? kolom.value : 0);
        if (!nominal || nominal <= 0) {
          showNotif('Isi dulu nominal yang disetujui', 'error');
          if (kolom) kolom.focus();
          return;
        }
        muatan.nominalBaru = nominal;
      } else {
        if (!confirm('Tolak usulan biaya ini?')) return;
      }

      await _kirimAksi(
        (status === 'approved' ? 'ub-setuju-' : 'ub-tolak-') + idUsulan,
        'approveUsulanBiaya',
        muatan,
        'usulanBiaya',
        status === 'approved' ? 'Menyetujui' : 'Menolak'
      );
    }


    // ================= MODUL KONFIGURASI UMUM (KEPALA SEKOLAH) =================

    // Nilai bawaan batas pengeluaran bila konfigurasi belum pernah disimpan
    const THRESHOLD_BAWAAN = 1000000;

    // Kalimat yang harus diketik persis sebelum tombol reset bisa ditekan
    const KALIMAT_KONFIRMASI_RESET = 'YA, SAYA YAKIN';

    // Pembaca 'sip_konfigurasi'. Isinya objek, bukan array, jadi tidak
    // bisa memakai _bacaArr(). Selalu mengembalikan objek.
    function _bacaKonfigurasi() {
      // getKonfigurasi mengembalikan objek kunci-nilai, bukan array,
      // jadi titipannya disimpan sendiri di luar _srvIsi()
      if (SRV.konfigurasi && typeof SRV.konfigurasi === 'object') return SRV.konfigurasi;
      try {
        const isi = JSON.parse(localStorage.getItem('sip_konfigurasi'));
        return (isi && typeof isi === 'object' && !Array.isArray(isi)) ? isi : {};
      } catch (e) {
        return {};
      }
    }

    // Simpan satu nilai konfigurasi tanpa menghapus nilai lainnya
    function _simpanKonfigurasi(kunci, nilai) {
      const konf = _bacaKonfigurasi();
      konf[kunci] = nilai;
      localStorage.setItem('sip_konfigurasi', JSON.stringify(konf));
    }

    // Batas pengeluaran yang sedang berlaku
    function _thresholdBerlaku() {
      const n = Number(_bacaKonfigurasi().threshold_keuangan);
      return (!isNaN(n) && n > 0) ? n : THRESHOLD_BAWAAN;
    }

    // Modul Konfigurasi Umum milik Kepala Sekolah, mengembalikan HTML siap tampil
    function kepsekKonfigurasi() {
      if (MODE_API) return '<div id="isi-konfigurasi" data-muat="konfigurasi"></div>';
      return _htmlIsiKonfigurasi();
    }

    PEMUAT.konfigurasi = function() {
      return _muatModul('isi-konfigurasi', [['getKonfigurasi'], ['getTahunAjaran']], function(d) {
        SRV.konfigurasi = (d[0] && typeof d[0] === 'object') ? d[0] : {};
        _srvIsi({ tahunAjaran: d[1] });
        return _htmlIsiKonfigurasi();
      }, 'konfigurasi', 4);
    };

    function _htmlIsiKonfigurasi() {
      const tahunAjaran = _pastikanTahunAjaran();
      const konf = _bacaKonfigurasi();

      // --- BAGIAN 1: tahun ajaran aktif ---
      const aktifSekarang = tahunAjaran.find(function(t) { return t.status_aktif === true; });

      const opsiTahun = tahunAjaran.map(function(t) {
        const dipilih = (aktifSekarang && String(t.id) === String(aktifSekarang.id)) ? ' selected' : '';
        return '<option value="' + t.id + '"' + dipilih + '>' + t.tahun +
               (t.status_aktif === true ? ' (aktif)' : '') + '</option>';
      }).join('');

      const kartuTahun =
        '<div class="card">' +
          '<h2 class="section-title">Tahun Ajaran Aktif</h2>' +
          '<span class="info-badge"><i class="fa-solid fa-circle-info"></i>' +
            'Tahun ajaran aktif digunakan di seluruh sistem</span>' +
          '<label class="form-label" for="konfTahun">Pilih Tahun Ajaran Aktif</label>' +
          '<select id="konfTahun" class="input">' + opsiTahun + '</select>' +
          '<button class="btn" id="konf-tahun" onclick="simpanTahunAjaranAktif()">' +
            '<i class="fa-solid fa-check"></i> Simpan</button>' +
        '</div>';

      // --- BAGIAN 2: batas persetujuan keuangan ---
      const kartuThreshold =
        '<div class="card">' +
          '<h2 class="section-title">Batas Persetujuan Keuangan</h2>' +
          '<label class="form-label" for="konfThreshold">Batas Pengeluaran (Rp)</label>' +
          '<input type="number" id="konfThreshold" class="input" min="1" ' +
            'value="' + _thresholdBerlaku() + '">' +
          '<p class="ket-export">Pengeluaran di atas jumlah ini memerlukan ' +
            'persetujuan Kepala Sekolah</p>' +
          '<button class="btn" id="konf-threshold" onclick="simpanThreshold()">' +
            '<i class="fa-solid fa-check"></i> Simpan</button>' +
        '</div>';

      // --- BAGIAN 3: logo aplikasi ---
      const logoUrl = String(konf.logo_url || '').trim();
      const pratinjau = logoUrl
        ? '<div class="logo-kotak"><img src="' + logoUrl + '" alt="Logo aplikasi" ' +
            'onerror="this.style.display=\'none\'"></div>' +
          '<span class="logo-ket">Logo saat ini: ' + logoUrl + '</span>'
        : '<div class="logo-kotak"><i class="fa-solid fa-mosque"></i></div>' +
          '<span class="logo-ket">Logo saat ini: bawaan aplikasi</span>';

      const kartuLogo =
        '<div class="card">' +
          '<h2 class="section-title">Logo Aplikasi</h2>' +
          pratinjau +
          '<label class="form-label" for="konfLogo">URL Logo Baru</label>' +
          '<input type="text" id="konfLogo" class="input" placeholder="https://..." ' +
            'value="' + logoUrl + '">' +
          '<span class="info-badge"><i class="fa-solid fa-circle-info"></i>' +
            'Logo akan muncul di halaman login dan sidebar</span>' +
          '<div class="filter-aksi">' +
            '<button class="btn" id="konf-logo" onclick="simpanLogo()">' +
              '<i class="fa-solid fa-check"></i> Simpan</button>' +
            '<button class="btn btn--abu" id="konf-logo-reset" onclick="resetLogo()">' +
              '<i class="fa-solid fa-rotate-left"></i> Reset ke Default</button>' +
          '</div>' +
        '</div>';

      // --- BAGIAN 4: reset seluruh data ---
      // resetAplikasi() hanya membersihkan penyimpanan peramban. Pada mode
      // server, data yang sesungguhnya ada di Google Sheet dan tidak ikut
      // terhapus, jadi keterangannya jangan sampai menjanjikan lebih.
      const kartuReset =
        '<div class="card card--bahaya">' +
          '<h2 class="section-title">Reset Data Aplikasi</h2>' +
          '<p class="teks-bahaya"><i class="fa-solid fa-triangle-exclamation"></i> ' +
            (MODE_API
              ? 'Menghapus data contoh yang tersimpan di peramban ini saja. ' +
                'Data di server TIDAK ikut terhapus. Anda akan keluar dari aplikasi.'
              : 'Fitur ini akan menghapus SEMUA data dan mengembalikan ke pengaturan awal.') +
          '</p>' +
          '<label class="form-label" for="konfirmasiReset">' +
            'Ketik <strong>' + KALIMAT_KONFIRMASI_RESET + '</strong> untuk membuka tombol</label>' +
          '<input type="text" id="konfirmasiReset" class="input" ' +
            'placeholder="' + KALIMAT_KONFIRMASI_RESET + '" oninput="cekKonfirmasiReset()">' +
          '<button class="btn btn--merah btn--full" id="tombolReset" disabled ' +
            'onclick="resetAplikasi()">' +
            '<i class="fa-solid fa-trash"></i> ' +
            (MODE_API ? 'Reset Data Peramban' : 'Reset Semua Data') + '</button>' +
        '</div>';

      return '<h1 class="module-title">Konfigurasi Umum</h1>' +
             '<p class="module-sub">Atur pengaturan dasar aplikasi</p>' +
             kartuTahun + kartuThreshold + kartuLogo + kartuReset;
    }

    // Tetapkan satu tahun ajaran sebagai yang aktif. Sisanya dimatikan.
    async function simpanTahunAjaranAktif() {
      const el = document.getElementById('konfTahun');
      if (!el) return;

      if (!el.value) {
        showNotif('Tahun ajaran wajib dipilih', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('konf-tahun', 'setTahunAjaranAktif',
          { idTahun: el.value }, 'konfigurasi', 'Menyimpan');
        return;
      }

      const daftar = _bacaArr('sip_tahun_ajaran').filter(function(t) { return t && t.tahun; });
      const i = daftar.findIndex(function(t) { return String(t.id) === String(el.value); });
      if (i === -1) {
        showNotif('Tahun ajaran tidak ditemukan', 'error');
        return;
      }

      // Hanya satu tahun ajaran yang boleh aktif
      daftar.forEach(function(t, urut) { t.status_aktif = (urut === i); });
      localStorage.setItem('sip_tahun_ajaran', JSON.stringify(daftar));

      loadModule('Konfigurasi');
      showNotif('Tahun ajaran aktif diubah ke ' + daftar[i].tahun, 'success');
    }

    // Simpan batas nominal pengeluaran yang butuh persetujuan Kepala Sekolah
    async function simpanThreshold() {
      const el = document.getElementById('konfThreshold');
      if (!el) return;

      const nilai = Number(el.value);
      if (!nilai || nilai <= 0) {
        showNotif('Batas pengeluaran harus lebih dari 0', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('konf-threshold', 'simpanKonfigurasi',
          { kunci: 'threshold_keuangan', nilai: nilai }, 'konfigurasi', 'Menyimpan');
        return;
      }

      _simpanKonfigurasi('threshold_keuangan', nilai);

      loadModule('Konfigurasi');
      showNotif('Batas pengeluaran disimpan: ' + formatRupiah(nilai), 'success');
    }

    // Simpan alamat logo baru
    async function simpanLogo() {
      const el = document.getElementById('konfLogo');
      if (!el) return;

      const url = el.value.trim();
      if (!url) {
        showNotif('URL logo tidak boleh kosong. Pakai Reset ke Default untuk mengosongkan.', 'error');
        return;
      }
      if (!/^https?:\/\//i.test(url)) {
        showNotif('URL logo harus diawali http:// atau https://', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('konf-logo', 'simpanKonfigurasi',
          { kunci: 'logo_url', nilai: url }, 'konfigurasi', 'Menyimpan');
        return;
      }

      _simpanKonfigurasi('logo_url', url);

      loadModule('Konfigurasi');
      showNotif('Logo aplikasi berhasil disimpan', 'success');
    }

    // Kembalikan logo ke bawaan aplikasi
    async function resetLogo() {
      if (MODE_API) {
        await _kirimAksi('konf-logo-reset', 'simpanKonfigurasi',
          { kunci: 'logo_url', nilai: '' }, 'konfigurasi', 'Mengembalikan');
        return;
      }

      _simpanKonfigurasi('logo_url', '');

      loadModule('Konfigurasi');
      showNotif('Logo dikembalikan ke bawaan aplikasi', 'success');
    }

    // Tombol reset baru terbuka setelah kalimat konfirmasi diketik persis.
    // Hanya atribut tombolnya yang diubah, modul tidak digambar ulang,
    // supaya kursor tidak lompat keluar dari kolom.
    function cekKonfirmasiReset() {
      const el = document.getElementById('konfirmasiReset');
      const tombol = document.getElementById('tombolReset');
      if (!el || !tombol) return;

      tombol.disabled = (el.value.trim().toUpperCase() !== KALIMAT_KONFIRMASI_RESET);
    }

    // Hapus seluruh data lalu kembalikan data contoh seperti keadaan awal
    function resetAplikasi() {
      const el = document.getElementById('konfirmasiReset');
      if (!el || el.value.trim().toUpperCase() !== KALIMAT_KONFIRMASI_RESET) {
        showNotif('Ketik "' + KALIMAT_KONFIRMASI_RESET + '" terlebih dahulu', 'error');
        return;
      }

      // Lapis kedua: sekali lagi ditanya sebelum benar-benar dihapus
      if (!confirm('Seluruh data akan dihapus dan tidak bisa dikembalikan. Lanjutkan?')) return;

      localStorage.clear();

      // Isi ulang persis seperti saat aplikasi pertama kali dibuka
      localStorage.setItem('sip_users', JSON.stringify(DUMMY_USERS));
      localStorage.setItem('sip_siswa', JSON.stringify(DUMMY_SISWA));
      ['sip_absensi', 'sip_pengumuman', 'sip_log', 'sip_biaya',
       'sip_rpp', 'sip_nilai', 'sip_mapel', 'sip_kelas',
       'sip_transaksi', 'sip_tagihan', 'sip_usulan_biaya'].forEach(function(kunci) {
        localStorage.setItem(kunci, JSON.stringify([]));
      });

      // Tema ikut kembali ke bawaan karena kuncinya ikut terhapus
      document.documentElement.setAttribute('data-theme', 'light');

      logout();
      showNotif('Semua data direset. Silakan masuk kembali.', 'success');
    }

    // ================= HELPER BERSAMA ROLE GURU =================

    // Tanggal dalam bentuk YYYY-MM-DD, dipakai kolom tanggal dan pembanding hari
    function _ymd(d) {
      const t = (d instanceof Date) ? d : new Date(d);
      if (isNaN(t.getTime())) return '';
      const dua = function(n) { return String(n).padStart(2, '0'); };
      return t.getFullYear() + '-' + dua(t.getMonth() + 1) + '-' + dua(t.getDate());
    }

    // Jam sekarang dalam bentuk HH:mm
    function _jamKini() {
      const t = new Date();
      const dua = function(n) { return String(n).padStart(2, '0'); };
      return dua(t.getHours()) + ':' + dua(t.getMinutes());
    }

    // Nama hari sesuai penamaan pada HARI_JADWAL
    function _namaHari(d) {
      const t = (d instanceof Date) ? d : new Date(d);
      if (isNaN(t.getTime())) return '';
      // getDay(): 0 = Minggu, sedangkan HARI_JADWAL dimulai dari Senin
      const urutan = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      return urutan[t.getDay()];
    }

    function _htmlIsiGuruDashboard() {
      _pastikanPenyimpananGuru();

      const sesi = getSession();
      const hariIni = new Date();
      const namaHari = _namaHari(hariIni);

      // --- Jadwal mengajar hari ini ---
      const jadwalSaya = _srv('jadwal', 'sip_jadwal').filter(function(j) {
        return j && j.id !== undefined && sesi &&
               String(j.id_guru) === String(sesi.id) && String(j.hari || '') === namaHari;
      });
      jadwalSaya.sort(function(a, b) {
        return String(a.jam_mulai || '').localeCompare(String(b.jam_mulai || ''));
      });

      const mapel = _srv('mapel', 'sip_mapel');
      const kelas = _srv('kelas', 'sip_kelas');

      let isiJadwal;
      if (jadwalSaya.length === 0) {
        isiJadwal = '<p class="pesan-info">Tidak ada jadwal mengajar hari ' + namaHari + '</p>';
      } else {
        const baris = jadwalSaya.map(function(j) {
          let namaMapel = _namaDari(mapel, j.id_mapel, 'nama');
          if (namaMapel === '-') namaMapel = j.nama_mapel || '-';
          let namaKelas = _namaDari(kelas, j.id_kelas, 'nama');
          if (namaKelas === '-') namaKelas = j.nama_kelas || '-';

          return '<tr>' +
                   '<td>' + (j.jam_mulai || '-') + ' - ' + (j.jam_selesai || '-') + '</td>' +
                   '<td>' + namaMapel + '</td>' +
                   '<td>' + namaKelas + '</td>' +
                 '</tr>';
        }).join('');

        isiJadwal = '<div class="tabel-wrap"><table class="tabel">' +
                      '<thead><tr><th>Jam</th><th>Mata Pelajaran</th><th>Kelas</th></tr></thead>' +
                      '<tbody>' + baris + '</tbody></table></div>';
      }

      // --- Tiga angka ringkasan ---
      const tglHariIni = _ymd(hariIni);

      const rppHariIni = _srv('rpp', 'sip_rpp').filter(function(r) {
        return r && sesi && String(r.id_guru) === String(sesi.id) && _ymd(r.tgl) === tglHariIni;
      }).length;

      // Siswa yang diajar dihitung dari seluruh kelas yang ada di jadwal guru ini
      const kelasDiajar = {};
      _srv('jadwal', 'sip_jadwal').forEach(function(j) {
        if (j && sesi && String(j.id_guru) === String(sesi.id) && j.id_kelas !== undefined) {
          kelasDiajar[String(j.id_kelas)] = true;
        }
      });
      const siswaDiajar = _srv('siswa', 'sip_siswa').filter(function(s) {
        return s && s.id_kelas !== undefined && s.id_kelas !== null &&
               kelasDiajar[String(s.id_kelas)] === true;
      }).length;

      // Nilai dari server sudah dibatasi pada mapel guru ini,
      // jadi penyaringan id_guru hanya perlu di jalur localStorage
      const nilaiDiberikan = Array.isArray(SRV.nilai)
        ? SRV.nilai.length
        : _bacaArr('sip_nilai').filter(function(n) {
            return n && sesi && String(n.id_guru) === String(sesi.id);
          }).length;

      const kartu = [
        { angka: rppHariIni,     label: 'RPP Hari Ini',      ikon: 'fa-book-open',     warna: 'hijau',  ikonWarna: 'hijau',  tujuan: 'RPP' },
        { angka: siswaDiajar,    label: 'Siswa yang Diajar', ikon: 'fa-user-graduate', warna: 'biru',   ikonWarna: 'biru',   tujuan: null },
        { angka: nilaiDiberikan, label: 'Nilai Terinput',    ikon: 'fa-pen-to-square', warna: 'emas',   ikonWarna: 'emas',   tujuan: 'Input Nilai' }

        const bisaKlik = k.tujuan ? ' stat-card--klik' : '';
        const aksi = k.tujuan ? ' onclick="loadModule(\'' + k.tujuan + '\')"' : '';
        return '<div class="stat-card stat-card--' + k.warna + bisaKlik + '" ' +
                 'style="animation-delay:' + ((i + 1) / 10) + 's"' + aksi + '>' +
                 '<i class="fa-solid ' + k.ikon + ' stat-icon stat-icon--' + k.ikonWarna + '"></i>' +
                 '<div class="stat-number">' + k.angka + '</div>' +
                 '<div class="stat-label">' + k.label + '</div>' +
               '</div>';
      }).join('');

      // --- Tanggal hari ini, ditulis lengkap ---
      const tglLengkap = hariIni.toLocaleDateString('id-ID', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'

             '<p class="module-sub">Ringkasan mengajar Anda hari ini</p>' +

             '<div class="stat-grid">' + htmlKartu + '</div>' +

    // Catatan absensi guru yang sedang masuk untuk tanggal tertentu
    function _absensiHari(tanggal) {
      const sesi = getSession();
      if (!sesi) return null;
      return _srv('absensi', 'sip_absensi').find(function(a) {
        return a && a.id_guru !== undefined &&
               String(a.id_guru) === String(sesi.id) && _ymd(a.tgl) === tanggal;
      }) || null;

    // Riwayat kehadiran tujuh hari terakhir
    function htmlRiwayatAbsensi() {
      const sesi = getSession();
      const batas = new Date();
      batas.setHours(0, 0, 0, 0);
      batas.setDate(batas.getDate() - 6);

      const daftar = _srv('absensi', 'sip_absensi').filter(function(a) {
        if (!a || a.id_guru === undefined || !sesi) return false;
        if (String(a.id_guru) !== String(sesi.id)) return false;
        const t = new Date(a.tgl);
        return !isNaN(t.getTime()) && t >= batas;
      });

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada catatan absensi dalam 7 hari terakhir</p>';
      }

      // Terbaru di atas
      daftar.sort(function(a, b) { return new Date(b.tgl) - new Date(a.tgl); });

      const baris = daftar.map(function(a, urut) {
        const st = String(a.status || '').toLowerCase();
        const kelas = (st === 'hadir') ? 'hadir' : 'nonaktif';
        const teks = st ? st.charAt(0).toUpperCase() + st.slice(1) : '-';
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + formatTanggal(a.tgl) + '</td>' +
                 '<td>' + (a.jam_masuk || '-') + '</td>' +
                 '<td>' + (a.jam_keluar || '-') + '</td>' +
                 '<td><span class="badge badge--' + kelas + '">' + teks + '</span></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel">' +
               '<thead><tr><th>No</th><th>Tanggal</th><th>Jam Masuk</th>' +
               '<th>Jam Keluar</th><th>Status</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    // Catat jam masuk hari ini
    async function checkInGuru() {
      const sesi = getSession();
      if (!sesi) return;

      const hariIni = _ymd(new Date());
      if (_absensiHari(hariIni)) {
        showNotif('Anda sudah check-in hari ini', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('absen-masuk', 'absenGuru',
          { idGuru: sesi.id, jenis: 'checkin' }, 'guruAbsensi', 'Mencatat');
        return;
      }

      const daftar = _bacaArr('sip_absensi');

      // Nomor urut memakai waktu sekarang, dinaikkan bila ternyata sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(a) { return a && Number(a.id) === idBaru; })) idBaru++;

      const jam = _jamKini();
      daftar.push({
        id: idBaru,
        id_guru: sesi.id,
        tgl: new Date(),
        jam_masuk: jam,
        jam_keluar: '',
        status: 'hadir'
      });
      localStorage.setItem('sip_absensi', JSON.stringify(daftar));

      loadModule('Absensi Mengajar');
      showNotif('Check-in berhasil pukul ' + jam, 'success');
    }

    // Catat jam keluar pada catatan hari ini
    async function checkOutGuru() {
      const hariIni = _ymd(new Date());
      const catatan = _absensiHari(hariIni);

      if (!catatan) {
        showNotif('Anda belum check-in hari ini', 'error');
        return;
      }
      if (catatan.jam_keluar) {
        showNotif('Anda sudah check-out hari ini', 'error');
        return;
      }

      if (MODE_API) {
        const sesi = getSession();
        await _kirimAksi('absen-keluar', 'absenGuru',
          { idGuru: sesi ? sesi.id : '', jenis: 'checkout' }, 'guruAbsensi', 'Mencatat');
        return;
      }

      const daftar = _bacaArr('sip_absensi');
      const i = daftar.findIndex(function(a) { return a && String(a.id) === String(catatan.id); });
      if (i === -1) {
        showNotif('Catatan absensi tidak ditemukan', 'error');
        return;
      }

      const jam = _jamKini();
      daftar[i].jam_keluar = jam;
      localStorage.setItem('sip_absensi', JSON.stringify(daftar));

      loadModule('Absensi Mengajar');
      showNotif('Check-out berhasil pukul ' + jam, 'success');
    }

    // Simpan satu RPP. Untuk demo, lampiran hanya dicatat nama berkasnya.
    async function simpanRPP() {
      const sesi = getSession();
      const elMapel = document.getElementById('rppMapel');
      const elKelas = document.getElementById('rppKelas');
      const elTanggal = document.getElementById('rppTanggal');
      const elMetode = document.getElementById('rppMetode');
      const elMedia = document.getElementById('rppMedia');
      const elMateri = document.getElementById('rppMateri');
      const elFile = document.getElementById('rppFile');
      if (!sesi || !elMapel || !elKelas || !elTanggal || !elMetode || !elMedia || !elMateri) return;

      if (!elMapel.value) {
        showNotif('Mata pelajaran wajib dipilih', 'error');
        return;
      }
      if (!elKelas.value) {
        showNotif('Kelas wajib dipilih', 'error');
        return;
      }
      if (!elTanggal.value) {
        showNotif('Tanggal wajib diisi', 'error');
        return;
      }
      const materi = elMateri.value.trim();
      if (!materi) {
        showNotif('Materi tidak boleh kosong', 'error');
        return;
      }
      const metode = elMetode.value.trim();
      if (!metode) {
        showNotif('Metode tidak boleh kosong', 'error');
        return;
      }
      const media = elMedia.value.trim();
      if (!media) {
        showNotif('Media tidak boleh kosong', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('rpp-simpan', 'simpanRPP', { data: {
          id_mapel: elMapel.value, id_kelas: elKelas.value, tgl: elTanggal.value,
          materi: materi, metode: metode, media: media,
          file_url: (elFile && elFile.files && elFile.files[0]) ? elFile.files[0].name : ''
        } }, 'guruRPP', 'Menyimpan');
        return;
      }

      const daftar = _bacaArr('sip_rpp');

      // Nomor urut memakai waktu sekarang, dinaikkan bila ternyata sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(r) { return r && Number(r.id) === idBaru; })) idBaru++;

      // Tanggal mengikuti isian, jamnya memakai waktu saat pencatatan
      const tgl = new Date(elTanggal.value + 'T00:00:00');
      const kini = new Date();
      if (!isNaN(tgl.getTime())) {
        tgl.setHours(kini.getHours(), kini.getMinutes(), kini.getSeconds(), 0);
      }

      daftar.push({
        id: idBaru,
        id_guru: sesi.id,
        id_mapel: elMapel.value,
        id_kelas: elKelas.value,
        tgl: isNaN(tgl.getTime()) ? kini : tgl,
        materi: materi,
        metode: metode,
        media: media,
        file_url: (elFile && elFile.files && elFile.files.length > 0) ? elFile.files[0].name : ''
      });
      localStorage.setItem('sip_rpp', JSON.stringify(daftar));

      // Menggambar ulang modul sekaligus mengosongkan seluruh isian
      loadModule('RPP');
      showNotif('RPP berhasil disimpan', 'success');
    }

    // Daftar siswa pada kelas terpilih beserta kolom isian nilainya
    function htmlDaftarNilaiSiswa() {
      const siswa = _srv('siswa', 'sip_siswa').filter(function(s) {
        return s && s.id !== undefined &&
               String(s.id_kelas) === String(nilaiPilihan.idKelas);
      });

      if (siswa.length === 0) {
        return '<p class="pesan-info">Belum ada siswa pada kelas ini</p>';
      }

      siswa.sort(function(a, b) {
        return String(a.nama_lengkap || a.nama || '').localeCompare(String(b.nama_lengkap || b.nama || ''));
      });

      const sesi = getSession();
      const semuaNilai = _srv('nilai', 'sip_nilai');

      const baris = siswa.map(function(s, urut) {
        // Nilai terakhir untuk mapel dan jenis yang sedang dipilih, sekadar acuan
        const milikSiswa = semuaNilai.filter(function(n) {
          return n && String(n.id_siswa) === String(s.id) &&
                 String(n.id_mapel) === String(nilaiPilihan.idMapel) &&
                 String(n.jenis || '') === nilaiPilihan.jenis &&
                 sesi && String(n.id_guru) === String(sesi.id);
        });
        milikSiswa.sort(function(a, b) { return new Date(b.tgl) - new Date(a.tgl); });
        const terakhir = milikSiswa.length > 0 ? milikSiswa[0].nilai : null;

        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (s.nis || '-') + '</td>' +
                 '<td>' + (s.nama_lengkap || s.nama || '-') + '</td>' +
                 '<td>' + (terakhir === null ? '-' : terakhir) + '</td>' +
                 '<td><input type="number" class="input-inline input-nilai" ' +
                   'id="nilai-' + s.id + '" min="0" max="100" placeholder="0-100"></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel tabel--nilai">' +
               '<thead><tr><th>No</th><th>NIS</th><th>Nama Siswa</th>' +
               '<th>Nilai Terakhir</th><th>Nilai Baru</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>' +
             '<button class="btn btn--full" id="nilai-simpan" onclick="simpanNilai()">' +
               '<i class="fa-solid fa-save"></i> Simpan Nilai</button>';
    }

          '</div>' +
        '</div>';

        return filter +

    // Terapkan pilihan mapel, kelas, dan jenis nilai
    function tampilkanDaftarNilai() {
      const elMapel = document.getElementById('nilaiMapel');
      const elKelas = document.getElementById('nilaiKelas');

    // Simpan seluruh nilai yang terisi. Baris yang dikosongkan dilewati.
    async function simpanNilai() {
      const sesi = getSession();
      if (!sesi) return;

      if (!nilaiPilihan.idMapel || !nilaiPilihan.idKelas) {
        showNotif('Pilih mata pelajaran dan kelas terlebih dahulu', 'error');
        return;
      }

      const siswa = _srv('siswa', 'sip_siswa').filter(function(s) {
        return s && s.id !== undefined && String(s.id_kelas) === String(nilaiPilihan.idKelas);
      });

      // Kumpulkan dulu seluruh isian, sekaligus periksa nilainya
      const akanDisimpan = [];
      for (let i = 0; i < siswa.length; i++) {
        const el = document.getElementById('nilai-' + siswa[i].id);
        if (!el) continue;

        const isi = el.value.trim();
        if (isi === '') continue;                 // dikosongkan berarti dilewati

        const angka = Number(isi);
        if (isNaN(angka) || angka < 0 || angka > 100) {
          showNotif('Nilai ' + (siswa[i].nama_lengkap || siswa[i].nama || '-') +
                    ' harus angka 0 sampai 100', 'error');
          return;                                 // tidak ada yang disimpan bila ada yang salah
        }
        akanDisimpan.push({ idSiswa: siswa[i].id, nilai: angka });
      }

      if (akanDisimpan.length === 0) {
        showNotif('Belum ada nilai yang diisi', 'error');
        return;
      }

      if (MODE_API) {
        // Seluruh baris dikirim dalam satu panggilan. Backend memeriksa
        // semuanya lebih dulu, jadi tidak ada nilai yang masuk separuh.
        await _kirimAksi('nilai-simpan', 'inputNilaiBanyak', {
          data: {
            id_mapel: nilaiPilihan.idMapel,
            jenis: nilaiPilihan.jenis,
            daftar: akanDisimpan.map(function(x) {
              return { id_siswa: x.idSiswa, nilai: x.nilai };
            })
          }
        }, 'inputNilai', 'Menyimpan');
        return;
      }

      const daftar = _bacaArr('sip_nilai');
      let idBaru = Date.now();

      akanDisimpan.forEach(function(x) {
        while (daftar.some(function(n) { return n && Number(n.id) === idBaru; })) idBaru++;
        daftar.push({
          id: idBaru,
          id_siswa: x.idSiswa,
          id_mapel: nilaiPilihan.idMapel,
          id_guru: sesi.id,
          jenis: nilaiPilihan.jenis,
          nilai: x.nilai,
          tgl: new Date()
        });
        idBaru++;
      });
      localStorage.setItem('sip_nilai', JSON.stringify(daftar));

      loadModule('Input Nilai');
      showNotif(akanDisimpan.length + ' nilai berhasil disimpan', 'success');
    }

    function htmlRiwayatPengumumanKhusus() {
      const sesi = getSession();
      const daftar = _bacaArr('sip_pengumuman').filter(function(p) {
        return p && p.id !== undefined && String(p.tipe || '') === 'khusus' &&
               sesi && String(p.dari_id_user) === String(sesi.id);
      });

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada pengumuman terkirim</p>';
      }

      // Kiriman terbaru di atas
      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const siswa = _srv('siswa', 'sip_siswa');

      return daftar.map(function(p) {
        const st = String(p.status || '');
        const badge = (st === 'approved') ? { teks: 'Disetujui', kelas: 'aktif' }
                    : (st === 'rejected') ? { teks: 'Ditolak', kelas: 'merah' }
                    : { teks: 'Menunggu Kepsek', kelas: 'pending' };

        let namaSiswa = _namaDari(siswa, p.id_penerima_siswa, 'nama_lengkap');
        if (namaSiswa === '-') namaSiswa = _namaDari(siswa, p.id_penerima_siswa, 'nama');

        return '<div class="card">' +
                 '<div class="peng-head">' +
                   '<div>' +
                     '<span class="peng-nama">' + namaSiswa + '</span>' +
                     '<span class="peng-tgl">' + _tglJam(p.tgl) + '</span>' +
                   '</div>' +
                   '<span class="badge badge--' + badge.kelas + '">' + badge.teks + '</span>' +
                 '</div>' +
                 '<p class="peng-konten">' + (p.konten || '-') + '</p>' +
               '</div>';
      }).join('');
    }

    // Kirim satu pengumuman khusus. Statusnya menunggu persetujuan Kepala Sekolah.
    async function kirimPengumumanKhusus() {
      const sesi = getSession();
      const elSiswa = document.getElementById('khususSiswa');
      const elPesan = document.getElementById('khususPesan');
      if (!sesi || !elSiswa || !elPesan) return;

      if (!elSiswa.value) {
        showNotif('Siswa penerima wajib dipilih', 'error');
        return;
      }
      const konten = elPesan.value.trim();
      if (!konten) {
        showNotif('Isi pesan tidak boleh kosong', 'error');
        return;
      }

      const siswa = _srv('siswa', 'sip_siswa').find(function(s) {
        return s && String(s.id) === String(elSiswa.value);
      });
      if (!siswa) {
        showNotif('Data siswa tidak ditemukan', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('khusus-kirim', 'createPengumuman',
          { data: { tipe: 'khusus', id_penerima_siswa: siswa.id, konten: konten } },
          'guruPengKhusus', 'Mengirim');
        return;
      }

      const daftar = _bacaArr('sip_pengumuman');

      // Nomor urut memakai waktu sekarang, dinaikkan bila ternyata sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(p) { return p && Number(p.id) === idBaru; })) idBaru++;

      daftar.push({
        id: idBaru,
        dari_id_user: sesi.id,
        dari_nama: sesi.nama || '-',
        dari_role: 'guru',
        tipe: 'khusus',
        id_penerima_siswa: siswa.id,
        konten: konten,
        status: 'pending',
        tgl: new Date(),
        approved_by: ''
      });
      localStorage.setItem('sip_pengumuman', JSON.stringify(daftar));

      loadModule('Pengumuman Khusus');
      showNotif('Pengumuman terkirim. Menunggu persetujuan Kepala Sekolah.', 'success');
    }

    // Tampilkan isi modul. Modul yang belum digarap memakai penanda sementara.
    function loadModule(namaMenu) {
      const sesi = getSession();
      let isi = '<h1 class="module-title">' + namaMenu + '</h1>' +
                '<p class="module-desc">Modul dalam pengembangan.</p>';

      // Modul yang sudah punya tampilan sendiri
      if (sesi && sesi.role === 'kepsek' && namaMenu === 'Monitoring') {
        isi = kepsekMonitoring();
      } else if (sesi && sesi.role === 'kepsek' && namaMenu === 'Approve Akun') {
        isi = kepsekApproveAkun();
      } else if (sesi && sesi.role === 'kepsek' && namaMenu === 'Approve Pengumuman') {
        isi = kepsekApprovePengumuman();
      } else if (sesi && sesi.role === 'kepsek' && namaMenu === 'Approve Keuangan') {
