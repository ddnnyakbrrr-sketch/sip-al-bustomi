    // Buat akun wali murid baru, kembalikan id-nya. Null bila gagal.
    function buatAkunWaliMuridBaru() {
      const sesi = getSession();
      const elNama = document.getElementById('waliNama');
      const elEmail = document.getElementById('waliEmail');
      const elPin = document.getElementById('waliPin');
      if (!elNama || !elEmail || !elPin) return null;

      const nama = elNama.value.trim();
      if (!nama) {
        showNotif('Nama wali murid tidak boleh kosong', 'error');
        return null;
      }
      const email = elEmail.value.trim();
      if (!email) {
        showNotif('Email wali murid tidak boleh kosong', 'error');
        return null;
      }
      if (!validasiEmail(email)) {
        showNotif('Format email wali murid tidak valid', 'error');
        return null;
      }
      const pin = elPin.value.trim();
      if (!/^\d{6}$/.test(pin)) {
        showNotif('PIN wali murid harus 6 digit angka', 'error');
        return null;
      }

      const users = _bacaArr('sip_users');
      if (users.some(function(u) {
        return u && String(u.email || '').trim().toLowerCase() === email.toLowerCase();
      })) {
        showNotif('Email wali murid sudah terdaftar', 'error');
        return null;
      }

      let idBaru = Date.now();
      while (users.some(function(u) { return u && Number(u.id) === idBaru; })) idBaru++;

      // Akun wali murid dari sini langsung aktif karena dibuat bersamaan
      // dengan data anaknya oleh KTU
      users.push({
        id: idBaru,
        nama: nama,
        email: email,
        pin: pin,
        role: 'walimurid',
        subrole: '',
        aktif: true,
        dibuat_oleh: sesi ? sesi.nama : '-',
        tgl_dibuat: new Date(),
        disetujui_oleh: '',
        tgl_disetujui: null,
        token: '',
        token_expired: ''
      });
      localStorage.setItem('sip_users', JSON.stringify(users));
      return idBaru;
    }

    // Simpan satu data siswa baru berstatus pending
    async function simpanDataSiswa() {
      const sesi = getSession();
      const ambil = function(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : '';
      };

      // --- Pemeriksaan isian wajib ---
      const nis = ambil('siswaNis');
      if (!nis) { showNotif('NIS tidak boleh kosong', 'error'); return; }
      const nisn = ambil('siswaNisn');
      if (!nisn) { showNotif('NISN tidak boleh kosong', 'error'); return; }
      const nama = ambil('siswaNama');
      if (!nama) { showNotif('Nama lengkap tidak boleh kosong', 'error'); return; }
      const tglLahir = ambil('siswaTanggalLahir');
      if (!tglLahir) { showNotif('Tanggal lahir tidak boleh kosong', 'error'); return; }
      const idKelas = ambil('siswaKelas');
      if (!idKelas) { showNotif('Kelas harus dipilih', 'error'); return; }
      const hpOrtu = ambil('siswaHpOrtu');
      if (!hpOrtu) { showNotif('No HP orang tua tidak boleh kosong', 'error'); return; }

      // NIS tidak boleh dipakai dua kali
      const siswa = _bacaArr('sip_siswa');
      if (siswa.some(function(s) {
        return s && String(s.nis || '').trim().toLowerCase() === nis.toLowerCase();
      })) {
        showNotif('NIS sudah terdaftar', 'error');
        return;
      }

      // --- Akun wali murid: pilih yang ada atau buat baru ---
      const pilihanWali = ambil('siswaWali');
      let idWali = null;
      let emailWali = '';

      if (pilihanWali === '__baru__') {
        if (MODE_API) {
          // Akun wali baru dibuat lewat modul Pendaftaran Akun supaya
          // alur persetujuannya tidak terlewat
          showNotif('Buat akun wali murid lewat menu Pendaftaran Akun dulu, lalu pilih namanya di sini', 'error');
          return;
        }
        idWali = buatAkunWaliMuridBaru();
        if (idWali === null) return;   // pesan galat sudah ditampilkan
        emailWali = ambil('waliEmail');
      } else if (pilihanWali) {
        idWali = isNaN(Number(pilihanWali)) ? pilihanWali : Number(pilihanWali);
        const w = _srv('users', 'sip_users').find(function(u) {
          return u && String(u.id) === String(idWali);
        });
        emailWali = w ? (w.email || '') : '';
      }

      if (MODE_API) {
        await _kirimAksi('siswa-simpan', 'inputSiswa', { data: {
          nis: nis, nisn: nisn, nama: nama,
          nama_panggilan: ambil('siswaPanggilan'),
          tempat_lahir: ambil('siswaTempatLahir'), tanggal_lahir: tglLahir,
          jenis_kelamin: ambil('siswaJk'), agama: ambil('siswaAgama'),
          kewarganegaraan: ambil('siswaKewarganegaraan'),
          alamat_domisili: ambil('siswaAlamat'),
          id_kelas: idKelas, tahun_masuk: ambil('siswaTahunMasuk'),
          nama_ayah: ambil('siswaNamaAyah'), nama_ibu: ambil('siswaNamaIbu'),
          alamat_orangtua: ambil('siswaAlamatOrtu'), no_hp_orangtua: hpOrtu,
          id_wali_murid: idWali, email_wali_murid: emailWali
        } }, 'inputSiswa', 'Menyimpan');
        return;
      }

      let idBaru = Date.now();
      while (siswa.some(function(s) { return s && Number(s.id) === idBaru; })) idBaru++;

      siswa.push({
        id: idBaru,
        nis: nis,
        nisn: nisn,
        nama_lengkap: nama,
        nama_panggilan: ambil('siswaPanggilan'),
        tempat_lahir: ambil('siswaTempatLahir'),
        tanggal_lahir: tglLahir,
        jenis_kelamin: ambil('siswaJk'),
        agama: ambil('siswaAgama'),
        kewarganegaraan: ambil('siswaKewarganegaraan'),
        alamat_domisili: ambil('siswaAlamat'),
        id_kelas: isNaN(Number(idKelas)) ? idKelas : Number(idKelas),
        tahun_masuk: ambil('siswaTahunMasuk'),
        nama_ayah: ambil('siswaNamaAyah'),
        pekerjaan_ayah: ambil('siswaKerjaAyah'),
        penghasilan_ayah: Number(ambil('siswaHasilAyah')) || 0,
        nama_ibu: ambil('siswaNamaIbu'),
        pekerjaan_ibu: ambil('siswaKerjaIbu'),
        penghasilan_ibu: Number(ambil('siswaHasilIbu')) || 0,
        alamat_orangtua: ambil('siswaAlamatOrtu'),
        no_hp_orangtua: hpOrtu,
        jumlah_saudara: Number(ambil('siswaJumlahSaudara')) || 0,
        id_wali_murid: idWali,
        email_wali_murid: emailWali,
        status_data: 'pending',
        diinput_oleh: sesi ? sesi.nama : '-',
        tgl_input: new Date(),
        approved_by: '',
        tgl_approve: null
      });
      localStorage.setItem('sip_siswa', JSON.stringify(siswa));

      // Catat jejak aksi
      const log = _bacaArr('sip_log');
      log.push({
        aksi: 'input_data_siswa',
        siswaId: idBaru,
        nis: nis,
        nama: nama,
        waliBaru: (pilihanWali === '__baru__'),
        oleh: sesi ? sesi.nama : '-',
        timestamp: new Date()
      });
      localStorage.setItem('sip_log', JSON.stringify(log));

      // Modul digambar ulang, jadi formulir dan daftar ikut diperbarui
      loadModule('Input Data Siswa');
      showNotif('Data siswa ' + nama + ' berhasil disimpan. Menunggu verifikasi Kepala Sekolah.', 'success');
    }

    // ================= EXPORT DATA SISWA (KTU) =================

    // Urutan kolom template dan hasil ekspor, dipakai bersama keduanya
    const KOLOM_TEMPLATE_SISWA = [
      'NIS', 'NISN', 'Nama Lengkap', 'Nama Panggilan', 'Tempat Lahir', 'Tanggal Lahir',
      'Jenis Kelamin', 'Agama', 'Kewarganegaraan', 'Alamat Domisili', 'Kelas', 'Tahun Masuk',
      'Nama Ayah', 'Pekerjaan Ayah', 'Penghasilan Ayah', 'Nama Ibu', 'Pekerjaan Ibu',
      'Penghasilan Ibu', 'Alamat Orang Tua', 'No HP Orang Tua', 'Jumlah Saudara',
      'Nama Wali Murid', 'Email Wali Murid'
    ];

    // Tanggal untuk nama berkas, bentuk DD-MM-YYYY
    function _tglBerkas() {
      const d = new Date();
      const dua = function(n) { return String(n).padStart(2, '0'); };
      return dua(d.getDate()) + '-' + dua(d.getMonth() + 1) + '-' + d.getFullYear();
    }

    // Unduh berkas template XLSX yang hanya berisi baris judul kolom
    function downloadTemplate() {
      if (typeof XLSX === 'undefined') {
        showNotif('Pustaka XLSX belum termuat', 'error');
        return;
      }

      const lembar = XLSX.utils.aoa_to_sheet([KOLOM_TEMPLATE_SISWA]);
      const buku = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(buku, lembar, 'Template Siswa');
      XLSX.writeFile(buku, 'template_siswa.xlsx');

      // Penanda ini yang membuka kunci tombol ekspor
      localStorage.setItem('sip_template_downloaded', 'true');

      const sesi = getSession();
      const log = _bacaArr('sip_log');
      log.push({ aksi: 'download_template_siswa', oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      loadModule('Input Data Siswa');
      showNotif('Template berhasil di-download. Anda sekarang bisa export data.', 'success');
    }

    // Susun seluruh data siswa mengikuti urutan kolom template
    function _barisExportSiswa() {
      const kelas = _bacaArr('sip_kelas');
      const users = _bacaArr('sip_users');

      return _bacaArr('sip_siswa')
        .filter(function(s) { return s && s.id !== undefined; })
        .map(function(s) {
          const jk = String(s.jenis_kelamin || '').toUpperCase();
          return {
            'NIS': s.nis || '',
            'NISN': s.nisn || '',
            'Nama Lengkap': s.nama_lengkap || s.nama || '',
            'Nama Panggilan': s.nama_panggilan || '',
            'Tempat Lahir': s.tempat_lahir || '',
            'Tanggal Lahir': s.tanggal_lahir ? formatTanggal(s.tanggal_lahir) : '',
            'Jenis Kelamin': jk === 'L' ? 'Laki-laki' : (jk === 'P' ? 'Perempuan' : ''),
            'Agama': s.agama || '',
            'Kewarganegaraan': s.kewarganegaraan || '',
            'Alamat Domisili': s.alamat_domisili || '',
            'Kelas': _namaDari(kelas, s.id_kelas, 'nama') === '-' ? '' : _namaDari(kelas, s.id_kelas, 'nama'),
            'Tahun Masuk': s.tahun_masuk || '',
            'Nama Ayah': s.nama_ayah || '',
            'Pekerjaan Ayah': s.pekerjaan_ayah || '',
            'Penghasilan Ayah': Number(s.penghasilan_ayah) || 0,
            'Nama Ibu': s.nama_ibu || '',
            'Pekerjaan Ibu': s.pekerjaan_ibu || '',
            'Penghasilan Ibu': Number(s.penghasilan_ibu) || 0,
            'Alamat Orang Tua': s.alamat_orangtua || '',
            'No HP Orang Tua': s.no_hp_orangtua || '',
            'Jumlah Saudara': Number(s.jumlah_saudara) || 0,
            'Nama Wali Murid': _namaDari(users, s.id_wali_murid, 'nama') === '-' ? '' : _namaDari(users, s.id_wali_murid, 'nama'),
            'Email Wali Murid': s.email_wali_murid || ''
          };
        });
    }

    // Unduh seluruh data siswa dalam bentuk XLSX
    function exportDataSiswa() {
      if (localStorage.getItem('sip_template_downloaded') !== 'true') {
        showNotif('Silakan download template terlebih dahulu sebelum export data', 'error');
        return;
      }
      if (typeof XLSX === 'undefined') {
        showNotif('Pustaka XLSX belum termuat', 'error');
        return;
      }

      const baris = _barisExportSiswa();

      // Tanpa data pun berkasnya tetap dibuat, berisi baris judul saja
      const lembar = (baris.length > 0)
        ? XLSX.utils.json_to_sheet(baris, { header: KOLOM_TEMPLATE_SISWA })
        : XLSX.utils.aoa_to_sheet([KOLOM_TEMPLATE_SISWA]);

      const buku = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(buku, lembar, 'Data Siswa');
      XLSX.writeFile(buku, 'data_siswa_' + _tglBerkas() + '.xlsx');

      const sesi = getSession();
      const log = _bacaArr('sip_log');
      log.push({ aksi: 'export_data_siswa', jumlah: baris.length,
                 oleh: sesi ? sesi.nama : '-', timestamp: new Date() });
      localStorage.setItem('sip_log', JSON.stringify(log));

      showNotif('Data siswa berhasil di-export', 'success');
    }

    // Kembalikan penanda template ke keadaan semula, untuk keperluan uji coba
    function resetStatusTemplate() {
      localStorage.removeItem('sip_template_downloaded');
      loadModule('Input Data Siswa');
      showNotif('Status template dikembalikan. Download template dulu untuk export.', 'success');
    }

    // ================= MODUL JADWAL PELAJARAN (KTU) =================

    // Urutan hari dipakai untuk mengisi dropdown sekaligus mengurutkan tabel
    const HARI_JADWAL = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

    // Pastikan penyimpanan jadwal sudah ada, isinya dimulai dari daftar kosong
    function _pastikanPenyimpananJadwal() {
      if (!localStorage.getItem('sip_jadwal')) {
        localStorage.setItem('sip_jadwal', JSON.stringify([]));
      }
    }

    // Ambil daftar tahun ajaran. Bila belum ada satu pun, dibuatkan tahun
    // ajaran berjalan: bulan Juli ke atas dihitung sebagai tahun ajaran baru.
    function _pastikanTahunAjaran() {
      const tersimpan = _srv('tahunAjaran', 'sip_tahun_ajaran').filter(function(t) {
        return t && t.tahun;
      });
      if (tersimpan.length > 0) return tersimpan;

      // Pada mode server daftar kosong berarti memang belum ada isinya,
      // jadi jangan diisi contoh buatan sendiri
      if (MODE_API) return [];

      const sekarang = new Date();
      const awal = (sekarang.getMonth() >= 6) ? sekarang.getFullYear() : sekarang.getFullYear() - 1;
      const baru = [{ id: 1, tahun: awal + '/' + (awal + 1), status_aktif: true }];
      localStorage.setItem('sip_tahun_ajaran', JSON.stringify(baru));
      return baru;
    }

    // Periksa apakah jadwal baru berbenturan dengan jadwal yang sudah ada.
    // excludeId dipakai saat menyunting agar jadwal itu tidak bentrok dengan dirinya sendiri.
    function cekBentrok(id_kelas, id_guru, hari, jam_mulai, jam_selesai, excludeId) {
      const jadwal = _srv('jadwal', 'sip_jadwal').filter(function(j) {
        return j && j.id !== undefined;
      });

      for (let i = 0; i < jadwal.length; i++) {
        const j = jadwal[i];

        // Jadwal yang sedang disunting tidak ikut diperiksa
        if (excludeId !== undefined && excludeId !== null && String(j.id) === String(excludeId)) continue;

        // Beda hari tidak mungkin bentrok
        if (String(j.hari || '') !== String(hari)) continue;

        // Dua jam pelajaran beririsan bila yang baru mulai sebelum yang lama selesai
        // DAN yang baru selesai setelah yang lama mulai
        const beririsan = (String(jam_mulai) < String(j.jam_selesai || '')) &&
                          (String(jam_selesai) > String(j.jam_mulai || ''));
        if (!beririsan) continue;

        const jam = (j.jam_mulai || '-') + ' - ' + (j.jam_selesai || '-');

        // Satu kelas tidak bisa mengikuti dua pelajaran sekaligus
        if (String(j.id_kelas) === String(id_kelas)) {
          return {
            bentrok: true,
            pesan: 'Bentrok: kelas ini sudah ada ' + (j.nama_mapel || 'pelajaran lain') +
                   ' hari ' + (j.hari || '-') + ' pukul ' + jam
          };
        }

        // Satu guru tidak bisa mengajar di dua kelas sekaligus
        if (String(j.id_guru) === String(id_guru)) {
          return {
            bentrok: true,
            pesan: 'Bentrok: ' + (j.nama_guru || 'guru ini') + ' sedang mengajar di kelas ' +
                   (j.nama_kelas || '-') + ' hari ' + (j.hari || '-') + ' pukul ' + jam
          };
        }
      }

      return { bentrok: false, pesan: '' };
    }

    // Tabel jadwal untuk kelas dan tahun ajaran yang sedang dipilih
    function htmlTabelJadwal() {
      let daftar = _srv('jadwal', 'sip_jadwal').filter(function(j) {
        return j && j.id !== undefined &&
               String(j.id_kelas) === String(jadwalPilihan.idKelas) &&
               String(j.tahun_ajaran || '') === String(jadwalPilihan.tahun);
      });

      // Penyaring hari bersifat pilihan, kosong berarti semua hari
      if (jadwalPilihan.hari) {
        daftar = daftar.filter(function(j) {
          return String(j.hari || '') === jadwalPilihan.hari;
        });
      }

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada jadwal untuk kelas ini</p>';
      }

      // Senin lebih dulu, lalu jam mulai yang lebih awal.
      // Hari yang tidak dikenali ditaruh paling bawah.
      daftar.sort(function(a, b) {
        let ha = HARI_JADWAL.indexOf(a.hari); if (ha === -1) ha = 99;
        let hb = HARI_JADWAL.indexOf(b.hari); if (hb === -1) hb = 99;
        if (ha !== hb) return ha - hb;
        return String(a.jam_mulai || '').localeCompare(String(b.jam_mulai || ''));
      });

      const mapel = _bacaArr('sip_mapel');
      const guru = _bacaArr('sip_users').filter(function(u) {
        return u && String(u.role || '').toLowerCase() === 'guru';
      });

      const baris = daftar.map(function(j, urut) {
        // Nama diambil dari data master agar ikut berubah bila mapel atau guru
        // diganti namanya. Bila datanya sudah tidak ada, dipakai nama tersimpan.
        let namaMapel = _namaDari(mapel, j.id_mapel, 'nama');
        if (namaMapel === '-') namaMapel = j.nama_mapel || '-';
        let namaGuru = _namaDari(guru, j.id_guru, 'nama');
        if (namaGuru === '-') namaGuru = j.nama_guru || '-';

        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (j.hari || '-') + '</td>' +
                 '<td>' + (j.jam_mulai || '-') + '</td>' +
                 '<td>' + (j.jam_selesai || '-') + '</td>' +
                 '<td>' + namaMapel + '</td>' +
                 '<td>' + namaGuru + '</td>' +
                 '<td><div class="aksi-grup">' +
                   '<button class="btn-aksi btn-edit" onclick="editJadwal(' + j.id + ')">' +
                     '<i class="fa-solid fa-pen"></i>Edit</button>' +
                   '<button class="btn-aksi btn-hapus" onclick="hapusJadwal(' + j.id + ')">' +
                     '<i class="fa-solid fa-trash"></i>Hapus</button>' +
                 '</div></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel tabel--jadwal">' +
               '<thead><tr><th>No</th><th>Hari</th><th>Jam Mulai</th><th>Jam Selesai</th>' +
               '<th>Mata Pelajaran</th><th>Guru</th><th>Aksi</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    // Modul Jadwal Pelajaran milik KTU, mengembalikan HTML siap tampil
    function ktuJadwal() {
      if (MODE_API) return '<div id="isi-jadwal" data-muat="jadwalPelajaran"></div>';
      _pastikanPenyimpananJadwal();
      return _htmlIsiJadwal();
    }

    PEMUAT.jadwalPelajaran = function() {
      return _muatModul('isi-jadwal',
        [['getJadwal'], ['getKelas'], ['getMapel'], ['getUsers'], ['getTahunAjaran']],
        function(d) {
          _srvIsi({ jadwal: d[0], kelas: d[1], mapel: d[2], users: d[3], tahunAjaran: d[4] });
          return _htmlIsiJadwal();
        }, 'jadwalPelajaran', 4);
    };

    function _htmlIsiJadwal() {
      const kelas = _srv('kelas', 'sip_kelas').filter(function(k) { return k && k.id !== undefined; });
      kelas.sort(function(a, b) {
        return String(a.nama || '').localeCompare(String(b.nama || ''));
      });
      const tahunAjaran = _pastikanTahunAjaran();

      const judul = '<h1 class="module-title">Jadwal Pelajaran</h1>' +
                    '<p class="module-sub">Atur jadwal mingguan untuk setiap kelas</p>';

      // --- BAGIAN ATAS: pilih kelas, tahun ajaran, dan hari ---
      const opsiKelas = '<option value="">-- Pilih Kelas --</option>' +
        kelas.map(function(k) {
          const dipilih = (String(jadwalPilihan.idKelas) === String(k.id)) ? ' selected' : '';
          return '<option value="' + k.id + '"' + dipilih + '>' + (k.nama || '-') + '</option>';
        }).join('');

      const opsiTahun = '<option value="">-- Pilih Tahun Ajaran --</option>' +
        tahunAjaran.map(function(t) {
          const dipilih = (String(jadwalPilihan.tahun) === String(t.tahun)) ? ' selected' : '';
          return '<option value="' + t.tahun + '"' + dipilih + '>' + t.tahun + '</option>';
        }).join('');

      const opsiHariFilter = '<option value="">Semua Hari</option>' +
        HARI_JADWAL.map(function(h) {
          const dipilih = (jadwalPilihan.hari === h) ? ' selected' : '';
          return '<option value="' + h + '"' + dipilih + '>' + h + '</option>';
        }).join('');

      const filter =
        '<div class="card--filter">' +
          '<div class="filter-grid">' +
            '<div>' +
              '<label class="form-label" for="jadwalFilterKelas">Pilih Kelas</label>' +
              '<select id="jadwalFilterKelas" class="input">' + opsiKelas + '</select>' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="jadwalFilterTahun">Tahun Ajaran</label>' +
              '<select id="jadwalFilterTahun" class="input">' + opsiTahun + '</select>' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="jadwalFilterHari">Hari</label>' +
              '<select id="jadwalFilterHari" class="input">' + opsiHariFilter + '</select>' +
            '</div>' +
          '</div>' +
          '<div class="filter-aksi">' +
            '<button class="btn" onclick="tampilkanJadwal()">' +
              '<i class="fa-solid fa-search"></i> Tampilkan</button>' +
          '</div>' +
        '</div>';

      // Sebelum tombol Tampilkan ditekan, tabel dan formulir belum digambar
      // karena keduanya bergantung pada kelas dan tahun ajaran yang dipilih
      if (!jadwalTampil) {
        return judul + filter +
               '<div class="card">' +
                 '<p class="pesan-info">Pilih kelas dan tahun ajaran, lalu tekan Tampilkan</p>' +
               '</div>';
      }

      // --- BAGIAN TENGAH: tabel jadwal ---
      let namaKelas = _namaDari(kelas, jadwalPilihan.idKelas, 'nama');
      if (namaKelas === '-') namaKelas = '(kelas terhapus)';

      const kartuTabel =
        '<div class="card">' +
          '<h2 class="section-title">Jadwal Kelas ' + namaKelas + ' - ' + jadwalPilihan.tahun + '</h2>' +
          htmlTabelJadwal() +
        '</div>';

      // --- BAGIAN BAWAH: formulir tambah / sunting ---
      const sedang = (jadwalSedangDiedit === null) ? null :
        _bacaArr('sip_jadwal').find(function(j) {
          return j && String(j.id) === String(jadwalSedangDiedit);
        });

      const mapel = _bacaArr('sip_mapel').filter(function(m) { return m && m.id !== undefined; });
      const guru = _bacaArr('sip_users').filter(function(u) {
        return u && u.id !== undefined && String(u.role || '').toLowerCase() === 'guru';
      });

      const opsiHariForm = '<option value="">-- Pilih Hari --</option>' +
        HARI_JADWAL.map(function(h) {
          const dipilih = (sedang && sedang.hari === h) ? ' selected' : '';
          return '<option value="' + h + '"' + dipilih + '>' + h + '</option>';
        }).join('');

      const opsiMapel = _opsi(mapel, sedang ? sedang.id_mapel : '', 'nama', '-- Pilih Mata Pelajaran --');
      const opsiGuru = _opsi(guru, sedang ? sedang.id_guru : '', 'nama', '-- Pilih Guru --');

      const kartuForm =
        '<div class="card card--hijau">' +
          '<h2 class="section-title">' + (sedang ? 'Edit Jadwal' : 'Tambah Jadwal') + '</h2>' +
          '<div class="form-grid-2">' +
            '<div>' +
              '<label class="form-label" for="jadwalHari">Hari</label>' +
              '<select id="jadwalHari" class="input">' + opsiHariForm + '</select>' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="jadwalMapel">Mata Pelajaran</label>' +
              '<select id="jadwalMapel" class="input">' + opsiMapel + '</select>' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="jadwalMulai">Jam Mulai</label>' +
              '<input type="time" id="jadwalMulai" class="input" value="' +
                (sedang ? (sedang.jam_mulai || '') : '') + '">' +
            '</div>' +
            '<div>' +
              '<label class="form-label" for="jadwalSelesai">Jam Selesai</label>' +
              '<input type="time" id="jadwalSelesai" class="input" value="' +
                (sedang ? (sedang.jam_selesai || '') : '') + '">' +
            '</div>' +
            '<div class="form-penuh">' +
              '<label class="form-label" for="jadwalGuru">Guru</label>' +
              '<select id="jadwalGuru" class="input">' + opsiGuru + '</select>' +
            '</div>' +
          '</div>' +
          '<div class="filter-aksi">' +
            '<button class="btn" id="jadwal-simpan" onclick="simpanJadwal()">' +
              '<i class="fa-solid fa-save"></i> Simpan Jadwal</button>' +
            (sedang
              ? '<button class="btn btn--abu" onclick="resetFormJadwal()">' +
                  '<i class="fa-solid fa-xmark"></i> Batal</button>'
              : '') +
          '</div>' +
        '</div>';

      return judul + filter + kartuTabel + kartuForm;
    }

    // Terapkan pilihan kelas, tahun ajaran, dan hari lalu gambar ulang modul
    function tampilkanJadwal() {
      const elKelas = document.getElementById('jadwalFilterKelas');
      const elTahun = document.getElementById('jadwalFilterTahun');
      const elHari = document.getElementById('jadwalFilterHari');
      if (!elKelas || !elTahun || !elHari) return;

      if (!elKelas.value) {
        showNotif('Kelas wajib dipilih', 'error');
        return;
      }
      if (!elTahun.value) {
        showNotif('Tahun ajaran wajib dipilih', 'error');
        return;
      }

      jadwalPilihan = { idKelas: elKelas.value, tahun: elTahun.value, hari: elHari.value };
      jadwalTampil = true;
      // Pindah kelas membatalkan penyuntingan yang sedang berjalan
      jadwalSedangDiedit = null;
      loadModule('Jadwal Pelajaran');
    }

    // Kosongkan formulir sekaligus keluar dari mode sunting
    function resetFormJadwal() {
      jadwalSedangDiedit = null;
      loadModule('Jadwal Pelajaran');

      ['jadwalHari', 'jadwalMapel', 'jadwalMulai', 'jadwalSelesai', 'jadwalGuru'].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
    }

    // Simpan jadwal baru, atau perbarui jadwal yang sedang disunting
    async function simpanJadwal() {
      if (!jadwalPilihan.idKelas || !jadwalPilihan.tahun) {
        showNotif('Pilih kelas dan tahun ajaran terlebih dahulu', 'error');
        return;
      }

      const elHari = document.getElementById('jadwalHari');
      const elMapel = document.getElementById('jadwalMapel');
      const elMulai = document.getElementById('jadwalMulai');
      const elSelesai = document.getElementById('jadwalSelesai');
      const elGuru = document.getElementById('jadwalGuru');
      if (!elHari || !elMapel || !elMulai || !elSelesai || !elGuru) return;

      // Semua kolom wajib diisi
      const hari = elHari.value;
      if (!hari) {
        showNotif('Hari wajib dipilih', 'error');
        return;
      }
      const idMapel = elMapel.value;
      if (!idMapel) {
        showNotif('Mata pelajaran wajib dipilih', 'error');
        return;
      }
      const jamMulai = elMulai.value;
      if (!jamMulai) {
        showNotif('Jam mulai wajib diisi', 'error');
        return;
      }
      const jamSelesai = elSelesai.value;
      if (!jamSelesai) {
        showNotif('Jam selesai wajib diisi', 'error');
        return;
      }
      const idGuru = elGuru.value;
      if (!idGuru) {
        showNotif('Guru wajib dipilih', 'error');
        return;
      }

      // Jam ditulis "HH:mm" sehingga bisa dibandingkan langsung sebagai teks
      if (jamSelesai <= jamMulai) {
        showNotif('Jam selesai harus lebih besar dari jam mulai', 'error');
        return;
      }

      const hasil = cekBentrok(jadwalPilihan.idKelas, idGuru, hari, jamMulai, jamSelesai, jadwalSedangDiedit);
      if (hasil.bentrok) {
        showNotif(hasil.pesan, 'error');
        return;
      }

      if (MODE_API) {
        // Bentrok jadwal diperiksa ulang di server, jadi di sini cukup dikirim
        const muatan = {
          id_kelas: jadwalPilihan.idKelas, id_mapel: idMapel, id_guru: idGuru,
          hari: hari, jam_mulai: jamMulai, jam_selesai: jamSelesai,
          tahun_ajaran: jadwalPilihan.tahun
        };
        if (jadwalSedangDiedit !== null) muatan.id = jadwalSedangDiedit;
        jadwalSedangDiedit = null;
        await _kirimAksi('jadwal-simpan', 'simpanJadwal', { data: muatan }, 'jadwalPelajaran', 'Menyimpan');
        return;
      }

      const jadwal = _srv('jadwal', 'sip_jadwal');
      const namaKelas = _namaDari(_srv('kelas', 'sip_kelas'), jadwalPilihan.idKelas, 'nama');
      const namaMapel = _namaDari(_srv('mapel', 'sip_mapel'), idMapel, 'nama');
      const namaGuru = _namaDari(_srv('users', 'sip_users'), idGuru, 'nama');
      const modeEdit = (jadwalSedangDiedit !== null);

      if (modeEdit) {
        const i = jadwal.findIndex(function(j) {
          return j && String(j.id) === String(jadwalSedangDiedit);
        });
        if (i === -1) {
          showNotif('Jadwal tidak ditemukan', 'error');
          return;
        }
        jadwal[i].hari = hari;
        jadwal[i].jam_mulai = jamMulai;
        jadwal[i].jam_selesai = jamSelesai;
        jadwal[i].id_mapel = idMapel;
        jadwal[i].nama_mapel = namaMapel;
        jadwal[i].id_guru = idGuru;
        jadwal[i].nama_guru = namaGuru;
      } else {
        // Nomor urut memakai waktu sekarang, dinaikkan bila ternyata sudah terpakai
        let idBaru = Date.now();
        while (jadwal.some(function(j) { return j && Number(j.id) === idBaru; })) idBaru++;

        jadwal.push({
          id: idBaru,
          id_kelas: jadwalPilihan.idKelas,
          nama_kelas: namaKelas,
          tahun_ajaran: jadwalPilihan.tahun,
          hari: hari,
          jam_mulai: jamMulai,
          jam_selesai: jamSelesai,
          id_mapel: idMapel,
          nama_mapel: namaMapel,
          id_guru: idGuru,
          nama_guru: namaGuru
        });
      }

      localStorage.setItem('sip_jadwal', JSON.stringify(jadwal));

      // resetFormJadwal sekaligus menggambar ulang tabelnya
      resetFormJadwal();
      showNotif(modeEdit ? 'Jadwal berhasil diperbarui' : 'Jadwal berhasil ditambahkan', 'success');
    }

    // Simpan event baru dengan status menunggu persetujuan Kepala Sekolah
    async function simpanEvent() {
      const elNama = document.getElementById('eventNama');
      const elJenis = document.getElementById('eventJenis');
      const elMulai = document.getElementById('eventMulai');
      const elSelesai = document.getElementById('eventSelesai');
      const elDeskripsi = document.getElementById('eventDeskripsi');
      const elTarget = document.getElementById('eventTarget');
      if (!elNama || !elJenis || !elMulai || !elSelesai || !elDeskripsi || !elTarget) return;

      const nama = elNama.value.trim();
      if (!nama) {
        showNotif('Nama event tidak boleh kosong', 'error');
        return;
      }
      const jenis = elJenis.value;
      if (!jenis) {
        showNotif('Jenis event wajib dipilih', 'error');
        return;
      }
      const mulai = elMulai.value;
      if (!mulai) {
        showNotif('Tanggal mulai wajib diisi', 'error');
        return;
      }
      const selesai = elSelesai.value;
      if (!selesai) {
        showNotif('Tanggal selesai wajib diisi', 'error');
        return;
      }
      const deskripsi = elDeskripsi.value.trim();
      if (!deskripsi) {
        showNotif('Deskripsi tidak boleh kosong', 'error');
        return;
      }

      // Tanggal ditulis YYYY-MM-DD sehingga bisa dibandingkan langsung sebagai teks
      if (selesai < mulai) {
        showNotif('Tanggal selesai tidak boleh lebih awal dari tanggal mulai', 'error');
        return;
      }

      if (MODE_API) {
        await _kirimAksi('event-simpan', 'simpanEvent', { data: {
          nama_event: nama, jenis: jenis, tgl_mulai: mulai,
          tgl_selesai: selesai, deskripsi: deskripsi, target: elTarget.value
        } }, 'eventKtu', 'Menyimpan');
        return;
      }

      const sesi = getSession();
      const daftar = _srv('event', 'sip_event');

      // Nomor urut memakai waktu sekarang, dinaikkan bila ternyata sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(e) { return e && Number(e.id) === idBaru; })) idBaru++;

      daftar.push({
        id: idBaru,
        nama_event: nama,
        jenis: jenis,
        tgl_mulai: mulai,
        tgl_selesai: selesai,
        deskripsi: deskripsi,
        target: elTarget.value,
        dibuat_oleh: sesi ? sesi.nama : '-',
        status_approval: 'pending',
        tgl_dibuat: new Date(),
        approved_by: ''
      });
      localStorage.setItem('sip_event', JSON.stringify(daftar));

      // Event baru selalu masuk daftar pending, jadi tabnya ikut dipindah ke sana
      tabEvent = 'pending';
      loadModule('Event');
      showNotif('Event berhasil disimpan. Menunggu persetujuan Kepala Sekolah.', 'success');
    }

              '<textarea id="arsipKeterangan" class="input input--rows" rows="2" ' +
                'placeholder="Boleh dikosongkan"></textarea>' +
            '</div>' +
          '</div>' +
          '<button class="btn btn--full" id="arsip-simpan" onclick="uploadDokumen()">' +
            '<i class="fa-solid fa-upload"></i> Upload Dokumen</button>' +
        '</div>';

      const opsiFilterKategori = '<option value="">Semua Kategori</option>' +
        KATEGORI_ARSIP.map(function(k) {
          const dipilih = (arsipFilter.kategori === k.nilai) ? ' selected' : '';
          return '<option value="' + k.nilai + '"' + dipilih + '>' + k.teks + '</option>';
        }).join('');

      const penyaring =
        '<div class="cari-grid-2">' +
          '<div>' +
            '<label class="form-label" for="cariArsip">Cari Judul</label>' +
            '<input type="search" id="cariArsip" class="input" placeholder="Cari judul dokumen..." ' +
              'value="' + String(arsipFilter.cari || '') + '" oninput="filterArsip()">' +
          '</div>' +
          '<div>' +
            '<label class="form-label" for="filterKategoriArsip">Kategori</label>' +
            '<select id="filterKategoriArsip" class="input" onchange="filterArsip()">' +
              opsiFilterKategori + '</select>' +
          '</div>' +
        '</div>';

      return '<h1 class="module-title">Surat Menyurat &amp; Arsip Digital</h1>' +
             '<p class="module-sub">Upload dan kelola dokumen penting pesantren</p>' +
             form +
             '<div class="card">' +
               '<h2 class="section-title">Daftar Arsip</h2>' +
               penyaring +
               '<div id="daftar-arsip">' + htmlDaftarArsip() + '</div>' +
             '</div>';
    }

    // Saring daftar arsip setiap kali isian penyaring berubah.
    // Hanya bagian daftarnya yang digambar ulang supaya kursor tidak lompat
    // keluar dari kolom pencarian dan berkas yang sudah dipilih tidak hilang.
    function filterArsip() {
      const elCari = document.getElementById('cariArsip');
      const elKategori = document.getElementById('filterKategoriArsip');
      const wadah = document.getElementById('daftar-arsip');
      if (!elCari || !elKategori || !wadah) return;

      arsipFilter = { cari: elCari.value, kategori: elKategori.value };
      wadah.innerHTML = htmlDaftarArsip();
    }

    // Simpan satu dokumen baru. Untuk demo, yang dicatat hanya nama berkasnya.
    async function uploadDokumen() {
      const elJudul = document.getElementById('arsipJudul');
      const elKategori = document.getElementById('arsipKategori');
      const elFile = document.getElementById('arsipFile');
      const elAkses = document.getElementById('arsipAkses');
      const elKeterangan = document.getElementById('arsipKeterangan');
      if (!elJudul || !elKategori || !elFile || !elAkses || !elKeterangan) return;

      const judul = elJudul.value.trim();
      if (!judul) {
        showNotif('Judul dokumen tidak boleh kosong', 'error');
        return;
      }
      const kategori = elKategori.value;
      if (!kategori) {
        showNotif('Kategori wajib dipilih', 'error');
        return;
      }
      if (!elFile.files || elFile.files.length === 0) {
        showNotif('File dokumen wajib dipilih', 'error');
        return;
      }
      const akses = elAkses.value;
      if (!akses) {
        showNotif('Hak akses wajib dipilih', 'error');
        return;
      }

      if (MODE_API) {
        // Isi berkasnya sendiri belum diunggah; yang dicatat adalah keterangannya
        await _kirimAksi('arsip-simpan', 'simpanArsip', { data: {
          judul: judul, kategori: kategori,
          nama_file: elFile.files[0].name, akses: akses
        } }, 'arsipKtu', 'Menyimpan');
        return;
      }

      const sesi = getSession();
      const daftar = _srv('arsip', 'sip_arsip');

      // Nomor urut memakai waktu sekarang, dinaikkan bila ternyata sudah terpakai
      let idBaru = Date.now();
      while (daftar.some(function(d) { return d && Number(d.id) === idBaru; })) idBaru++;

      daftar.push({
        id: idBaru,
        judul: judul,
        kategori: kategori,
        nama_file: elFile.files[0].name,
        ukuran: '-',
        akses: akses,
        keterangan: elKeterangan.value.trim(),
        diupload_oleh: sesi ? sesi.nama : '-',
        tgl_upload: new Date()
      });
      localStorage.setItem('sip_arsip', JSON.stringify(daftar));

      // Menggambar ulang modul sekaligus mengosongkan seluruh isian formulir
      loadModule('Arsip');
      showNotif('Dokumen berhasil diupload', 'success');
    }

    // Popup rincian satu dokumen
    function lihatDetailArsip(id) {

        return x && String(x.id) === String(id);

          '<div class="detail-section"><h4>Informasi Dokumen</h4><div class="detail-grid">' +

    function tutupDetailArsip() {

    // Hapus satu dokumen dari arsip
    async function hapusDokumen(id) {
      if (MODE_API) {
        if (!confirm('Hapus dokumen ini?')) return;
        await _kirimAksi('arsip-hapus-' + id, 'hapusArsip', { idArsip: id }, 'arsipKtu', 'Menghapus');
        return;
      }

      const daftar = _srv('arsip', 'sip_arsip');
      const i = daftar.findIndex(function(d) { return d && String(d.id) === String(id); });
      if (i === -1) {
        showNotif('Dokumen tidak ditemukan', 'error');
        return;
      }

      if (!confirm('Hapus dokumen ini?')) return;

      daftar.splice(i, 1);
      localStorage.setItem('sip_arsip', JSON.stringify(daftar));

      // Popup rincian ikut ditutup bila yang dihapus sedang dibuka
      tutupDetailArsip();

      const wadah = document.getElementById('daftar-arsip');
      if (wadah) wadah.innerHTML = htmlDaftarArsip();
      else loadModule('Arsip');

      showNotif('Dokumen berhasil dihapus', 'success');
    }

    // ================= MODUL APPROVE DATA WALI MURID (KTU) =================

    // Tiga kolom yang boleh diajukan perubahannya oleh wali murid
    const KOLOM_PERMOHONAN = [
      { teks: 'No HP',  lama: 'no_hp_lama',  baru: 'no_hp_baru',  simpan: 'no_hp' },
      { teks: 'Email',  lama: 'email_lama',  baru: 'email_baru',  simpan: 'email' },
      { teks: 'Alamat', lama: 'alamat_lama', baru: 'alamat_baru', simpan: 'alamat' }
    ];

    // Kumpulkan kolom yang isinya benar-benar berbeda antara data lama dan baru
    function _perubahanPermohonan(p) {
      return KOLOM_PERMOHONAN.filter(function(k) {
        const lama = String(p[k.lama] === undefined || p[k.lama] === null ? '' : p[k.lama]).trim();
        const baru = String(p[k.baru] === undefined || p[k.baru] === null ? '' : p[k.baru]).trim();
        return baru !== '' && baru !== lama;
      });
    }

    // Ambil nomor HP dan alamat wali murid. Keduanya belum tentu tersimpan pada
    // akun, jadi bila kosong diambil dari data anaknya seperti pada Data Master.
    function _kontakWali(u) {
      let noHp = String(u.no_hp || '').trim();
      let alamat = String(u.alamat || '').trim();
      if (noHp === '' || alamat === '') {
        const anak = _bacaArr('sip_siswa').filter(function(s) {
          return s && String(s.id_wali_murid) === String(u.id);
        });
        for (let i = 0; i < anak.length; i++) {
          if (noHp === '' && anak[i].no_hp_orangtua) noHp = String(anak[i].no_hp_orangtua);
          if (alamat === '' && anak[i].alamat_orangtua) alamat = String(anak[i].alamat_orangtua);
        }
      }
      return { no_hp: noHp, alamat: alamat };
    }

    // Siapkan penyimpanan permohonan. Bila belum pernah dibuat, diisi contoh
    // permohonan untuk uji coba, satu untuk tiap wali murid, paling banyak dua.
    function _pastikanPermohonanWali() {
      if (localStorage.getItem('sip_permohonan_wali')) return;

      const wali = _bacaArr('sip_users').filter(function(u) {
        return u && u.id !== undefined && String(u.role || '').toLowerCase() === 'walimurid';
      }).slice(0, 2);

      const contoh = wali.map(function(u, urut) {
        const kontak = _kontakWali(u);
        const email = String(u.email || '');

        // Permohonan pertama mengubah nomor HP dan email, alamatnya tetap.
        // Permohonan kedua hanya mengubah nomor HP.
        const gantiEmail = (urut === 0);
        return {
          id: Date.now() + urut,
          id_user: u.id,
          nama: u.nama || '-',
          email_lama: email,
          email_baru: gantiEmail ? email.replace('@', '.baru@') : email,
          no_hp_lama: kontak.no_hp,
          no_hp_baru: (urut === 0) ? '081399887766' : '085712345678',
          alamat_lama: kontak.alamat,
          alamat_baru: kontak.alamat,
          status: 'pending',
          tgl_permohonan: new Date(Date.now() - (urut + 1) * 3600000),
          approved_by: '',
          tgl_approve: null
        };
      });

      localStorage.setItem('sip_permohonan_wali', JSON.stringify(contoh));
    }

    // Daftar permohonan yang masih menunggu keputusan KTU
    function htmlPermohonanPending() {
      const pending = _srv('permohonanWali', 'sip_permohonan_wali').filter(function(p) {
        return p && p.id !== undefined && String(p.status || '') === 'pending';
      });

      if (pending.length === 0) {
        return '<div class="card kosong-card">' +
                 '<i class="fa-solid fa-check-circle kosong-ikon"></i>' +
                 '<span class="kosong-teks">Tidak ada permohonan perubahan data</span>' +
               '</div>';
      }

      // Permohonan paling baru tampil di atas
      pending.sort(function(a, b) {
        const selisih = new Date(b.tgl_permohonan) - new Date(a.tgl_permohonan);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const baris = pending.map(function(p, urut) {
        const ubah = _perubahanPermohonan(p);
        const ringkas = (ubah.length > 0)
          ? ubah.map(function(k) { return k.teks; }).join(', ')
          : 'Tidak ada perubahan';

        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (p.nama || '-') + '</td>' +
                 '<td class="sel-copy">' + (p.email_lama || '-') + '</td>' +
                 '<td>' + _tglJam(p.tgl_permohonan) + '</td>' +
                 '<td>' + ringkas + '</td>' +
                 '<td><div class="aksi-grup">' +
                   '<button class="btn-aksi btn-detail" title="Lihat detail" ' +
                     'onclick="lihatDetailPermohonan(' + p.id + ')">' +
                     '<i class="fa-solid fa-eye"></i></button>' +
                   '<button class="btn-aksi btn-setujui" id="wali-setuju-' + p.id + '" onclick="setujuiPerubahan(' + p.id + ')">' +
                     '<i class="fa-solid fa-check"></i>Setujui</button>' +
                   '<button class="btn-aksi btn-hapus" id="wali-tolak-' + p.id + '" onclick="tolakPerubahan(' + p.id + ')">' +
                     '<i class="fa-solid fa-xmark"></i>Tolak</button>' +
                 '</div></td>' +
               '</tr>';
      }).join('');

      return '<div class="card">' +
               '<h2 class="section-title">Permohonan Menunggu Persetujuan</h2>' +
               '<div class="tabel-wrap"><table class="tabel tabel--permohonan">' +
                 '<thead><tr><th>No</th><th>Nama Wali Murid</th><th>Email</th>' +
                 '<th>Tanggal Permohonan</th><th>Data yang Diubah</th><th>Aksi</th></tr></thead>' +
                 '<tbody>' + baris + '</tbody></table></div>' +
             '</div>';
    }

    // Riwayat permohonan yang sudah diproses, disaring sesuai tab yang dibuka
    function htmlRiwayatPermohonan(tab) {
      const daftar = _srv('permohonanWali', 'sip_permohonan_wali').filter(function(p) {
        return p && p.id !== undefined && String(p.status || '') === tab;
      });

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada riwayat</p>';
      }

      // Yang paling baru diproses tampil di atas
      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl_approve) - new Date(a.tgl_approve);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const disetujui = (tab === 'approved');
      const baris = daftar.map(function(p, urut) {
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + (p.nama || '-') + '</td>' +
                 '<td>' + _tglJam(p.tgl_permohonan) + '</td>' +
                 '<td>' + _tglJam(p.tgl_approve) + '</td>' +
                 '<td>' + (p.approved_by || '-') + '</td>' +
                 '<td><span class="badge badge--' + (disetujui ? 'aktif' : 'merah') + '">' +
                   (disetujui ? 'Disetujui' : 'Ditolak') + '</span></td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel">' +
               '<thead><tr><th>No</th><th>Nama</th><th>Tanggal Permohonan</th>' +
               '<th>Tanggal Diproses</th><th>Diproses Oleh</th><th>Status</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    // Modul Approve Data Wali Murid milik KTU, mengembalikan HTML siap tampil
    function ktuApproveWaliMurid() {
      const kepala = '<h1 class="module-title">Approve Perubahan Data Wali Murid</h1>' +

    // Popup rincian satu permohonan, berisi perbandingan data lama dan baru
    function lihatDetailPermohonan(id) {
      const p = _bacaArr('sip_permohonan_wali').find(function(x) {

    // Ambil satu permohonan yang masih pending beserta posisinya di dalam array
    function _permohonanPending(id) {
      const daftar = _bacaArr('sip_permohonan_wali');
      const i = daftar.findIndex(function(p) { return p && String(p.id) === String(id); });
      if (i === -1) {
        showNotif('Permohonan tidak ditemukan', 'error');
        return null;
      }
      if (String(daftar[i].status || '') !== 'pending') {
        showNotif('Permohonan ini sudah diproses', 'error');
        return null;
      }
      return { daftar: daftar, i: i };
    }

    // Setujui perubahan: data akun wali murid ikut diperbarui
    async function setujuiPerubahan(id) {
      if (MODE_API) {
        await _kirimAksi('wali-setuju-' + id, 'prosesPermohonanWali',
          { idPermohonan: id, status: 'approved' }, 'approveWali', 'Menyetujui');
        return;
      }

      const ambil = _permohonanPending(id);
      if (!ambil) return;

      const daftar = ambil.daftar;
      const p = daftar[ambil.i];
      const ubah = _perubahanPermohonan(p);

      const users = _bacaArr('sip_users');
      const iu = users.findIndex(function(u) { return u && String(u.id) === String(p.id_user); });
      if (iu === -1) {
        showNotif('Akun wali murid tidak ditemukan', 'error');
        return;
      }

      // Email dipakai untuk login, jadi tidak boleh sama dengan akun lain
      const gantiEmail = ubah.some(function(k) { return k.simpan === 'email'; });
      if (gantiEmail) {
        const emailBaru = String(p.email_baru || '').trim().toLowerCase();
        const bentrok = users.some(function(u, idx) {
          return u && idx !== iu && String(u.email || '').trim().toLowerCase() === emailBaru;
        });
        if (bentrok) {
          showNotif('Email ' + p.email_baru + ' sudah dipakai akun lain', 'error');
          return;
        }
      }

      // Hanya kolom yang berubah yang ditimpa, supaya isian lain tidak terhapus
      ubah.forEach(function(k) { users[iu][k.simpan] = p[k.baru]; });
      localStorage.setItem('sip_users', JSON.stringify(users));

      const sesi = getSession();
      p.status = 'approved';
      p.approved_by = sesi ? sesi.nama : '-';
      p.tgl_approve = new Date();
      localStorage.setItem('sip_permohonan_wali', JSON.stringify(daftar));

      tutupDetailPermohonan();
      tabRiwayatWali = 'approved';
      loadModule('Approve Data Wali Murid');
      showNotif('Perubahan data ' + (p.nama || '-') + ' disetujui', 'success');
    }

    // Tolak perubahan: data akun wali murid dibiarkan seperti semula
    async function tolakPerubahan(id) {
      if (MODE_API) {
        if (!confirm('Tolak permohonan ini?')) return;
        await _kirimAksi('wali-tolak-' + id, 'prosesPermohonanWali',
          { idPermohonan: id, status: 'rejected' }, 'approveWali', 'Menolak');
        return;
      }

      const ambil = _permohonanPending(id);
      if (!ambil) return;

      if (!confirm('Tolak permohonan perubahan data ini?')) return;

      const daftar = ambil.daftar;
      const p = daftar[ambil.i];
      const sesi = getSession();
      p.status = 'rejected';
      p.approved_by = sesi ? sesi.nama : '-';
      p.tgl_approve = new Date();
      localStorage.setItem('sip_permohonan_wali', JSON.stringify(daftar));

      tutupDetailPermohonan();
      tabRiwayatWali = 'rejected';
      loadModule('Approve Data Wali Murid');
      showNotif('Permohonan ' + (p.nama || '-') + ' ditolak', 'success');
    }

    // ================= MODUL DATA ANAK (WALI MURID) =================

    // Penyimpanan yang dibaca modul wali murid, dibuat kosong bila belum ada
    function _pastikanPenyimpananAnak() {
      ['sip_siswa', 'sip_kelas', 'sip_jadwal', 'sip_absensi',
       'sip_nilai', 'sip_mapel', 'sip_pengumuman'].forEach(function(kunci) {
        if (!localStorage.getItem(kunci)) {
          localStorage.setItem(kunci, JSON.stringify([]));
        }
      });
    }

    // Daftar anak milik wali murid yang sedang masuk, diurutkan menurut nama
    function _anakSaya() {
      const sesi = getSession();
      if (!sesi) return [];

      // Daftar dari server sudah dikunci pada anak milik wali murid yang
      // sedang masuk, dan barisnya tidak membawa kolom id_wali_murid.
      // Menyaringnya lagi di sini justru akan mengosongkan daftarnya.
      const dariServer = Array.isArray(SRV.anak);

      const anak = _srv('anak', 'sip_siswa').filter(function(s) {
        if (!s || s.id === undefined) return false;
        return dariServer || String(s.id_wali_murid) === String(sesi.id);
      });
      anak.sort(function(a, b) {
        return String(a.nama_lengkap || a.nama || '').localeCompare(String(b.nama_lengkap || b.nama || ''));
      });
      return anak;
    }

    // Pilih anak yang sedang dibuka. Bila pilihan lama sudah tidak ada
    // di daftar, dikembalikan ke anak pertama.
    function _anakTerpilih(daftar, pilihan) {
      const ada = daftar.some(function(s) { return String(s.id) === String(pilihan); });
      if (ada) return String(pilihan);
      return daftar.length > 0 ? String(daftar[0].id) : '';
    }

    // Huruf depan dari maksimal dua kata pertama pada nama
    function _inisial(nama) {
      const kata = String(nama || '').trim().split(/\s+/).filter(Boolean);
      if (kata.length === 0) return '?';
      return (kata[0].charAt(0) + (kata[1] ? kata[1].charAt(0) : '')).toUpperCase();
    }

    // Kartu profil singkat berlatar tosca muda
    function htmlProfilSingkat(siswa) {
      const namaKelas = _namaDari(_srv('kelas', 'sip_kelas'), siswa.id_kelas, 'nama');
      const nama = siswa.nama_lengkap || siswa.nama || '-';

      return '<div class="card profil-anak">' +
               '<div class="profil-inisial">' + _inisial(nama) + '</div>' +
               '<div>' +
                 '<span class="profil-nama">' + nama + '</span>' +
                 '<span class="profil-nomor">NIS ' + (siswa.nis || '-') +
                   ' &middot; NISN ' + (siswa.nisn || '-') + '</span>' +
                 '<span class="badge badge--kelas">' +
                   (namaKelas === '-' ? 'Belum ada kelas' : namaKelas) + '</span>' +
               '</div>' +
             '</div>';
    }

    // Jadwal pelajaran kelas yang ditempati anak
    function htmlJadwalAnak(idKelas) {
      const daftar = _srv('jadwal', 'sip_jadwal').filter(function(j) {
        return j && j.id !== undefined && idKelas !== undefined && idKelas !== null &&
               String(j.id_kelas) === String(idKelas);
      });

      if (daftar.length === 0) {
        return '<p class="pesan-info">Jadwal belum tersedia</p>';
      }

      // Senin lebih dulu, lalu jam mulai yang lebih awal
      daftar.sort(function(a, b) {
        let ha = HARI_JADWAL.indexOf(a.hari); if (ha === -1) ha = 99;
        let hb = HARI_JADWAL.indexOf(b.hari); if (hb === -1) hb = 99;
        if (ha !== hb) return ha - hb;
        return String(a.jam_mulai || '').localeCompare(String(b.jam_mulai || ''));
      });

      const mapel = _srv('mapel', 'sip_mapel');

      // Daftar guru tidak ikut terbawa getBekalDataAnak karena wali murid
      // memang tidak berhak membaca data pengguna. Namanya dipakai apa adanya
      // dari baris jadwal; kalau kosong ya ditulis '-', bukan ditebak dari
      // penyimpanan peramban yang isinya data contoh.
      const guru = SRV.jadwal ? [] : _bacaArr('sip_users').filter(function(u) {
        return u && String(u.role || '').toLowerCase() === 'guru';
      });

      const baris = daftar.map(function(j) {
        // Nama dibaca dari data master agar ikut berubah bila diganti
        let namaMapel = _namaDari(mapel, j.id_mapel, 'nama');
        if (namaMapel === '-') namaMapel = j.nama_mapel || '-';
        let namaGuru = _namaDari(guru, j.id_guru, 'nama');
        if (namaGuru === '-') namaGuru = j.nama_guru || '-';

        return '<tr>' +
                 '<td>' + (j.hari || '-') + '</td>' +
                 '<td>' + (j.jam_mulai || '-') + ' - ' + (j.jam_selesai || '-') + '</td>' +
                 '<td>' + namaMapel + '</td>' +
                 '<td>' + namaGuru + '</td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel">' +
               '<thead><tr><th>Hari</th><th>Jam</th><th>Mata Pelajaran</th><th>Guru</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    // Kehadiran anak selama tujuh hari terakhir
    function htmlAbsensiAnak(idSiswa) {
      // Batas bawah: pukul 00:00 enam hari yang lalu, sehingga hari ini ikut terhitung
      const batas = new Date();
      batas.setHours(0, 0, 0, 0);
      batas.setDate(batas.getDate() - 6);

      const daftar = _srv('absensi', 'sip_absensi').filter(function(a) {
        if (!a || String(a.id_siswa) !== String(idSiswa)) return false;
        const t = new Date(a.tgl);
        return !isNaN(t.getTime()) && t >= batas;
      });

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada data absensi</p>';
      }

      // Dibaca dari kiri ke kanan menurut urutan hari
      daftar.sort(function(a, b) { return new Date(a.tgl) - new Date(b.tgl); });

      const warna = { hadir: 'hadir', izin: 'izin', sakit: 'sakit', alpha: 'alpha' };
      const item = daftar.map(function(a) {
        const st = String(a.status || '').toLowerCase();
        const kelas = warna[st] || 'nonaktif';
        const teks = st ? st.charAt(0).toUpperCase() + st.slice(1) : '-';
        return '<div class="absensi-item">' +
                 '<span class="absensi-tgl">' + formatTanggal(a.tgl) + '</span>' +
                 '<span class="badge badge--' + kelas + '">' + teks + '</span>' +
               '</div>';
      }).join('');

      return '<div class="absensi-list">' + item + '</div>';
    }

    // Sepuluh nilai terbaru milik anak
    function htmlNilaiAnak(idSiswa) {
      const daftar = _srv('nilai', 'sip_nilai').filter(function(n) {
        return n && String(n.id_siswa) === String(idSiswa);
      });

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada data nilai</p>';
      }

      // Nilai terbaru di atas
      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const mapel = _srv('mapel', 'sip_mapel');
      const baris = daftar.slice(0, 10).map(function(n, urut) {
        const jenis = String(n.jenis || '');
        return '<tr>' +
                 '<td>' + (urut + 1) + '</td>' +
                 '<td>' + _namaDari(mapel, n.id_mapel, 'nama') + '</td>' +
                 '<td>' + (jenis ? jenis.charAt(0).toUpperCase() + jenis.slice(1) : '-') + '</td>' +
                 '<td>' + (n.nilai === undefined || n.nilai === null || n.nilai === '' ? '-' : n.nilai) + '</td>' +
                 '<td>' + formatTanggal(n.tgl) + '</td>' +
               '</tr>';
      }).join('');

      return '<div class="tabel-wrap"><table class="tabel">' +
               '<thead><tr><th>No</th><th>Mata Pelajaran</th><th>Jenis</th>' +
               '<th>Nilai</th><th>Tanggal</th></tr></thead>' +
               '<tbody>' + baris + '</tbody></table></div>';
    }

    // Seluruh isi data satu anak: profil, identitas, akademik, jadwal, absensi, nilai
    function htmlDataAnak(idSiswa) {
      const s = _srv('anak', 'sip_siswa').find(function(x) {
        return x && String(x.id) === String(idSiswa);
      });
      if (!s) return '<p class="pesan-info">Data anak tidak ditemukan</p>';

      const isi = function(nilai) {
        return (nilai === undefined || nilai === null || String(nilai).trim() === '') ? '-' : nilai;
      };
      const item = function(label, nilai, penuh) {
        return '<div class="detail-item' + (penuh ? ' detail-item--full' : '') + '">' +
                 '<span class="detail-label">' + label + '</span>' +
                 '<span class="detail-nilai">' + nilai + '</span>' +
               '</div>';
      };

      const jk = String(s.jenis_kelamin || '').toUpperCase();
      const namaKelas = _namaDari(_srv('kelas', 'sip_kelas'), s.id_kelas, 'nama');
      const terverifikasi = String(s.status_data || '').toLowerCase() === 'approved';

      const identitas =
        '<div class="card">' +
          '<h2 class="section-title">Data Identitas</h2>' +
          '<div class="detail-grid">' +
            item('Nama Lengkap', isi(s.nama_lengkap || s.nama)) +
            item('Nama Panggilan', isi(s.nama_panggilan)) +
            item('NIS', isi(s.nis)) +
            item('NISN', isi(s.nisn)) +
            item('Tempat Lahir', isi(s.tempat_lahir)) +
            item('Tanggal Lahir', formatTanggal(s.tanggal_lahir)) +
            item('Jenis Kelamin', jk === 'L' ? 'Laki-laki' : (jk === 'P' ? 'Perempuan' : '-')) +
            item('Agama', isi(s.agama)) +
            item('Kewarganegaraan', isi(s.kewarganegaraan)) +
            item('Alamat Domisili', isi(s.alamat_domisili), true) +
          '</div>' +
        '</div>';

      const akademik =
        '<div class="card">' +
          '<h2 class="section-title">Data Akademik</h2>' +
          '<div class="detail-grid">' +
            item('Kelas', namaKelas === '-' ? 'Belum ada kelas' : namaKelas) +
            item('Tahun Masuk', isi(s.tahun_masuk)) +
            item('Status Data', '<span class="badge badge--' + (terverifikasi ? 'aktif' : 'pending') + '">' +
              (terverifikasi ? 'Terverifikasi' : 'Menunggu Verifikasi') + '</span>', true) +
          '</div>' +
        '</div>';

      return htmlProfilSingkat(s) +
             identitas +
             akademik +
             '<div class="card"><h2 class="section-title">Jadwal Pelajaran</h2>' +
               htmlJadwalAnak(s.id_kelas) + '</div>' +
             '<div class="card"><h2 class="section-title">Absensi 7 Hari Terakhir</h2>' +
               htmlAbsensiAnak(s.id) + '</div>' +
             '<div class="card"><h2 class="section-title">Nilai Terbaru</h2>' +
               htmlNilaiAnak(s.id) + '</div>';
    }

    // Modul Data Anak milik Wali Murid, mengembalikan HTML siap tampil
    function waliMuridDataAnak() {
      const judul = '<h1 class="module-title">Data Anak Saya</h1>' +
                    '<p class="module-sub">Informasi lengkap putra/putri Anda</p>';

      // Enam daftar sekaligus dijemput dari server lewat satu panggilan
      if (MODE_API) return judul + '<div id="isi-data-anak" data-muat="dataAnak"></div>';

      _pastikanPenyimpananAnak();
      return judul + _htmlIsiDataAnak();
    }

    // Tab anak beserta rincian anak yang sedang dibuka.
    // Dipakai jalur server maupun jalur localStorage.
    function _htmlIsiDataAnak() {
      const anak = _anakSaya();

      // Belum ada satu pun anak yang terdaftar atas nama akun ini
      if (anak.length === 0) {
        return '<div class="card kosong-card">' +
                 '<i class="fa-solid fa-child kosong-ikon"></i>' +
                 '<span class="kosong-teks">Belum ada data anak yang terdaftar</span>' +
                 '<span class="kosong-sub">Silakan hubungi pihak pesantren untuk ' +
                   'mendaftarkan data putra/putri Anda</span>' +
               '</div>';
      }

      anakAktif = _anakTerpilih(anak, anakAktif);

      // Tab hanya dipasang bila anaknya lebih dari satu.
      // Berpindah anak cukup menggambar ulang, datanya sudah ada di tangan.
      let tab = '';
      if (anak.length > 1) {
        tab = '<div class="tab-bar tab-bar--scroll">' +
          anak.map(function(s) {
            const aktif = (String(s.id) === String(anakAktif)) ? ' active' : '';
            return '<button class="tab-btn' + aktif + '" ' +
                   'onclick="gantiAnakData(\'' + s.id + '\')">' +
                   '<i class="fa-solid fa-child"></i> ' +
                   _aman(s.nama_panggilan || s.nama_lengkap || s.nama || '-') + '</button>';
          }).join('') + '</div>';
      }

      return tab + htmlDataAnak(anakAktif);
    }

    // Satu panggilan membawa anak, kelas, mapel, jadwal, absensi, dan nilai
    PEMUAT.dataAnak = function() {
      return _muatModul('isi-data-anak', [['getBekalDataAnak']], function(d) {
        _srvIsi(d[0]);
        return _htmlIsiDataAnak();
      }, 'dataAnak', 4);
    };

    // Pindah anak tanpa menjemput ulang ke server
    function gantiAnakData(id) {
      anakAktif = String(id);
      const wadah = document.getElementById('isi-data-anak');
      if (!wadah || !SRV.anak) { loadModule('Data Anak'); return; }
      wadah.innerHTML = _htmlIsiDataAnak();
    }

    // ================= MODUL PESAN WALI KELAS (WALI MURID) =================

    // Pengumuman khusus yang sudah disetujui Kepala Sekolah untuk satu anak.
    // Pengumuman pending atau ditolak sengaja tidak ikut terbawa.
    function htmlPesanWaliKelas(idSiswa) {
      const anak = _srv('anak', 'sip_siswa').find(function(s) {
        return s && String(s.id) === String(idSiswa);
      });

      const daftar = _srv('pengumuman', 'sip_pengumuman').filter(function(p) {
        return p && String(p.tipe || '') === 'khusus' &&
               String(p.status || '') === 'approved' &&
               idSiswa !== '' && String(p.id_penerima_siswa) === String(idSiswa);
      });

      if (daftar.length === 0) {
        return '<div class="card kosong-card">' +
                 '<i class="fa-solid fa-inbox kosong-ikon"></i>' +
                 '<span class="kosong-teks">Tidak ada pesan dari wali kelas</span>' +
               '</div>';
      }

      // Pesan terbaru di atas
      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      const namaAnak = anak ? (anak.nama_lengkap || anak.nama || '-') : '-';

      return daftar.map(function(p) {
        return '<div class="card">' +
                 '<div class="peng-head">' +
                   '<div>' +
                     '<span class="peng-nama">' + (p.dari_nama || '-') + '</span>' +
                     '<span class="peng-tgl">' + _tglJam(p.tgl) + '</span>' +
                   '</div>' +
                   '<div>' +
                     '<span class="badge badge--anak">' + namaAnak + '</span>' +
                     '<div class="peng-status">' +
                       '<span class="badge badge--aktif">Disetujui Kepsek</span></div>' +
                   '</div>' +
                 '</div>' +
                 '<p class="peng-konten">' + (p.konten || '-') + '</p>' +
               '</div>';
      }).join('');
    }

    // Modul Pesan Wali Kelas milik Wali Murid, mengembalikan HTML siap tampil
    function waliMuridPesan() {
      if (MODE_API) return '<div id="isi-wali-pesan" data-muat="waliPesan"></div>';
      return _htmlIsiWaliPesan();
    }

    PEMUAT.waliPesan = function() {
      return _muatModul('isi-wali-pesan', [['getBekalDataAnak'], ['getPengumuman']], function(d) {
        _srvIsi({ anak: (d[0] && d[0].anak) || [], pengumuman: d[1] });
        return _htmlIsiWaliPesan();
      }, 'waliPesan', 4);
    };

    function _htmlIsiWaliPesan() {
      _pastikanPenyimpananAnak();

      const anak = _anakSaya();
      pesanAnakAktif = _anakTerpilih(anak, pesanAnakAktif);

      // Penyaring anak hanya dipasang bila anaknya lebih dari satu
      let penyaring = '';
      if (anak.length > 1) {
        const opsi = anak.map(function(s) {
          const dipilih = (String(s.id) === String(pesanAnakAktif)) ? ' selected' : '';
          return '<option value="' + s.id + '"' + dipilih + '>' +
                 (s.nama_lengkap || s.nama || '-') + '</option>';
        }).join('');

        penyaring =
          '<div class="pilih-anak">' +
            '<label class="form-label" for="pesanPilihAnak">Pilih Anak</label>' +
            '<select id="pesanPilihAnak" class="input" onchange="filterPesanByAnak()">' +
              opsi + '</select>' +
          '</div>';
      }

      return '<h1 class="module-title">Pesan dari Wali Kelas</h1>' +

             penyaring +
             '<div id="daftar-pesan">' + htmlPesanWaliKelas(pesanAnakAktif) + '</div>';

    // Ganti anak yang pesannya ditampilkan. Hanya daftarnya yang digambar ulang
    // supaya penyaring di atasnya tidak ikut tersusun ulang.
    function filterPesanByAnak() {
      const el = document.getElementById('pesanPilihAnak');
      const wadah = document.getElementById('daftar-pesan');
      if (!el || !wadah) return;

      pesanAnakAktif = el.value;
      wadah.innerHTML = htmlPesanWaliKelas(pesanAnakAktif);
    }

    // ================= MODUL TAGIHAN (WALI MURID) =================

    // Siapkan penyimpanan tagihan dan biaya bila belum pernah dibuat
    function _pastikanPenyimpananTagihan() {
      ['sip_tagihan', 'sip_biaya'].forEach(function(kunci) {
        if (!localStorage.getItem(kunci)) {
          localStorage.setItem(kunci, JSON.stringify([]));
        }
      });
    }

    // Seluruh tagihan milik satu anak
    function _tagihanAnak(idSiswa) {
      return _srv('tagihan', 'sip_tagihan').filter(function(t) {
        return t && t.id !== undefined && idSiswa !== '' && String(t.id_siswa) === String(idSiswa);
      });
    }

    // Jumlahkan total tagihan, yang sudah lunas, dan sisanya
    function hitungRingkasanTagihan(idSiswa) {
      const daftar = _tagihanAnak(idSiswa);
      let total = 0, dibayar = 0;

      daftar.forEach(function(t) {
        const n = Number(t.nominal) || 0;
        total += n;
        if (String(t.status_bayar || '').toLowerCase() === 'lunas') dibayar += n;
      });

      return { total: total, dibayar: dibayar, sisa: total - dibayar };
    }

    // Tabel tagihan satu anak, lengkap dengan formulir unggah bukti
    function htmlTagihanAnak(idSiswa) {
      const daftar = _tagihanAnak(idSiswa);

      if (daftar.length === 0) {
        return '<p class="pesan-info">Belum ada tagihan untuk anak ini</p>';
      }

      // Jatuh tempo terdekat di atas
      daftar.sort(function(a, b) {
        const ta = new Date(a.jatuh_tempo), tb = new Date(b.jatuh_tempo);
        const va = !isNaN(ta.getTime()), vb = !isNaN(tb.getTime());
        if (va && vb) return ta - tb;
        // Tagihan tanpa tanggal yang benar ditaruh paling bawah
        if (va !== vb) return va ? -1 : 1;
        return (Number(a.id) || 0) - (Number(b.id) || 0);
      });

      // getTagihanWaliMurid sudah menyertakan nama_biaya, jadi daftar biaya
      // hanya perlu dibaca pada jalur localStorage.
      const biaya = SRV.tagihan ? [] : _bacaArr('sip_biaya');
      const kini = new Date();

      const baris = daftar.map(function(t, urut) {
        const b = biaya.find(function(x) { return x && String(x.id) === String(t.id_biaya); });
        const st = _statusTagihan(t, kini);
        const lunas = st.lunas;

        if (!lunas && String(uploadTagihanAktif) === String(t.id)) {

        }

        return html;
      }).join('');

    // Simpan nama berkas bukti pembayaran. Status tagihan sengaja tidak diubah
    // menjadi lunas karena pelunasan harus dikonfirmasi Bendahara lebih dulu.
    // Baca berkas menjadi data URI base64, bentuk yang diminta backend
    function _berkasKeBase64(berkas) {
      return new Promise(function(selesai, gagal) {
        const pembaca = new FileReader();
        pembaca.onload = function() { selesai(pembaca.result); };
        pembaca.onerror = function() { gagal(new Error('Berkas tidak terbaca')); };
        pembaca.readAsDataURL(berkas);
      });
    }

    async function uploadBuktiBayar(tagihanId) {
      const elFile = document.getElementById('buktiFile-' + tagihanId);
      if (!elFile) return;

      if (!elFile.files || elFile.files.length === 0) {
        showNotif('Pilih berkas bukti pembayaran terlebih dahulu', 'error');
        return;
      }

      const daftar = _srv('tagihan', 'sip_tagihan');
      const i = daftar.findIndex(function(t) { return t && String(t.id) === String(tagihanId); });
      if (i === -1) {
        showNotif('Tagihan tidak ditemukan', 'error');
        return;
      }
      if (String(daftar[i].status_bayar || '').toLowerCase() === 'lunas') {
        showNotif('Tagihan ini sudah lunas', 'error');
        return;
      }

      if (MODE_API) {
        const berkas = elFile.files[0];

        // Berkas besar ditolak lebih dulu supaya pengguna tidak menunggu
        // unggahan yang memang akan ditolak Apps Script.
        if (berkas.size > 5 * 1024 * 1024) {
          showNotif('Ukuran berkas maksimal 5 MB', 'error');
          return;
        }

        let base64;
        try {
          base64 = await _berkasKeBase64(berkas);
        } catch (e) {
          showNotif('Berkas tidak dapat dibaca', 'error');
          return;
        }

        uploadTagihanAktif = null;
        await _kirimAksi('bukti-kirim-' + tagihanId, 'uploadBuktiBayar',
          { tagihanId: tagihanId, fileBase64: base64 }, 'tagihanWali', 'Mengunggah');
        return;
      }

      daftar[i].bukti_url = elFile.files[0].name;
      localStorage.setItem('sip_tagihan', JSON.stringify(daftar));

      uploadTagihanAktif = null;
      loadModule('Tagihan');
      showNotif('Bukti pembayaran berhasil diupload. Menunggu konfirmasi Bendahara.', 'success');
    }

      return t === 'semua' || t === 'walimurid' || t === 'siswa_walimurid';
    }

    // jadi ditangani di sini tanpa mengubah fungsi lamanya.
    function _labelTargetWali(target) {
      if (String(target || '') === 'siswa_walimurid') {
        return { teks: 'Siswa & Wali Murid', kelas: 'target-walimurid' };
      }
      return labelTarget(target);

    // Daftar pengumuman resmi yang boleh dibaca wali murid
    function htmlPengumumanWali() {
      const daftar = _srv('pengumuman', 'sip_pengumuman').filter(function(p) {
        return p && String(p.tipe || '') === 'global' &&
               String(p.status || '') === 'approved' && bisaLihat(p.target);
      });

      if (daftar.length === 0) {

                 '<i class="fa-solid fa-inbox kosong-ikon"></i>' +

      // Pengumuman terbaru di atas
      daftar.sort(function(a, b) {
        const selisih = new Date(b.tgl) - new Date(a.tgl);
        if (selisih !== 0 && !isNaN(selisih)) return selisih;
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      // Wali murid tidak berhak membaca daftar akun; role pengirim sudah
      // ikut tersimpan pada pengumumannya sendiri
      const users = Array.isArray(SRV.pengumuman) ? [] : _bacaArr('sip_users');

      return daftar.map(function(p) {
        // Role pengirim dibaca dari pengumumannya, atau dicari lewat akunnya
        let role = String(p.dari_role || '').toLowerCase();
        let subrole = '';
        if (!role) {
          const u = users.find(function(x) { return x && String(x.id) === String(p.dari_id_user); });
          if (u) { role = String(u.role || '').toLowerCase(); subrole = u.subrole || ''; }
        }
        const tg = _labelTargetWali(p.target);

        return '<div class="card">' +
                 '<span class="peng-judul">' + (p.judul || '-') + '</span>' +
                 '<div class="peng-head">' +

                     '<span class="peng-tgl">' + _tglJam(p.tgl) + '</span>' +

                   '<div class="peng-badge">' +
                     '<span class="badge badge--' + (role || 'nonaktif') + '">' +
                       labelRole(role, subrole) + '</span>' +
                     '<span class="badge badge--' + tg.kelas + '">' + tg.teks + '</span>' +
                     '<span class="badge badge--aktif">Resmi</span>' +
                   '</div>' +
                 '</div>' +
                 '<p class="peng-konten">' + (p.konten || '-') + '</p>' +
               '</div>';
      }).join('');
